
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b24">
<meta name="description" content="LUCEECRESCITA X∞ 7.4: un universo di 37 giochi, fantasia, emozioni, viaggi, musica e laboratori creativi.">
<meta name="author" content="Antonello Salvatore Mastropaolo">
<title>Sorprese X∞ 7.4 — Future Play Universe | LUCEECRESCITA</title>
<style>
:root{
  --bg:#100b24;--panel:#1c1538;--panel2:#241b46;
  --gold:#f4d27c;--cyan:#69e4ed;--purple:#a88aff;
  --text:#f8f5ff;--muted:#c9c1e0;--border:#514477;
  --green:#91edbd;--pink:#ffb6e2;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:125px}
body{
  margin:0;color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(ellipse at 10% 0%,#34215d 0,transparent 36%),
    radial-gradient(ellipse at 90% 22%,#12384a 0,transparent 32%),var(--bg);
  line-height:1.6;overflow-wrap:anywhere
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid var(--cyan);outline-offset:3px
}
a{color:var(--cyan)}
button:disabled{opacity:.5;cursor:not-allowed}

/* Header & Navbar Unificata */
header{
  position:sticky;top:0;z-index:100;
  background:#100b24fa;backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border)
}
.header-inner{max-width:1200px;margin:auto;padding:10px 18px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:950;letter-spacing:.07em;color:var(--gold);font-size:clamp(1rem,3vw,1.35rem);text-decoration:none}
.brand small{display:block;font-weight:500;letter-spacing:.03em;color:var(--muted);font-size:.73rem}

/* Menu Globale del Portale */
.global-nav{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding-bottom:8px;border-bottom:1px solid #ffffff12;margin-bottom:8px}
.global-nav a{text-decoration:none;font-size:.85rem;color:var(--muted);font-weight:600;transition:color .2s}
.global-nav a:hover, .global-nav a.active{color:var(--cyan)}

/* Menu Rapido Sezioni 7.4 */
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{
  display:inline-block;padding:5px 10px;text-decoration:none;
  border:1px solid var(--border);border-radius:999px;
  color:var(--text);font-size:.78rem;background:#171131
}
.nav a:hover{background:var(--panel2);border-color:var(--gold);color:var(--gold)}

main{max-width:1200px;margin:auto;padding:20px 16px 60px}
section{margin:28px 0;scroll-margin-top:135px}
.hero{
  padding:clamp(25px,6vw,65px) 22px;text-align:center;
  border:1px solid #7964a5;border-radius:28px;
  background:linear-gradient(140deg,#2b1d50eF,#142b43ee);
  box-shadow:0 15px 55px #0004;position:relative;overflow:hidden
}
.hero:before{content:"✦  ·  ✧  ·  ✦";display:block;color:var(--gold);letter-spacing:1em;margin-bottom:15px}
.hero h1{font-size:clamp(2rem,7vw,4.3rem);line-height:1.08;margin:0;color:var(--gold)}
.hero p{max-width:700px;margin:18px auto;color:var(--muted);font-size:1.08rem}
.hero-art{font-size:clamp(2.5rem,9vw,5rem);letter-spacing:.1em;margin:14px 0}
h2{font-size:clamp(1.45rem,4vw,2rem);color:var(--gold);margin:0 0 8px}
h3{margin:0 0 8px;color:var(--cyan)}
.section-intro{color:var(--muted);margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr))}
.card{
  min-width:0;padding:17px;border-radius:18px;
  border:1px solid var(--border);
  background:linear-gradient(150deg,#21183e,#17122f);
  box-shadow:0 8px 25px #0002
}
.card p{color:var(--muted);margin:7px 0 12px}
.light-card{border-top:3px solid var(--gold)}
.game-card{display:flex;flex-direction:column;gap:8px}
.game-card .emoji{font-size:2rem}
.game-card h3{font-size:1.03rem}
.game-card p{font-size:.91rem;flex:1}
.btn{
  border:1px solid #8e7cb8;border-radius:12px;
  padding:10px 14px;background:#302351;color:var(--text);
  font-weight:700;transition:transform .15s,background .15s;text-decoration:none;display:inline-block
}
.btn:hover{background:#45316c;transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:#20152d;border-color:var(--gold)}
.btn.cyan{background:var(--cyan);color:#10212b;border-color:var(--cyan)}
.btn.danger{border-color:#d17c9a;background:#52243e}
.btn.small{padding:6px 10px;font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
label{display:block;color:var(--muted);font-weight:650;margin:10px 0 5px}
input,select,textarea{
  width:100%;min-width:0;
