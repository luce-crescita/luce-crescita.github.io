<script>
/* =========================================================
   AUDIO ENGINE
   ========================================================= */
var Audio = (function(){
  var ctx = null, master = null, muted = false;
  function ensure(){
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.18;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type, vol){
    ensure();
    if (muted) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.2, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime + dur + 0.05);
  }
  return {
    click: function(){ tone(880, 0.05, 'square', 0.12); },
    flip: function(){ tone(1200, 0.08, 'triangle', 0.15); },
    match: function(){ tone(1047, 0.1, 'sine', 0.2); setTimeout(function(){ tone(1568, 0.15, 'sine', 0.2); }, 60); },
    wrong: function(){ tone(150, 0.25, 'sawtooth', 0.18); },
    win: function(){ [523, 659, 784, 1047, 1319].forEach(function(f, i){ setTimeout(function(){ tone(f, 0.15, 'sine', 0.25); }, i * 80); }); },
    correct: function(){ tone(1047, 0.08, 'sine', 0.2); setTimeout(function(){ tone(1568, 0.12, 'sine', 0.2); }, 60); },
    error: function(){ tone(120, 0.3, 'sawtooth', 0.2); },
    tick: function(){ tone(2000, 0.02, 'square', 0.08); },
    roll: function(){ for(var i=0;i<10;i++) setTimeout(function(){ tone(300+Math.random()*800, 0.04, 'square', 0.1); }, i * 40); },
    diceResult: function(){ tone(1319, 0.1, 'sine', 0.25); setTimeout(function(){ tone(1760, 0.2, 'sine', 0.25); }, 80); },
    open: function(){ tone(440, 0.08, 'sine', 0.12); setTimeout(function(){ tone(880, 0.1, 'sine', 0.12); }, 60); },
    close: function(){ tone(660, 0.08, 'sine', 0.1); setTimeout(function(){ tone(330, 0.1, 'sine', 0.1); }, 60); },
    paint: function(){ tone(1600, 0.015, 'square', 0.05); },
    hint: function(){ tone(660, 0.1, 'triangle', 0.1); setTimeout(function(){ tone(880, 0.12, 'triangle', 0.1); }, 80); },
    countdown: function(){ tone(440, 0.1, 'square', 0.15); },
    timeUp: function(){ tone(200, 0.5, 'sawtooth', 0.2); }
  };
})();
</script><script>
(function(){
"use strict";

/* =========================================================
   PIXEL ART
   ========================================================= */
(function(){
  var canvas = document.getElementById('pixelCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var SIZE = 16, CELL = canvas.width / SIZE;
  var color = '#00fff0', drawing = false, erase = false;
  var colors = ['#00fff0','#ff00aa','#a855f7','#00ff88','#ff0040','#ffaa00','#ffffff','#6b5a8a','#ff66cc','#66ccff'];
  var palette = document.getElementById('palette');
  colors.forEach(function(c, i){
    var sw = document.createElement('button');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c;
    sw.style.color = c;
    sw.type = 'button';
    sw.addEventListener('click', function(){
      Audio.click();
      document.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('active'); });
      sw.classList.add('active');
      color = c;
    });
    palette.appendChild(sw);
  });
  function clear(){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  clear();
  function getCell(e){
    var r = canvas.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { cx: Math.floor(x / (r.width / SIZE)), cy: Math.floor(y / (r.height / SIZE)) };
  }
  function paint(e){
    var cell = getCell(e);
    if (cell.cx < 0 || cell.cx >= SIZE || cell.cy < 0 || cell.cy >= SIZE) return;
    ctx.fillStyle = erase ? '#000' : color;
    ctx.fillRect(cell.cx * CELL, cell.cy * CELL, CELL, CELL);
    Audio.paint();
  }
  canvas.addEventListener('mousedown', function(e){ if (e.button === 2) erase = true; drawing = true; paint(e); e.preventDefault(); });
  canvas.addEventListener('mousemove', function(e){ if (drawing) paint(e); });
  window.addEventListener('mouseup', function(){ drawing = false; erase = false; });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('touchstart', function(e){ drawing = true; paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function(e){ if (drawing) paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', function(){ drawing = false; });
  document.getElementById('clearPixels').addEventListener('click', function(){ clear(); Audio.click(); });
  document.getElementById('exportPng').addEventListener('click', function(){
    Audio.correct();
    var a = document.createElement('a');
    a.download = 'null-sector-art.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
})();

/* =========================================================
   MUSIC CREATOR
   ========================================================= */
(function(){
  var grid = document.getElementById('noteGrid');
  if (!grid) return;
  var NOTES = ['DO','RE','MI','FA','SOL','LA','SI'];
  var RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8];
  var bf = document.getElementById('baseFreq'), bv = document.getElementById('baseFreqVal');
  var vol = document.getElementById('volume'), vv = document.getElementById('volumeVal');
  var ctx = null, osc = null, gain = null;
  function play(i){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    var f = parseFloat(bf.value) * RATIOS[i];
    var v = parseFloat(vol.value) / 100;
    if (osc) { try { osc.stop(); } catch(e) {} }
    if (gain) { try { gain.disconnect(); } catch(e) {} }
    gain = ctx.createGain();
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(v * 0.3, ctx.currentTime + 0.02);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
    gain.connect(ctx.destination);
    osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    osc.connect(gain);
    osc.start();
    osc.stop(ctx.currentTime + 1.3);
  }
  NOTES.forEach(function(n, i){
    var b = document.createElement('button');
    b.className = 'note-btn';
    b.textContent = n;
    b.type = 'button';
    b.addEventListener('click', function(){ play(i); });
    grid.appendChild(b);
  });
  bf.addEventListener('input', function(){ bv.textContent = bf.value; });
  vol.addEventListener('input', function(){ vv.textContent = vol.value + '%'; });
})();

/* =========================================================
   GIOCHI AVANZATI
   ========================================================= */
(function(){
  var grid = document.getElementById('gamesGrid');
  var modal = document.getElementById('gameModal');
  var title = document.getElementById('gameTitle');
  var content = document.getElementById('gameContent');
  if (!grid) return;

  var GAMES = [
    { id: 'memory', emoji: '💎', title: 'CRISTALLO', desc: 'Memory multidimensionale 4D' },
    { id: 'quiz', emoji: '⏳', title: 'TEMPO', desc: 'Quiz con tempo limite' },
    { id: 'anagram', emoji: '☁️', title: 'NUVOLE', desc: 'Anagrammi con AI' },
    { id: 'enigma', emoji: '🔮', title: 'ENIGMA', desc: 'Indovina con grafico 3D' },
    { id: 'dice', emoji: '🎲', title: 'DADO', desc: 'Dado quantico multi-lancio' },
    { id: 'draw', emoji: '🌌', title: 'SOGNI', desc: 'Disegno con riconoscimento AI' }
  ];

  GAMES.forEach(function(g){
    var c = document.createElement('div');
    c.className = 'game-card';
    c.innerHTML = '<div class="emoji">' + g.emoji + '</div><h3>' + g.title + '</h3><p>' + g.desc + '</p><button class="btn magenta" data-game="' + g.id + '">▶ PLAY</button>';
    grid.appendChild(c);
  });

  function open(t, h){ Audio.open(); title.textContent = t; content.innerHTML = h; modal.hidden = false; document.body.style.overflow = 'hidden'; }
  function close(){ Audio.close(); modal.hidden = true; document.body.style.overflow = ''; content.innerHTML = ''; }
  document.getElementById('gameClose').addEventListener('click', close);
  modal.addEventListener('click', function(e){ if (e.target === modal) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modal.hidden) close(); });
  grid.addEventListener('click', function(e){
    var b = e.target.closest('[data-game]');
    if (!b) return;
    var id = b.getAttribute('data-game');
    if (id === 'memory') openMemory();
    else if (id === 'quiz') openQuiz();
    else if (id === 'anagram') openAnagram();
    else if (id === 'enigma') openEnigma();
    else if (id === 'dice') openDice();
    else if (id === 'draw') openDraw();
  });

  /* =========================================================
     MEMORY MULTIDIMENSIONALE
     ========================================================= */
  function openMemory(){
    var difficulties = {
      easy: { cols: 2, rows: 2, pairs: 2, label: 'Facile (2×2)' },
      normal: { cols: 4, rows: 3, pairs: 6, label: 'Normale (4×3)' },
      hard: { cols: 4, rows: 4, pairs: 8, label: 'Difficile (4×4)' },
      extreme: { cols: 5, rows: 4, pairs: 10, label: 'Estremo (5×4)' }
    };
    var currentDiff = 'normal';

    function render(){
      var d = difficulties[currentDiff];
      var syms = ['💎','⏳','☁️','🌌','✨','🔮','⚡','🌟','🔥','💠'].slice(0, d.pairs);
      var deck = syms.concat(syms).sort(function(){ return Math.random() - 0.5; });
      var flipped = [], matched = 0, moves = 0, startTime = Date.now(), timer = null;

      var diffHtml = '<div class="difficulty-row">';
      Object.keys(difficulties).forEach(function(k){
        diffHtml += '<button class="diff-btn' + (k === currentDiff ? ' active' : '') + '" data-diff="' + k + '">' + difficulties[k].label + '</button>';
      });
      diffHtml += '</div>';

      open('💎 CRISTALLO', diffHtml + '<p style="text-align:center;color:var(--muted);font-size:0.85rem">Mosse: <strong id="memMoves" style="color:var(--neon-cyan)">0</strong> · Tempo: <strong id="memTime" style="color:var(--gold)">0s</strong></p><div class="mem-grid" id="mg" style="grid-template-columns:repeat(' + d.cols + ',1fr)"></div>');

      var mg = document.getElementById('mg');

      document.querySelectorAll('.diff-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          currentDiff = btn.getAttribute('data-diff');
          Audio.click();
          if (timer) clearInterval(timer);
          render();
        });
      });

      function renderGrid(){
        mg.innerHTML = '';
        deck.forEach(function(s, i){
          var c = document.createElement('button');
          c.className = 'mem-card';
          c.type = 'button';
          if (flipped.indexOf(i) !== -1) { c.classList.add('flipped'); c.textContent = s; }
          c.addEventListener('click', function(){ click(i); });
          mg.appendChild(c);
        });
      }

      function click(i){
        if (flipped.indexOf(i) !== -1 || flipped.length === 2) return;
        Audio.flip();
        flipped.push(i);
        renderGrid();
        if (flipped.length === 2) {
          moves++;
          document.getElementById('memMoves').textContent = moves;
          var a = flipped[0], b = flipped[1];
          if (deck[a] === deck[b]) {
            Audio.match();
            matched += 2;
            setTimeout(function(){
              var all = mg.querySelectorAll('.mem-card');
              for (var k = 0; k < all.length; k++) {
                if (deck[k] === deck[a]) all[k].classList.add('matched');
              }
              flipped = [];
              if (matched === deck.length) {
                if (timer) clearInterval(timer);
                var elapsed = Math.floor((Date.now() - startTime) / 1000);
                setTimeout(function(){
                  Audio.win();
                  content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:50px">🏆</p><p style="color:var(--neon-lime);font-weight:900;font-size:1.4rem">VINTO!</p><p style="color:var(--gold)">Mosse: ' + moves + ' · Tempo: ' + elapsed + 's</p><div class="center-btns"><button class="btn-big btn-cyan" id="memRestart">🔄 RIGIOCA</button><button class="btn-big btn-magenta" onclick="document.getElementById(\'gameClose\').click()">CHIUDI</button></div></div>';
                  document.getElementById('memRestart').addEventListener('click', function(){ render(); });
                }, 400);
              } else {
                renderGrid();
              }
            }, 500);
          } else {
            Audio.wrong();
            setTimeout(function(){ flipped = []; renderGrid(); }, 800);
          }
        }
      }

      renderGrid();
      timer = setInterval(function(){
        var el = document.getElementById('memTime');
        if (el) el.textContent = Math.floor((Date.now() - startTime) / 1000) + 's';
      }, 1000);
    }

    render();
  }

  /* =========================================================
     QUIZ CON TEMPO LIMITE
     ========================================================= */
  function openQuiz(){
    var qs = [
      { q: 'Quanti principi ha il Manifesto?', a: ['3', '4', '5'], c: 1 },
      { q: 'Cosa rappresenta il Tesseract?', a: ['Un cerchio', 'Un ipercubo 4D', 'Una sfera'], c: 1 },
      { q: 'Quale frequenza è simbolica?', a: ['100 Hz', '432 Hz', '1000 Hz'], c: 1 },
      { q: "Cos'è l'Energy Weaver?", a: ['Simulatore toroidale', 'Database', 'Gioco di carte'], c: 0 },
      { q: 'Quanti astri ha la Costellazione?', a: ['3', '4', '5'], c: 1 },
      { q: 'Quale colore è associato al brand?', a: ['Rosso', 'Ciano', 'Verde'], c: 1 },
      { q: 'Cosa rappresenta X∞?', a: ['Un numero', 'Il moltiplicatore infinito', 'Una variabile'], c: 1 }
    ];
    var cur = 0, score = 0, timePerQ = 10, timer = null, timeLeft = timePerQ;

    open('⏳ TEMPO', '');
    render();

    function render(){
      if (cur >= qs.length) {
        if (timer) clearInterval(timer);
        Audio.win();
        content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:50px">🏆</p><p style="color:var(--neon-cyan);font-weight:900;font-size:1.6rem">SCORE: ' + score + '/' + qs.length + '</p><div class="center-btns"><button class="btn-big btn-lime" id="quizRestart">🔄 RIGIOCA</button><button class="btn-big btn-magenta" onclick="document.getElementById(\'gameClose\').click()">CHIUDI</button></div></div>';
        document.getElementById('quizRestart').addEventListener('click', function(){ cur = 0; score = 0; render(); });
        return;
      }
      var q = qs[cur];
      timeLeft = timePerQ;
      content.innerHTML = '<p style="text-align:center;color:var(--muted);font-size:0.85rem">DOMANDA ' + (cur+1) + '/' + qs.length + ' · SCORE: ' + score + '</p><div class="timer" id="timerEl">⏱ ' + timeLeft + 's</div><p style="text-align:center;font-weight:900;font-size:1.1rem;margin:16px 0">' + q.q + '</p><div class="quiz-options" id="qo"></div>';
      var qo = document.getElementById('qo');
      q.a.forEach(function(ans, i){
        var b = document.createElement('button');
        b.className = 'quiz-opt';
        b.textContent = ans;
        b.type = 'button';
        b.addEventListener('click', function(){
          if (timer) clearInterval(timer);
          var all = qo.querySelectorAll('button');
          for (var k = 0; k < all.length; k++) all[k].disabled = true;
          if (i === q.c) { b.classList.add('correct'); score++; Audio.correct(); }
          else { b.classList.add('wrong'); qo.children[q.c].classList.add('correct'); Audio.error(); }
          setTimeout(function(){ cur++; render(); }, 1200);
        });
        qo.appendChild(b);
      });
      if (timer) clearInterval(timer);
      timer = setInterval(function(){
        timeLeft--;
        var el = document.getElementById('timerEl');
        if (el) {
          el.textContent = '⏱ ' + timeLeft + 's';
          if (timeLeft <= 3) el.classList.add('warning');
        }
        if (timeLeft <= 0) {
          clearInterval(timer);
          Audio.timeUp();
          var all = qo.querySelectorAll('button');
          for (var k = 0; k < all.length; k++) all[k].disabled = true;
          qo.children[q.c].classList.add('correct');
          setTimeout(function(){ cur++; render(); }, 1500);
        }
      }, 1000);
    }
  }

  /* =========================================================
     ANAGRAMMI CON AI
     ========================================================= */
  function openAnagram(){
    var words = [
      { w: 'CRISTALLO', hint: 'Un cristallo di luce pura' },
      { w: 'TEMPO', hint: 'La sfera del tempo' },
      { w: 'NUVOLE', hint: 'Forme mutevoli' },
      { w: 'SOGNI', hint: 'Matrice infinita' },
      { w: 'ENERGIA', hint: 'Flusso del Weaver' }
    ];
    var idx = 0, score = 0, hintLevel = 0;

    function scramble(w){
      var a = w.split('');
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a.join('');
    }

    function getHint(word, level){
      if (level === 1) return 'Prima lettera: ' + word[0];
      if (level === 2) return 'Prime 2 lettere: ' + word.slice(0, 2);
      if (level === 3) return 'Prime 3 lettere: ' + word.slice(0, 3);
      return 'Nessun aiuto';
    }

    function render(){
      if (idx >= words.length) {
        Audio.win();
        content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:50px">🎉</p><p style="color:var(--neon-lime);font-weight:900;font-size:1.6rem">RISOLTI: ' + score + '/' + words.length + '</p><div class="center-btns"><button class="btn-big btn-lime" id="anaRestart">🔄 RIGIOCA</button><button class="btn-big btn-magenta" onclick="document.getElementById(\'gameClose\').click()">CHIUDI</button></div></div>';
        document.getElementById('anaRestart').addEventListener('click', function(){ idx = 0; score = 0; hintLevel = 0; render(); });
        return;
      }
      var it = words[idx];
      var o = it.w;
      var sc = scramble(o);
      hintLevel = 0;
      var html = '<p style="text-align:center;color:var(--muted);font-size:0.85rem">PAROLA ' + (idx+1) + '/' + words.length + ' · RISOLTE: ' + score + '</p>';
      html += '<div class="ana-letters">';
      for (var i = 0; i < sc.length; i++) html += '<span class="ana-letter">' + sc[i] + '</span>';
      html += '</div>';
      html += '<input class="ana-input" id="ai" placeholder="SCRIVI..." maxlength="' + o.length + '" autocomplete="off">';
      html += '<div class="feedback" id="af"></div>';
      html += '<div class="hint-box" id="hintBox">💡 ' + it.hint + '</div>';
      html += '<div class="center-btns"><button class="btn-big btn-cyan" id="ac">✓ VERIFICA</button><button class="btn-big btn-magenta" id="ah">💡 AIUTO</button><button class="btn-big btn-lime" id="as">⏭ SALTA</button></div>';
      content.innerHTML = html;

      var ai = document.getElementById('ai');
      var af = document.getElementById('af');
      var hintBox = document.getElementById('hintBox');

      function check(){
        if (!ai.value.trim()) { af.textContent = 'SCRIVI QUALCOSA!'; af.className = 'feedback wrong'; Audio.error(); return; }
        if (ai.value.toUpperCase() === o) {
          af.textContent = '✓ CORRETTO!';
          af.className = 'feedback correct';
          Audio.correct();
          score++;
          ai.disabled = true;
          setTimeout(function(){ idx++; render(); }, 900);
        } else {
          af.textContent = '✗ RIPROVA';
          af.className = 'feedback wrong';
          Audio.error();
          ai.select();
        }
      }

      document.getElementById('ac').addEventListener('click', check);
      ai.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
      document.getElementById('as').addEventListener('click', function(){ Audio.tick(); idx++; render(); });
      document.getElementById('ah').addEventListener('click', function(){
        hintLevel = Math.min(hintLevel + 1, 3);
        hintBox.textContent = '💡 ' + getHint(o, hintLevel);
        Audio.hint();
      });
      setTimeout(function(){ ai.focus(); }, 100);
    }
    render();
  }

  /* =========================================================
     ENIGMA CON GRAFICO 3D
     ========================================================= */
  function openEnigma(){
    var secret = Math.floor(Math.random() * 100) + 1;
    var attempts = 0;

    open('🔮 ENIGMA', '<p style="text-align:center;color:var(--muted);font-size:0.9rem">Indovina il numero tra 1 e 100</p><div class="thermometer"><div class="thermometer-fill" id="thermoFill" style="width:0%"></div><div class="thermometer-label" id="thermoLabel">?</div></div><input class="enigma-input" id="ei" type="number" min="1" max="100" placeholder="?"><div class="feedback" id="ef">INSERISCI UN NUMERO</div><div class="center-btns"><button class="btn-big btn-cyan" id="ec">✓ PROVA</button></div><p style="text-align:center;font-size:0.75rem;color:var(--muted);margin-top:12px">TENTATIVI: <span id="ea">0</span></p>');

    var ei = document.getElementById('ei');
    var ef = document.getElementById('ef');
    var ea = document.getElementById('ea');
    var thermoFill = document.getElementById('thermoFill');
    var thermoLabel = document.getElementById('thermoLabel');

    function check(){
      var v = parseInt(ei.value, 10);
      if (isNaN(v) || v < 1 || v > 100) { Audio.error(); ef.textContent = 'NUMERO 1-100'; ef.className = 'feedback wrong'; return; }
      attempts++;
      ea.textContent = attempts;
      var distance = Math.abs(v - secret);
      var percent = Math.max(0, 100 - distance);
      thermoFill.style.width = percent + '%';
      thermoLabel.textContent = distance === 0 ? '🎯' : distance <= 5 ? '🔥' : distance <= 15 ? '🌡' : distance <= 30 ? '❄' : '🧊';

      if (v === secret) {
        Audio.win();
        ef.textContent = '🎉 CORRETTO IN ' + attempts + ' TENTATIVI!';
        ef.className = 'feedback correct';
        ei.disabled = true;
      } else if (v < secret) {
        Audio.tick();
        ef.textContent = '⬆ TROPPO BASSO';
        ef.className = 'feedback wrong';
      } else {
        Audio.tick();
        ef.textContent = '⬇ TROPPO ALTO';
        ef.className = 'feedback wrong';
      }
      ei.value = '';
      ei.focus();
    }

    document.getElementById('ec').addEventListener('click', check);
    ei.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
    ei.focus();
  }

  /* =========================================================
     DADO QUANTICO
     ========================================================= */
  function openDice(){
    var total = 0;
    var rolls = [];
    var faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];

    function render(){
      var html = '<div style="text-align:center"><div class="dice" id="df">🎲</div><div class="dice-result" id="dr">FORTUNA: ' + total + '</div>';
      html += '<div class="probability-bar" id="probBar">';
      for (var i = 0; i < 6; i++) {
        var count = rolls.filter(function(r){ return r === i + 1; }).length;
        var pct = rolls.length > 0 ? (count / rolls.length * 100) : (100 / 6);
        html += '<div class="prob-segment" style="width:' + pct + '%">' + (count > 0 ? count : '') + '</div>';
      }
      html += '</div>';
      html += '<p style="text-align:center;color:var(--muted);font-size:0.75rem">Lancio: ' + rolls.length + ' · Ultimo: ' + (rolls[rolls.length-1] || '-') + '</p>';
      html += '<div class="center-btns"><button class="btn-big btn-magenta" id="rb">🎲 LANCIA</button><button class="btn-big btn-cyan" id="r10">🎲 ×10</button><button class="btn-big btn-lime" id="rr">↺ RESET</button></div>';
      html += '</div>';
      content.innerHTML = html;

      var df = document.getElementById('df');
      var dr = document.getElementById('dr');
      var rb = document.getElementById('rb');

      rb.addEventListener('click', function(){
        rollOnce(df, dr);
      });

      document.getElementById('r10').addEventListener('click', function(){
        var count = 0;
        var iv = setInterval(function(){
          rollOnce(df, dr, true);
          count++;
          if (count >= 10) { clearInterval(iv); render(); }
        }, 150);
      });

      document.getElementById('rr').addEventListener('click', function(){
        total = 0;
        rolls = [];
        Audio.click();
        render();
      });
    }

    function rollOnce(df, dr, silent){
      Audio.roll();
      rb.disabled = true;
      df.classList.add('rolling');
      var c = 0;
      var iv = setInterval(function(){
        df.textContent = faces[Math.floor(Math.random() * 6)];
        c++;
        if (c > 8) {
          clearInterval(iv);
          var v = Math.floor(Math.random() * 6) + 1;
          df.textContent = faces[v - 1];
          total += v;
          rolls.push(v);
          dr.textContent = 'FORTUNA: ' + total + ' (ultimo: ' + v + ')';
          df.classList.remove('rolling');
          Audio.diceResult();
          if (!silent) {
            rb.disabled = false;
            setTimeout(function(){ render(); }, 800);
          }
        }
      }, 60);
    }

    render();
  }

  /* =========================================================
     DISEGNO CON RICONOSCIMENTO AI
     ========================================================= */
  function openDraw(){
    var SIZE = 8;
    var target = [];
    for (var y = 0; y < SIZE; y++) for (var x = 0; x < SIZE; x++) {
      target.push((x === 3 || x === 4) || (y === 3 || y === 4) ? 1 : 0);
    }

    open('🌌 SOGNI', '<p style="text-align:center;color:var(--muted);font-size:0.9rem">Riproduci il pattern segreto 8×8</p><canvas class="draw-canvas" id="dc" width="320" height="320"></canvas><div class="center-btns"><button class="btn-big btn-cyan" id="dv">✓ VERIFICA</button><button class="btn-big btn-lime" id="dh">💡 AIUTO</button><button class="btn-big btn-magenta" id="dr">🗑 CANCELLA</button></div><div class="draw-score" id="scoreDisplay">Similarità: 0%</div>');

    var dc = document.getElementById('dc');
    var ctx = dc.getContext('2d');
    var CELL = dc.width / SIZE;
    var user = new Array(SIZE * SIZE).fill(0);

    function draw(){
      for (var y = 0; y < SIZE; y++) for (var x = 0; x < SIZE; x++) {
        ctx.fillStyle = user[y * SIZE + x] ? '#00fff0' : '#000';
        ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
        ctx.strokeStyle = 'rgba(168,85,247,0.2)';
        ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    draw();

    dc.addEventListener('click', function(e){
      var r = dc.getBoundingClientRect();
      var x = Math.floor((e.clientX - r.left) / (r.width / SIZE));
      var y = Math.floor((e.clientY - r.top) / (r.height / SIZE));
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
      user[y * SIZE + x] = user[y * SIZE + x] ? 0 : 1;
      Audio.paint();
      draw();
      updateScore();
    });

    function updateScore(){
      var matches = 0;
      for (var i = 0; i < target.length; i++) if (target[i] === user[i]) matches++;
      var pct = Math.round(matches / target.length * 100);
      var el = document.getElementById('scoreDisplay');
      el.textContent = 'Similarità: ' + pct + '%';
      el.className = 'draw-score' + (pct === 100 ? ' perfect' : '');
      return pct;
    }

    document.getElementById('dv').addEventListener('click', function(){
      var pct = updateScore();
      if (pct === 100) {
        Audio.win();
        alert('🎉 PERFETTO! Pattern identico!');
      } else if (pct >= 80) {
        Audio.correct();
        alert('👍 Molto vicino! Similarità: ' + pct + '%');
      } else {
        Audio.error();
        alert('✗ Riprova! Similarità: ' + pct + '%');
      }
    });

    document.getElementById('dh').addEventListener('click', function(){
      Audio.hint();
      var row = Math.floor(Math.random() * SIZE);
      var col = Math.floor(Math.random() * SIZE);
      if (target[row * SIZE + col] === 1) {
        alert('💡 La cella riga ' + (row+1) + ', colonna ' + (col+1) + ' è illuminata');
      } else {
        alert('💡 La cella riga ' + (row+1) + ', colonna ' + (col+1) + ' è vuota');
      }
    });

    document.getElementById('dr').addEventListener('click', function(){
      Audio.click();
      user = new Array(SIZE * SIZE).fill(0);
      draw();
      updateScore();
    });
  }
})();
})();
</script>
