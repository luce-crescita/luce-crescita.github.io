<script>
/* =========================================================
   AUDIO ENGINE
   ========================================================= */
const SFX = (function(){
  let ctx = null, master = null, muted = false;
  function ensure(){
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.18;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type, vol){
    ensure();
    if (muted) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol || 0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.05);
  }
  return {
    click(){ tone(880, 0.05, 'square', 0.12); },
    flip(){ tone(1200, 0.08, 'triangle', 0.15); },
    match(){ tone(1047, 0.1, 'sine', 0.2); setTimeout(()=>tone(1568, 0.15, 'sine', 0.2), 60); },
    wrong(){ tone(150, 0.25, 'sawtooth', 0.18); },
    win(){ [523, 659, 784, 1047, 1319].forEach((f,i)=>setTimeout(()=>tone(f, 0.15, 'sine', 0.25), i*80)); },
    correct(){ tone(1047, 0.08, 'sine', 0.2); setTimeout(()=>tone(1568, 0.12, 'sine', 0.2), 60); },
    error(){ tone(120, 0.3, 'sawtooth', 0.2); },
    roll(){ for(let i=0;i<10;i++) setTimeout(()=>tone(300+Math.random()*800, 0.04, 'square', 0.1), i*40); },
    diceResult(){ tone(1319, 0.1, 'sine', 0.25); setTimeout(()=>tone(1760, 0.2, 'sine', 0.25), 80); },
    tick(){ tone(2000, 0.02, 'square', 0.08); },
    open(){ tone(440, 0.08, 'sine', 0.12); setTimeout(()=>tone(880, 0.1, 'sine', 0.12), 60); },
    close(){ tone(660, 0.08, 'sine', 0.1); setTimeout(()=>tone(330, 0.1, 'sine', 0.1), 60); },
    paint(){ tone(1600, 0.015, 'square', 0.05); }
  };
})();

/* =========================================================
   PIXEL ART
   ========================================================= */
(function(){
  const canvas = document.getElementById('pixelCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const SIZE = 16, CELL = canvas.width / SIZE;
  let color = '#00fff0', drawing = false, erase = false;
  const colors = ['#00fff0','#ff00aa','#a855f7','#00ff88','#ff0040','#ffaa00','#ffffff','#6b5a8a','#ff66cc','#66ccff'];
  const palette = document.getElementById('palette');
  colors.forEach((c, i) => {
    const sw = document.createElement('button');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c;
    sw.style.color = c;
    sw.type = 'button';
    sw.addEventListener('click', () => {
      SFX.click();
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      color = c;
    });
    palette.appendChild(sw);
  });
  function clear(){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  clear();
  function getCell(e){
    const r = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { cx: Math.floor(x / (r.width / SIZE)), cy: Math.floor(y / (r.height / SIZE)) };
  }
  function paint(e){
    const { cx, cy } = getCell(e);
    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) return;
    ctx.fillStyle = erase ? '#000' : color;
    ctx.fillRect(cx * CELL, cy * CELL, CELL, CELL);
    SFX.paint();
  }
  canvas.addEventListener('mousedown', e => { if (e.button === 2) erase = true; drawing = true; paint(e); e.preventDefault(); });
  canvas.addEventListener('mousemove', e => { if (drawing) paint(e); });
  window.addEventListener('mouseup', () => { drawing = false; erase = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => { drawing = true; paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', e => { if (drawing) paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', () => drawing = false);
  document.getElementById('clearPixels').addEventListener('click', () => { clear(); SFX.click(); });
  document.getElementById('exportPng').addEventListener('click', () => {
    SFX.correct();
    const a = document.createElement('a');
    a.download = 'null-sector-art.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
})();

/* =========================================================
   MUSIC CREATOR
   ========================================================= */
(function(){
  const grid = document.getElementById('noteGrid');
  if (!grid) return;
  const NOTES = ['DO','RE','MI','FA','SOL','LA','SI'];
  const RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8];
  const bf = document.getElementById('baseFreq'), bv = document.getElementById('baseFreqVal');
  const vol = document.getElementById('volume'), vv = document.getElementById('volumeVal');
  let ctx = null, osc = null, gain = null;
  function play(i){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const f = parseFloat(bf.value) * RATIOS[i];
    const v = parseFloat(vol.value) / 100;
    if (osc) { try { osc.stop(); } catch(e) {} }
    if (gain) { try { gain.disconnect(); } catch(e) {} }
    gain = ctx.createGain();
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(v * 0.3, ctx.currentTime + 0.02);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
    gain.connect(ctx.destination);
    osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    osc.connect(gain);
    osc.start();
    osc.stop(ctx.currentTime + 1.3);
  }
  NOTES.forEach((n, i) => {
    const b = document.createElement('button');
    b.className = 'note-btn';
    b.textContent = n;
    b.type = 'button';
    b.addEventListener('click', () => play(i));
    grid.appendChild(b);
  });
  bf.addEventListener('input', () => { bv.textContent = bf.value; });
  vol.addEventListener('input', () => { vv.textContent = vol.value + '%'; });
})();

/* =========================================================
   GIOCHI
   ========================================================= */
(function(){
  const grid = document.getElementById('gamesGrid');
  const modal = document.getElementById('gameModal');
  const title = document.getElementById('gameTitle');
  const content = document.getElementById('gameContent');
  if (!grid) return;

  const GAMES = [
    { id: 'memory', emoji: '💎', title: 'CRISTALLO', desc: 'Memory: trova le coppie' },
    { id: 'quiz', emoji: '⏳', title: 'TEMPO', desc: 'Quiz filosofico' },
    { id: 'anagram', emoji: '☁️', title: 'NUVOLE', desc: 'Anagrammi cosmici' },
    { id: 'enigma', emoji: '🔮', title: 'ENIGMA', desc: 'Indovina il numero' },
    { id: 'dice', emoji: '🎲', title: 'DADO', desc: 'Lancia il dado' },
    { id: 'draw', emoji: '🌌', title: 'SOGNI', desc: 'Disegna il pattern' }
  ];

  GAMES.forEach(g => {
    const c = document.createElement('div');
    c.className = 'game-card';
    c.innerHTML = `<div class="emoji">${g.emoji}</div><h3>${g.title}</h3><p>${g.desc}</p><button class="btn magenta" data-game="${g.id}">▶ PLAY</button>`;
    grid.appendChild(c);
  });

  function open(t, h){ SFX.open(); title.textContent = t; content.innerHTML = h; modal.hidden = false; document.body.style.overflow = 'hidden'; }
  function close(){ SFX.close(); modal.hidden = true; document.body.style.overflow = ''; content.innerHTML = ''; }
  document.getElementById('gameClose').addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) close(); });
  grid.addEventListener('click', e => {
    const b = e.target.closest('[data-game]');
    if (!b) return;
    const id = b.dataset.game;
    if (id === 'memory') openMemory();
    else if (id === 'quiz') openQuiz();
    else if (id === 'anagram') openAnagram();
    else if (id === 'enigma') openEnigma();
    else if (id === 'dice') openDice();
    else if (id === 'draw') openDraw();
  });

  /* MEMORY */
  function openMemory(){
    const syms = ['💎','⏳','☁️','🌌','✨','🔮'];
    const deck = [...syms, ...syms].sort(() => Math.random() - 0.5);
    let flipped = [], matched = 0, moves = 0;
    open('💎 CRISTALLO', `<p style="text-align:center;color:var(--muted);font-size:11px;margin-bottom:8px">MOSSE: <strong id="mm" style="color:var(--neon-cyan)">0</strong></p><div class="mem-grid" id="mg"></div>`);
    const mg = document.getElementById('mg');
    function render(){
      mg.innerHTML = '';
      deck.forEach((s, i) => {
        const c = document.createElement('button');
        c.className = 'mem-card';
        c.type = 'button';
        if (flipped.includes(i)) { c.classList.add('flipped'); c.textContent = s; }
        c.addEventListener('click', () => click(i));
        mg.appendChild(c);
      });
    }
    function click(i){
      if (flipped.includes(i) || flipped.length === 2) return;
      SFX.flip();
      flipped.push(i);
      render();
      if (flipped.length === 2) {
        moves++;
        document.getElementById('mm').textContent = moves;
        const [a, b] = flipped;
        if (deck[a] === deck[b]) {
          SFX.match();
          matched += 2;
          setTimeout(() => {
            mg.querySelectorAll('.mem-card').forEach((c, idx) => {
              if (deck[idx] === deck[a]) c.classList.add('matched');
            });
            flipped = [];
            if (matched === syms.length * 2) {
              setTimeout(() => { SFX.win(); content.innerHTML = `<p style="text-align:center;color:var(--neon-lime);font-weight:700;font-size:18px">🎉 VINTO IN ${moves} MOSSE!</p>`; }, 400);
            } else render();
          }, 500);
        } else {
          SFX.wrong();
          setTimeout(() => { flipped = []; render(); }, 800);
        }
      }
    }
    render();
  }

  /* QUIZ — Il Tempo */
  function openQuiz(){
    const qs = [
      { q: 'Quanti principi ha il Manifesto?', a: ['3', '4', '5'], c: 1 },
      { q: 'Cosa rappresenta il Tesseract?', a: ['Un cerchio', 'Un ipercubo 4D', 'Una sfera'], c: 1 },
      { q: 'Quale frequenza è simbolica?', a: ['100 Hz', '432 Hz', '1000 Hz'], c: 1 },
      { q: "Cos'è l'Energy Weaver?", a: ['Un simulatore toroidale', 'Un database', 'Un gioco di carte'], c: 0 },
      { q: 'Quanti astri ha la Costellazione?', a: ['3', '4', '5'], c: 1 }
    ];
    let cur = 0, score = 0;

    function render(){
      if (cur >= qs.length) {
        SFX.win();
        content.innerHTML = `
          <div style="text-align:center;padding:20px 0">
            <p style="font-size:40px;margin-bottom:12px">🏆</p>
            <p style="color:var(--neon-cyan);font-weight:700;font-size:20px;margin-bottom:8px">SCORE: ${score}/${qs.length}</p>
            <p style="color:var(--muted);font-size:12px;margin-bottom:20px">${score === qs.length ? 'PERFETTO!' : score >= 3 ? 'BUONA CONOSCENZA' : 'RIPROVA'}</p>
            <button class="btn lime" id="quizRestart">🔄 ANCORA</button>
            <button class="btn" id="quizEnd">CHIUDI</button>
          </div>
        `;
        document.getElementById('quizRestart').addEventListener('click', () => { cur = 0; score = 0; render(); });
        document.getElementById('quizEnd').addEventListener('click', close);
        return;
      }
      const q = qs[cur];
      content.innerHTML = `
        <p style="text-align:center;color:var(--muted);font-size:11px;margin-bottom:8px">DOMANDA ${cur+1}/${qs.length} · SCORE: ${score}</p>
        <div style="background:rgba(0,255,240,0.1);height:3px;margin-bottom:16px">
          <div style="background:var(--neon-cyan);height:3px;width:${(cur/qs.length)*100}%;transition:width 0.3s"></div>
        </div>
        <p style="text-align:center;font-weight:700;font-size:14px;margin-bottom:16px;color:var(--text)">${q.q}</p>
        <div class="quiz-options" id="qo"></div>
      `;
      const qo = document.getElementById('qo');
      q.a.forEach((ans, i) => {
        const b = document.createElement('button');
        b.className = 'quiz-opt';
        b.textContent = ans;
        b.type = 'button';
        b.addEventListener('click', () => {
          qo.querySelectorAll('button').forEach(x => x.disabled = true);
          if (i === q.c) {
            b.classList.add('correct');
            score++;
            SFX.correct();
          } else {
            b.classList.add('wrong');
            qo.children[q.c].classList.add('correct');
            SFX.error();
          }
          setTimeout(() => { cur++; render(); }, 1200);
        });
        qo.appendChild(b);
      });
    }
    render();
  }

  /* ANAGRAM — Le Nuvole */
  function openAnagram(){
    const words = [
      { w: 'CRISTALLO', hint: 'Un cristallo di luce pura' },
      { w: 'TEMPO', hint: 'La sfera del tempo' },
      { w: 'NUVOLE', hint: 'Forme mutevoli nel cielo' },
      { w: 'SOGNI', hint: "La matrice dell'infinito" },
      { w: 'ENERGIA', hint: 'Il flusso del Weaver' }
    ];
    let idx = 0, score = 0;

    function scramble(w){
      const arr = w.split('');
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.join('');
    }

    function render(){
      if (idx >= words.length) {
        SFX.win();
        content.innerHTML = `
          <div style="text-align:center;padding:20px 0">
            <p style="font-size:40px;margin-bottom:12px">🎉</p>
            <p style="color:var(--neon-lime);font-weight:700;font-size:20px;margin-bottom:8px">RISOLTI: ${score}/${words.length}</p>
            <p style="color:var(--muted);font-size:12px;margin-bottom:20px">${score === words.length ? 'PERFETTO!' : 'RIPROVA'}</p>
            <button class="btn lime" id="anaRestart">🔄 ANCORA</button>
            <button class="btn" id="anaEnd">CHIUDI</button>
          </div>
        `;
        document.getElementById('anaRestart').addEventListener('click', () => { idx = 0; score = 0; render(); });
        document.getElementById('anaEnd').addEventListener('click', close);
        return;
      }
      const item = words[idx];
      const o = item.w;
      const sc = scramble(o);
      content.innerHTML = `
        <p style="text-align:center;color:var(--muted);font-size:11px;margin-bottom:8px">PAROLA ${idx+1}/${words.length} · RISOLTE: ${score}</p>
        <div style="background:rgba(0,255,240,0.1);height:3px;margin-bottom:16px">
          <div style="background:var(--neon-cyan);height:3px;width:${(idx/words.length)*100}%;transition:width 0.3s"></div>
        </div>
        <p style="text-align:center;color:var(--muted);font-size:11px;margin-bottom:12px">💡 ${item.hint}</p>
        <div class="ana-letters">${sc.split('').map(l => `<span class="ana-letter">${l}</span>`).join('')}</div>
        <input class="ana-input" id="ai" placeholder="SCRIVI..." maxlength="${o.length}" autocomplete="off" autocapitalize="characters">
        <div class="feedback" id="af"></div>
        <div style="text-align:center">
          <button class="btn lime" id="ac">✓ VERIFICA</button>
          <button class="btn" id="as">⏭ SALTA</button>
        </div>
      `;
      const ai = document.getElementById('ai'), af = document.getElementById('af');
      function check(){
        if (!ai.value.trim()) {
          af.textContent = 'SCRIVI QUALCOSA!';
          af.className = 'feedback wrong';
          SFX.error();
          return;
        }
        if (ai.value.toUpperCase() === o) {
          af.textContent = '✓ CORRETTO!';
          af.className = 'feedback correct';
          SFX.correct();
          score++;
          ai.disabled = true;
          setTimeout(() => { idx++; render(); }, 900);
        } else {
          af.textContent = '✗ RIPROVA';
          af.className = 'feedback wrong';
          SFX.error();
          ai.select();
        }
      }
      document.getElementById('ac').addEventListener('click', check);
      ai.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      document.getElementById('as').addEventListener('click', () => { SFX.tick(); idx++; render(); });
      setTimeout(() => ai.focus(), 100);
    }
    render();
  }

  /* ENIGMA */
  function openEnigma(){
    const secret = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    open('🔮 ENIGMA', `<p style="text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px">INDOVINA IL NUMERO TRA 1 E 100</p><input class="enigma-input" id="ei" type="number" min="1" max="100" placeholder="?"><div class="feedback" id="ef">INSERISCI UN NUMERO</div><div style="text-align:center"><button class="btn magenta" id="ec">PROVA</button></div><p style="text-align:center;font-size:10px;color:var(--muted);margin-top:12px">TENTATIVI: <span id="ea">0</span></p>`);
    const ei = document.getElementById('ei'), ef = document.getElementById('ef'), ea = document.getElementById('ea');
    function check(){
      const v = parseInt(ei.value, 10);
      if (isNaN(v) || v < 1 || v > 100) {
        SFX.error();
        ef.textContent = 'NUMERO TRA 1 E 100';
        ef.className = 'feedback wrong';
        return;
      }
      attempts++;
      ea.textContent = attempts;
      if (v === secret) {
        SFX.win();
        ef.textContent = `🎉 CORRETTO IN ${attempts} TENTATIVI!`;
        ef.className = 'feedback correct';
        ei.disabled = true;
      } else if (v < secret) {
        SFX.tick();
        ef.textContent = '⬆ TROPPO BASSO';
        ef.className = 'feedback wrong';
      } else {
        SFX.tick();
        ef.textContent = '⬇ TROPPO ALTO';
        ef.className = 'feedback wrong';
      }
      ei.value = '';
      ei.focus();
    }
    document.getElementById('ec').addEventListener('click', check);
    ei.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    ei.focus();
  }

  /* DADO */
  function openDice(){
    let total = 0;
    open('🎲 DADO', `<div style="text-align:center"><div class="dice" id="df">🎲</div><div class="dice-result" id="dr">FORTUNA: 0</div><button class="btn magenta" id="rb" style="margin-top:16px">🎲 LANCIA</button></div>`);
    const df = document.getElementById('df'), dr = document.getElementById('dr'), rb = document.getElementById('rb');
    const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    rb.addEventListener('click', () => {
      SFX.roll();
      rb.disabled = true;
      let c = 0;
      const iv = setInterval(() => {
        df.textContent = faces[Math.floor(Math.random() * 6)];
        c++;
        if (c > 10) {
          clearInterval(iv);
          const v = Math.floor(Math.random() * 6) + 1;
          df.textContent = faces[v - 1];
          total += v;
          dr.textContent = `FORTUNA: ${total} (ULTIMO: ${v})`;
          SFX.diceResult();
          rb.disabled = false;
        }
      }, 50);
    });
  }

  /* DRAW */
  function openDraw(){
    const SIZE = 8;
    const secret = [];
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) secret.push((x === 3 || x === 4) || (y === 3 || y === 4) ? 1 : 0);
    open('🌌 SOGNI', `<p style="text-align:center;color:var(--muted);font-size:11px;margin-bottom:12px">RIPRODUCI IL PATTERN ${SIZE}×${SIZE}</p><canvas id="dc" width="320" height="320" style="display:block;width:100%;max-width:300px;aspect-ratio:1;margin:12px auto;background:#000;border:1px solid var(--neon-violet);cursor:crosshair;touch-action:none"></canvas><div style="text-align:center"><button class="btn lime" id="dv">✓ VERIFICA</button> <button class="btn" id="dh">💡 AIUTO</button></div><div class="feedback" id="dfb"></div>`);
    const dc = document.getElementById('dc'), ctx = dc.getContext('2d'), CELL = dc.width / SIZE;
    const user = new Array(SIZE * SIZE).fill(0);
    function draw(){
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
        ctx.fillStyle = user[y * SIZE + x] ? '#00fff0' : '#000';
        ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
      }
    }
    draw();
    dc.addEventListener('click', e => {
      const r = dc.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / (r.width / SIZE));
      const y = Math.floor((e.clientY - r.top) / (r.height / SIZE));
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
      user[y * SIZE + x] = user[y * SIZE + x] ? 0 : 1;
      SFX.paint();
      draw();
    });
    document.getElementById('dv').addEventListener('click', () => {
      const fb = document.getElementById('dfb');
      const ok = secret.every((v, i) => v === user[i]);
      if (ok) { SFX.win(); fb.textContent = '🎉 PERFETTO!'; fb.className = 'feedback correct'; }
      else {
        SFX.error();
        const r = secret.filter((v, i) => v === user[i]).length;
        fb.textContent = `GIUSTE: ${r}/${SIZE * SIZE}`;
        fb.className = 'feedback wrong';
      }
    });
    document.getElementById('dh').addEventListener('click', () => {
      SFX.tick();
      const fb = document.getElementById('dfb');
      fb.textContent = '💡 IL PATTERN È UNA CROCE';
      fb.className = 'feedback';
      fb.style.color = 'var(--neon-magenta)';
    });
  }
})();
</script>
</body>
</html>
