
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100b24">
<title>Sorprese X∞ — Luce e Crescita X∞</title>
<style>
:root{--bg:#100b24;--gold:#f4d27c;--cyan:#69e4ed;--text:#f8f5ff;--muted:#c9c1e0;--border:#514477;--green:#91edbd;--pink:#ffb6e2}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:system-ui,sans-serif;background:var(--bg);line-height:1.6;padding:16px}
header{background:#1c1538;padding:12px 16px;border-radius:12px;margin-bottom:20px}
header a{color:var(--cyan);text-decoration:none;margin-right:12px;font-size:.9rem}
h1,h2{color:var(--gold)}
h3{color:var(--cyan)}
.card{background:#1c1538;border:1px solid var(--border);border-radius:16px;padding:16px;margin:16px 0}
.btn{background:#302351;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;margin:4px;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);color:#20152d}
.btn.cyan{background:var(--cyan);color:#10212b}
#pixelCanvas{width:100%;max-width:320px;aspect-ratio:1;background:#0d0820;border:1px solid var(--border);border-radius:10px;display:block;margin:10px auto;cursor:crosshair;touch-action:none}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:200px;margin:10px auto}
.swatch{width:100%;aspect-ratio:1;border-radius:8px;border:1px solid #ffffff22;cursor:pointer}
.swatch.active{border:3px solid var(--gold)}
.note-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:600px;margin:14px auto}
.note-btn{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:#17112f;color:var(--text);font-weight:700;cursor:pointer}
.note-btn:active{background:var(--cyan);color:#10212b}
.game-card{display:flex;flex-direction:column;gap:8px}
.game-card .emoji{font-size:2rem}
.game-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.game-modal[hidden]{display:none}
.game-modal-inner{background:#1c1538;border:1px solid var(--gold);border-radius:20px;padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.game-modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.game-close{background:none;border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:16px auto}
.memory-card{aspect-ratio:1;background:#302351;border:1px solid var(--border);border-radius:10px;font-size:1.5rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.memory-card.flipped{background:var(--cyan);color:#10212b}
.memory-card.matched{background:var(--green);color:#10212b}
.quiz-option{display:block;width:100%;padding:12px;margin:6px 0;border:1px solid var(--border);background:#302351;color:var(--text);border-radius:10px;cursor:pointer;text-align:left}
.quiz-option.correct{background:var(--green);color:#10212b}
.quiz-option.wrong{background:#a04060;color:#fff}
.anagram-input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0d0820;color:var(--text);font-size:1.2rem;text-align:center;margin:12px 0;text-transform:uppercase}
.anagram-letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.anagram-letter{padding:10px 14px;background:#241b46;border:1px solid var(--border);border-radius:8px;font-size:1.3rem;font-weight:700;color:var(--gold)}
.draw-canvas{width:100%;max-width:300px;aspect-ratio:1;background:#0d0820;border:1px solid var(--border);border-radius:10px;display:block;margin:12px auto;cursor:crosshair;touch-action:none}
.enigma-input{width:100px;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0d0820;color:var(--text);font-size:1.2rem;text-align:center;margin:12px auto;display:block}
.feedback{text-align:center;margin:12px 0;font-weight:700}
.feedback.correct{color:var(--green)}
.feedback.wrong{color:var(--pink)}
.dice{font-size:5rem;text-align:center;display:block}
.dice-result{color:var(--gold);font-size:1.2rem;font-weight:700;text-align:center;margin-top:12px}
</style>
</head>
<body>

<header>
  <a href="index.html">← Home</a>
  <a href="manifesto.html">Manifesto</a>
  <a href="energia-eterna.html">Energy Weaver</a>
  <a href="sorprese.html"><strong>Sorprese X∞</strong></a>
  <a href="progetti.html">Progetti</a>
  <a href="guida.html">Guida</a>
</header>

<main>
  <h1>🎮 Sorprese X∞</h1>
  <p style="color:var(--muted)">Laboratori creativi e mini-giochi con audio.</p>

  <h2>🎨 Pixel Art</h2>
  <div class="card">
    <canvas id="pixelCanvas" width="320" height="320"></canvas>
    <div class="palette" id="palette"></div>
    <div style="text-align:center">
      <button id="exportPng" class="btn gold">⬇ Esporta PNG</button>
      <button id="clearPixels" class="btn">🗑 Cancella</button>
    </div>
  </div>

  <h2>🎵 Music Creator</h2>
  <div class="card">
    <div style="text-align:center">
      <label>Freq: <input type="range" id="baseFreq" min="220" max="880" value="440"><span id="baseFreqVal">440</span></label>
      <label>Vol: <input type="range" id="volume" min="0" max="100" value="30"><span id="volumeVal">30%</span></label>
    </div>
    <div class="note-grid" id="noteGrid"></div>
  </div>

  <h2>🎲 Giochi</h2>
  <div id="gamesGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px"></div>
</main>

<div class="game-modal" id="gameModal" hidden>
  <div class="game-modal-inner">
    <div class="game-modal-header">
      <h3 id="gameTitle">Gioco</h3>
      <button class="game-close" id="gameClose">✕</button>
    </div>
    <div id="gameContent"></div>
  </div>
</div>

<footer style="margin-top:40px;text-align:center;color:var(--muted);font-size:.85rem">
  © 2025–2026 Mastropaolo Antonello Salvatore · Luce e Crescita X∞
</footer>

<script>
/* =========================================================
   SOUND ENGINE (effetti sonori)
   ========================================================= */
const SFX = (function(){
  let ctx = null, master = null, muted = false;

  function ensure(){
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.15;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function tone(freq, dur, type, vol){
    ensure();
    if (muted) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol || 0.2, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.05);
  }

  return {
    click(){ tone(660, 0.08, 'square', 0.15); },
    flip(){ tone(880, 0.12, 'triangle', 0.18); },
    match(){ tone(523, 0.1, 'sine', 0.2); setTimeout(()=>tone(784, 0.15, 'sine', 0.2), 80); },
    wrong(){ tone(220, 0.2, 'sawtooth', 0.18); },
    win(){ [523, 659, 784, 1047].forEach((f,i)=>setTimeout(()=>tone(f, 0.18, 'sine', 0.22), i*90)); },
    correct(){ tone(523, 0.1, 'sine', 0.2); setTimeout(()=>tone(784, 0.15, 'sine', 0.2), 70); },
    error(){ tone(200, 0.25, 'sawtooth', 0.2); },
    roll(){ for (let i = 0; i < 8; i++) setTimeout(()=>tone(400 + Math.random()*400, 0.05, 'square', 0.12), i*50); },
    diceResult(){ tone(880, 0.1, 'sine', 0.2); setTimeout(()=>tone(1175, 0.2, 'sine', 0.2), 80); },
    tick(){ tone(1200, 0.03, 'square', 0.08); },
    open(){ tone(440, 0.08, 'sine', 0.15); setTimeout(()=>tone(660, 0.1, 'sine', 0.15), 60); },
    close(){ tone(440, 0.08, 'sine', 0.12); setTimeout(()=>tone(330, 0.1, 'sine', 0.12), 60); },
    paint(){ tone(880, 0.02, 'square', 0.06); }
  };
})();

/* =========================================================
   PIXEL ART
   ========================================================= */
(function(){
  const canvas = document.getElementById('pixelCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const SIZE = 16, CELL = canvas.width / SIZE;
  let color = '#f8f5ff', drawing = false, erase = false;
  const colors = ['#f8f5ff','#f4d27c','#69e4ed','#a88aff','#91edbd','#ffb6e2','#ff6b6b','#4c9aff','#ffd166','#9d4edd'];
  const palette = document.getElementById('palette');

  colors.forEach((c, i) => {
    const sw = document.createElement('button');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c;
    sw.type = 'button';
    sw.addEventListener('click', () => {
      SFX.click();
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      color = c;
    });
    palette.appendChild(sw);
  });

  function clear(){ ctx.fillStyle = '#0d0820'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  clear();

  function getCell(e){
    const r = canvas.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { cx: Math.floor(x / (r.width / SIZE)), cy: Math.floor(y / (r.height / SIZE)) };
  }

  function paint(e){
    const { cx, cy } = getCell(e);
    if (cx < 0 || cx >= SIZE || cy < 0 || cy >= SIZE) return;
    ctx.fillStyle = erase ? '#0d0820' : color;
    ctx.fillRect(cx * CELL, cy * CELL, CELL, CELL);
    SFX.paint();
  }

  canvas.addEventListener('mousedown', e => { if (e.button === 2) erase = true; drawing = true; paint(e); e.preventDefault(); });
  canvas.addEventListener('mousemove', e => { if (drawing) paint(e); });
  window.addEventListener('mouseup', () => { drawing = false; erase = false; });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('touchstart', e => { drawing = true; paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', e => { if (drawing) paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', () => drawing = false);

  document.getElementById('clearPixels').addEventListener('click', () => { clear(); SFX.click(); });
  document.getElementById('exportPng').addEventListener('click', () => {
    SFX.correct();
    const a = document.createElement('a');
    a.download = 'pixel-art.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
})();

/* =========================================================
   MUSIC CREATOR
   ========================================================= */
(function(){
  const grid = document.getElementById('noteGrid');
  if (!grid) return;
  const NOTES = ['Do','Re','Mi','Fa','Sol','La','Si'];
  const RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8];
  const bf = document.getElementById('baseFreq'), bv = document.getElementById('baseFreqVal');
  const vol = document.getElementById('volume'), vv = document.getElementById('volumeVal');
  let ctx = null, osc = null, gain = null;

  function play(i){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const f = parseFloat(bf.value) * RATIOS[i];
    const v = parseFloat(vol.value) / 100;
    if (osc) { try { osc.stop(); } catch(e) {} }
    if (gain) { try { gain.disconnect(); } catch(e) {} }
    gain = ctx.createGain();
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(v * 0.3, ctx.currentTime + 0.02);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
    gain.connect(ctx.destination);
    osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    osc.connect(gain);
    osc.start();
    osc.stop(ctx.currentTime + 1.3);
  }

  NOTES.forEach((n, i) => {
    const b = document.createElement('button');
    b.className = 'note-btn';
    b.textContent = n;
    b.type = 'button';
    b.addEventListener('click', () => play(i));
    grid.appendChild(b);
  });

  bf.addEventListener('input', () => { bv.textContent = bf.value; });
  vol.addEventListener('input', () => { vv.textContent = vol.value + '%'; });
})();

/* =========================================================
   GIOCHI
   ========================================================= */
(function(){
  const grid = document.getElementById('gamesGrid');
  const modal = document.getElementById('gameModal');
  const title = document.getElementById('gameTitle');
  const content = document.getElementById('gameContent');
  if (!grid) return;

  const GAMES = [
    { id: 'memory', emoji: '💎', title: 'Il Cristallo', desc: 'Memory: trova le 6 coppie.' },
    { id: 'quiz', emoji: '⏳', title: 'Il Tempo', desc: 'Quiz filosofico: 5 domande.' },
    { id: 'anagram', emoji: '☁️', title: 'Le Nuvole', desc: 'Anagrammi: ricostruisci 5 parole.' },
    { id: 'enigma', emoji: '🔮', title: 'Enigma della Sfera', desc: 'Indovina il numero segreto.' },
    { id: 'dice', emoji: '🎲', title: 'Dado Quantico', desc: 'Lancia il dado.' },
    { id: 'draw', emoji: '🌌', title: 'I Sogni', desc: 'Disegna il pattern segreto.' }
  ];

  GAMES.forEach(g => {
    const c = document.createElement('div');
    c.className = 'card game-card';
    c.innerHTML = `<div class="emoji">${g.emoji}</div><h3>${g.title}</h3><p style="color:var(--muted);font-size:.9rem">${g.desc}</p><button class="btn gold" data-game="${g.id}">▶ Gioca</button>`;
    grid.appendChild(c);
  });

  function open(t, h){ SFX.open(); title.textContent = t; content.innerHTML = h; modal.hidden = false; document.body.style.overflow = 'hidden'; }
  function close(){ SFX.close(); modal.hidden = true; document.body.style.overflow = ''; content.innerHTML = ''; }

  document.getElementById('gameClose').addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) close(); });

  grid.addEventListener('click', e => {
    const b = e.target.closest('[data-game]');
    if (!b) return;
    const id = b.dataset.game;
    if (id === 'memory') openMemory();
    else if (id === 'quiz') openQuiz();
    else if (id === 'anagram') openAnagram();
    else if (id === 'enigma') openEnigma();
    else if (id === 'dice') openDice();
    else if (id === 'draw') openDraw();
  });

  /* -------- MEMORY -------- */
  function openMemory(){
    const syms = ['💎','⏳','☁️','🌌','✨','🔮'];
    const deck = [...syms, ...syms].sort(() => Math.random() - 0.5);
    let flipped = [], matched = 0, moves = 0;

    open('💎 Memory', `<p style="text-align:center">Mosse: <strong id="mm">0</strong></p><div class="memory-grid" id="mg"></div>`);
    const mg = document.getElementById('mg');

    function render(){
      mg.innerHTML = '';
      deck.forEach((s, i) => {
        const c = document.createElement('button');
        c.className = 'memory-card';
        c.type = 'button';
        if (flipped.includes(i)) { c.classList.add('flipped'); c.textContent = s; }
        c.addEventListener('click', () => click(i));
        mg.appendChild(c);
      });
    }

    function click(i){
      if (flipped.includes(i) || flipped.length === 2) return;
      SFX.flip();
      flipped.push(i);
      render();
      if (flipped.length === 2) {
        moves++;
        document.getElementById('mm').textContent = moves;
        const [a, b] = flipped;
        if (deck[a] === deck[b]) {
          SFX.match();
          matched += 2;
          setTimeout(() => {
            mg.querySelectorAll('.memory-card').forEach((c, idx) => {
              if (deck[idx] === deck[a]) c.classList.add('matched');
            });
            flipped = [];
            if (matched === syms.length * 2) {
              setTimeout(() => { SFX.win(); content.innerHTML = `<p style="text-align:center;color:#91edbd;font-weight:700">🎉 Vinto in ${moves} mosse!</p>`; }, 300);
            } else render();
          }, 400);
        } else {
          SFX.wrong();
          setTimeout(() => { flipped = []; render(); }, 800);
        }
      }
    }
    render();
  }

  /* -------- QUIZ (Il Tempo) -------- */
  function openQuiz(){
    const qs = [
      { q: 'Quanti principi ha il Manifesto?', a: ['3', '4', '5'], c: 1 },
      { q: 'Cosa rappresenta il Tesseract?', a: ['Un cerchio', 'Un ipercubo 4D', 'Una sfera'], c: 1 },
      { q: 'Quale frequenza è simbolica?', a: ['100 Hz', '432 Hz', '1000 Hz'], c: 1 },
      { q: "Cos'è l'Energy Weaver?", a: ['Un simulatore toroidale', 'Un database', 'Un gioco di carte'], c: 0 },
      { q: 'Quanti astri ha la Costellazione?', a: ['3', '4', '5'], c: 1 }
    ];
    let cur = 0, score = 0;

    function render(){
      if (cur >= qs.length) {
        SFX.win();
        content.innerHTML = `
          <div style="text-align:center;padding:20px 0;">
            <p style="font-size:2rem;margin-bottom:12px;">🏆</p>
            <p style="color:#f4d27c;font-weight:700;font-size:1.4rem;margin-bottom:8px;">Punteggio finale: ${score}/${qs.length}</p>
            <p style="color:#c9c1e0;font-size:0.9rem;margin-bottom:20px;">${score === qs.length ? 'Perfetto! Conosci il Manifesto.' : score >= 3 ? 'Buona conoscenza!' : 'Riprova per migliorare.'}</p>
            <button class="btn gold" id="quizRestart">🔄 Gioca ancora</button>
            <button class="btn" id="quizEnd" style="margin-left:8px;">Chiudi</button>
          </div>
        `;
        document.getElementById('quizRestart').addEventListener('click', () => { cur = 0; score = 0; render(); });
        document.getElementById('quizEnd').addEventListener('click', close);
        return;
      }

      const q = qs[cur];
      content.innerHTML = `
        <p style="text-align:center;color:#c9c1e0;margin-bottom:8px;">Domanda ${cur+1} di ${qs.length} · Punteggio: ${score}</p>
        <div style="background:rgba(56,189,248,0.1);height:4px;border-radius:2px;margin-bottom:16px;">
          <div style="background:#38bdf8;height:4px;border-radius:2px;width:${(cur/qs.length)*100}%;transition:width 0.3s;"></div>
        </div>
        <p style="text-align:center;font-weight:700;font-size:1.1rem;margin-bottom:16px;">${q.q}</p>
        <div id="qo" style="display:flex;flex-direction:column;gap:8px;"></div>
      `;
      const qo = document.getElementById('qo');
      q.a.forEach((ans, i) => {
        const b = document.createElement('button');
        b.className = 'quiz-option';
        b.textContent = ans;
        b.type = 'button';
        b.addEventListener('click', () => {
          qo.querySelectorAll('button').forEach(x => x.disabled = true);
          if (i === q.c) {
            b.classList.add('correct');
            score++;
            SFX.correct();
          } else {
            b.classList.add('wrong');
            qo.children[q.c].classList.add('correct');
            SFX.error();
          }
          setTimeout(() => { cur++; render(); }, 1200);
        });
        qo.appendChild(b);
      });
    }
    render();
  }

  /* -------- ANAGRAM (Le Nuvole) -------- */
  function openAnagram(){
    const words = [
      { w: 'CRISTALLO', hint: 'Un cristallo di luce pura' },
      { w: 'TEMPO', hint: 'La sfera del tempo' },
      { w: 'NUVOLE', hint: 'Forme mutevoli nel cielo' },
      { w: 'SOGNI', hint: "La matrice dell'infinito" },
      { w: 'ENERGIA', hint: 'Il flusso del Weaver' }
    ];
    let idx = 0, score = 0;

    function scramble(w){
      const arr = w.split('');
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr.join('');
    }

    function render(){
      if (idx >= words.length) {
        SFX.win();
        content.innerHTML = `
          <div style="text-align:center;padding:20px 0;">
            <p style="font-size:2rem;margin-bottom:12px;">🎉</p>
            <p style="color:#91edbd;font-weight:700;font-size:1.4rem;margin-bottom:8px;">Risolti: ${score}/${words.length}</p>
            <p style="color:#c9c1e0;font-size:0.9rem;margin-bottom:20px;">${score === words.length ? 'Perfetto!' : 'Riprova per migliorare.'}</p>
            <button class="btn gold" id="anaRestart">🔄 Gioca ancora</button>
            <button class="btn" id="anaEnd" style="margin-left:8px;">Chiudi</button>
          </div>
        `;
        document.getElementById('anaRestart').addEventListener('click', () => { idx = 0; score = 0; render(); });
        document.getElementById('anaEnd').addEventListener('click', close);
        return;
      }

      const item = words[idx];
      const o = item.w;
      const sc = scramble(o);

      content.innerHTML = `
        <p style="text-align:center;color:#c9c1e0;margin-bottom:8px;">Parola ${idx+1} di ${words.length} · Risolte: ${score}</p>
        <div style="background:rgba(56,189,248,0.1);height:4px;border-radius:2px;margin-bottom:16px;">
          <div style="background:#69e4ed;height:4px;border-radius:2px;width:${(idx/words.length)*100}%;transition:width 0.3s;"></div>
        </div>
        <p style="text-align:center;color:#c9c1e0;font-size:0.85rem;margin-bottom:12px;">💡 ${item.hint}</p>
        <div class="anagram-letters">${sc.split('').map(l => `<span class="anagram-letter">${l}</span>`).join('')}</div>
        <input class="anagram-input" id="ai" placeholder="Scrivi la parola..." maxlength="${o.length}" autocomplete="off" autocapitalize="characters">
        <div class="feedback" id="af"></div>
        <div style="text-align:center">
          <button class="btn cyan" id="ac">✓ Verifica</button>
          <button class="btn" id="as">⏭ Salta</button>
        </div>
      `;

      const ai = document.getElementById('ai'), af = document.getElementById('af');

      function check(){
        if (!ai.value.trim()) {
          af.textContent = 'Scrivi qualcosa!';
          af.className = 'feedback wrong';
          SFX.error();
          return;
        }
        if (ai.value.toUpperCase() === o) {
          af.textContent = '✓ Corretto!';
          af.className = 'feedback correct';
          SFX.correct();
          score++;
          ai.disabled = true;
          setTimeout(() => { idx++; render(); }, 900);
        } else {
          af.textContent = '✗ Riprova';
          af.className = 'feedback wrong';
          SFX.error();
          ai.select();
        }
      }

      document.getElementById('ac').addEventListener('click', check);
      ai.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      document.getElementById('as').addEventListener('click', () => { SFX.tick(); idx++; render(); });

      setTimeout(() => ai.focus(), 100);
    }
    render();
  }

  /* -------- ENIGMA -------- */
  function openEnigma(){
    const secret = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;
    open('🔮 Enigma', `<p style="text-align:center;color:#c9c1e0">Indovina il numero tra 1 e 100.</p><input class="enigma-input" id="ei" type="number" min="1" max="100"><div class="feedback" id="ef">Inserisci un numero</div><div style="text-align:center"><button class="btn cyan" id="ec">Prova</button></div><p style="text-align:center;font-size:.8rem;color:#c9c1e0">Tentativi: <span id="ea">0</span></p>`);
    const ei = document.getElementById('ei'), ef = document.getElementById('ef'), ea = document.getElementById('ea');

    function check(){
      const v = parseInt(ei.value, 10);
      if (isNaN(v) || v < 1 || v > 100) {
        SFX.error();
        ef.textContent = 'Numero tra 1 e 100';
        ef.className = 'feedback wrong';
        return;
      }
      attempts++;
      ea.textContent = attempts;
      if (v === secret) {
        SFX.win();
        ef.textContent = `🎉 Corretto in ${attempts} tentativi!`;
        ef.className = 'feedback correct';
        ei.disabled = true;
      } else if (v < secret) {
        SFX.tick();
        ef.textContent = '⬆ Troppo basso';
        ef.className = 'feedback wrong';
      } else {
        SFX.tick();
        ef.textContent = '⬇ Troppo alto';
        ef.className = 'feedback wrong';
      }
      ei.value = '';
      ei.focus();
    }

    document.getElementById('ec').addEventListener('click', check);
    ei.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
    ei.focus();
  }

  /* -------- DICE -------- */
  function openDice(){
    let total = 0;
    open('🎲 Dado', `<div style="text-align:center"><div class="dice" id="df">🎲</div><div class="dice-result" id="dr">Fortuna: 0</div><button class="btn gold" id="rb" style="margin-top:16px">🎲 Lancia</button></div>`);
    const df = document.getElementById('df'), dr = document.getElementById('dr'), rb = document.getElementById('rb');
    const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];

    rb.addEventListener('click', () => {
      SFX.roll();
      rb.disabled = true;
      let c = 0;
      const iv = setInterval(() => {
        df.textContent = faces[Math.floor(Math.random() * 6)];
        c++;
        if (c > 10) {
          clearInterval(iv);
          const v = Math.floor(Math.random() * 6) + 1;
          df.textContent = faces[v - 1];
          total += v;
          dr.textContent = `Fortuna: ${total} (ultimo: ${v})`;
          SFX.diceResult();
          rb.disabled = false;
        }
      }, 50);
    });
  }

  /* -------- DRAW -------- */
  function openDraw(){
    const SIZE = 8;
    const secret = [];
    for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) secret.push((x === 3 || x === 4) || (y === 3 || y === 4) ? 1 : 0);
    open('🌌 Disegna', `<p style="text-align:center;color:#c9c1e0">Riproduci il pattern ${SIZE}×${SIZE}.</p><canvas class="draw-canvas" id="dc" width="320" height="320"></canvas><div style="text-align:center"><button class="btn cyan" id="dv">Verifica</button> <button class="btn" id="dh">Suggerimento</button></div><div class="feedback" id="dfb"></div>`);
    const dc = document.getElementById('dc'), ctx = dc.getContext('2d'), CELL = dc.width / SIZE;
    const user = new Array(SIZE * SIZE).fill(0);

    function draw(){
      for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
        ctx.fillStyle = user[y * SIZE + x] ? '#69e4ed' : '#0d0820';
                ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
      }
    }
    draw();

    dc.addEventListener('click', e => {
      const r = dc.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / (r.width / SIZE));
      const y = Math.floor((e.clientY - r.top) / (r.height / SIZE));
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
      user[y * SIZE + x] = user[y * SIZE + x] ? 0 : 1;
      SFX.paint();
      draw();
    });

    document.getElementById('dv').addEventListener('click', () => {
      const fb = document.getElementById('dfb');
      const ok = secret.every((v, i) => v === user[i]);
      if (ok) { SFX.win(); fb.textContent = '🎉 Perfetto!'; fb.className = 'feedback correct'; }
      else {
        SFX.error();
        const r = secret.filter((v, i) => v === user[i]).length;
        fb.textContent = `Giuste: ${r}/${SIZE * SIZE}`;
        fb.className = 'feedback wrong';
      }
    });

    document.getElementById('dh').addEventListener('click', () => {
      SFX.tick();
      const fb = document.getElementById('dfb');
      fb.textContent = '💡 Il pattern è una croce.';
      fb.className = 'feedback';
      fb.style.color = '#f4d27c';
    });
  }
})();
</script>
