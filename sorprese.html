<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorprese X∞ — LUCEECRESCITA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Sorprese X∞</h1>
    <p>Laboratorio creativo per allenare fantasia e curiosità</p>
</header>

<main>
    <section style="text-align: center;">
        <h2>La Costellazione delle Idee</h2>
        <p>Ogni stella custodisce un piccolo universo. Tocca una stella e scopri la sua visione segreta.</p>
        
        <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-top: 2rem;">
            <button class="star-btn" onclick="openVision('cristallo')">💎 Il pianeta di cristallo</button>
            <button class="star-btn" onclick="openVision('tempo')">⌛ La biblioteca del tempo</button>
            <button class="star-btn" onclick="openVision('nuvole')">☁ Il giardino delle nuvole</button>
            <button class="star-btn" onclick="openVision('sogni')">🌌 L'oceano dei sogni</button>
        </div>
    </section>
</main>

<!-- Finestra Modale per le visioni stellari -->
<div id="visionModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeVision()">&times;</span>
        <h3 id="modalTitle">Titolo Stella</h3>
        <p id="modalDescription">Descrizione Segreta della costellazione...</p>
    </div>
</div>

<script>
    const visions = {
        cristallo: {
            title: "Il Pianeta di Cristallo",
            text: "Un mondo dove i pensieri si riflettono sulle pareti di roccia lucida, trasformando le idee astratte in bellissime sculture geometriche visibili a tutti."
        },
        tempo: {
            title: "La Biblioteca del Tempo",
            text: "Qui ogni secondo passato è catalogato in un libro di sabbia dorata. Sfoggerai le pagine per ricordare le tue intuizioni passate e riprogettarle."
        },
        nuvole: {
            title: "Il Giardino delle Nuvole",
            text: "Un ecosistema sospeso dove i sogni più leggeri prendono la forma di soffici cumulonembi colorati, capaci di piovere soluzioni creative."
        },
        sogni: {
            title: "L'Oceano dei Sogni",
            text: "Un mare profondo fatto di pura energia blu notte. Immergiti per pescare frammenti di storie non ancora scritte e visioni futuristiche."
        }
    };

    function openVision(key) {
        document.getElementById('modalTitle').innerText = visions[key].title;
        document.getElementById('modalDescription').innerText = visions[key].text;
        document.getElementById('visionModal').style.display = 'flex';
    }

    function closeVision() {
        document.getElementById('visionModal').style.display = 'none';
    }

    // Chiude cliccando fuori dal modale
    window.onclick = function(event) {
        let modal = document.getElementById('visionModal');
        if (event.target == modal) { modal.style.display = 'none'; }
    }
</script>

</body>
</html>
