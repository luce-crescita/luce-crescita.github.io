<script>
(function(){
"use strict";

/* =========================================================
   PIXEL MATRIX
   ========================================================= */
(function(){
  var canvas = document.getElementById('pixelCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var SIZE = 16, CELL = canvas.width / SIZE;
  var color = '#00fff0', drawing = false, erase = false;
  var colors = ['#00fff0','#ff00aa','#a855f7','#00ff88','#ff0040','#ffaa00','#ffffff','#6b5a8a','#ff66cc','#66ccff'];
  var palette = document.getElementById('palette');
  colors.forEach(function(c, i){
    var sw = document.createElement('button');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c;
    sw.style.color = c;
    sw.type = 'button';
    sw.setAttribute('aria-label', 'Colore ' + c);
    sw.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    sw.addEventListener('click', function(){
      if (window.AudioEngine) AudioEngine.click();
      document.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('active'); s.setAttribute('aria-pressed','false'); });
      sw.classList.add('active');
      sw.setAttribute('aria-pressed', 'true');
      color = c;
    });
    palette.appendChild(sw);
  });
  function clear(){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  clear();
  function getCell(e){
    var r = canvas.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { cx: Math.floor(x / (r.width / SIZE)), cy: Math.floor(y / (r.height / SIZE)) };
  }
  function paint(e){
    var cell = getCell(e);
    if (cell.cx < 0 || cell.cx >= SIZE || cell.cy < 0 || cell.cy >= SIZE) return;
    ctx.fillStyle = erase ? '#000' : color;
    ctx.fillRect(cell.cx * CELL, cell.cy * CELL, CELL, CELL);
    if (window.AudioEngine) AudioEngine.paint();
  }
  canvas.addEventListener('pointerdown', function(e){ if (e.button === 2) erase = true; drawing = true; try { canvas.setPointerCapture(e.pointerId); } catch(err){} paint(e); e.preventDefault(); });
  canvas.addEventListener('pointermove', function(e){ if (drawing) paint(e); });
  canvas.addEventListener('pointerup', function(){ drawing = false; erase = false; });
  canvas.addEventListener('pointercancel', function(){ drawing = false; erase = false; });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.getElementById('clearPixels').addEventListener('click', function(){ clear(); if (window.AudioEngine) AudioEngine.click(); });
  document.getElementById('exportPng').addEventListener('click', function(){
    if (window.AudioEngine) AudioEngine.correct();
    var a = document.createElement('a');
    a.download = 'null-sector-pixel.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
})();

/* =========================================================
   MUSIC CREATOR
   ========================================================= */
(function(){
  var grid = document.getElementById('noteGrid');
  if (!grid) return;
  var NOTES = ['DO','RE','MI','FA','SOL','LA','SI'];
  var RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8];
  var bf = document.getElementById('baseFreq'), bv = document.getElementById('baseFreqVal');
  var vol = document.getElementById('volume'), vv = document.getElementById('volumeVal');
  NOTES.forEach(function(n, i){
    var b = document.createElement('button');
    b.className = 'note-btn';
    b.textContent = n;
    b.type = 'button';
    b.addEventListener('click', function(){
      if (!window.AudioEngine) return;
      var f = parseFloat(bf.value) * RATIOS[i];
      var v = parseFloat(vol.value) / 100;
      AudioEngine.tone(f, 1.5, 'sine', v * 0.3);
    });
    grid.appendChild(b);
  });
  bf.addEventListener('input', function(){ bv.textContent = bf.value; });
  vol.addEventListener('input', function(){ vv.textContent = vol.value + '%'; });
})();

/* =========================================================
   GIOCHI
   ========================================================= */
(function(){
  var grid = document.getElementById('gamesGrid');
  var modal = document.getElementById('gameModal');
  var title = document.getElementById('gameTitle');
  var content = document.getElementById('gameContent');
  if (!grid) return;

  var GAMES = [
    { id: 'memory', emoji: '💎', title: 'MEMORY', desc: 'Memory progressivo con 4 livelli' },
    { id: 'quiz', emoji: '⏳', title: 'TEMPO', desc: 'Quiz con tempo limite' },
    { id: 'anagram', emoji: '☁️', title: 'NUVOLE', desc: 'Anagrammi con aiuti progressivi' },
    { id: 'enigma', emoji: '🔮', title: 'ENIGMA', desc: 'Indovina con termometro' },
    { id: 'dice', emoji: '🎲', title: 'DADO', desc: 'Dado a 6 facce + statistiche' },
    { id: 'draw', emoji: '🌌', title: 'SOGNI', desc: 'Pattern 8×8 da riprodurre' }
  ];

  var currentCleanup = null;

  function registerCleanup(fn) {
    if (currentCleanup) currentCleanup();
    currentCleanup = fn;
  }

  GAMES.forEach(function(g){
    var c = document.createElement('div');
    c.className = 'game-card';
    c.innerHTML = '<div class="emoji" aria-hidden="true">' + g.emoji + '</div><h3>' + g.title + '</h3><p>' + g.desc + '</p><button class="btn magenta" data-game="' + g.id + '">▶ PLAY</button>';
    grid.appendChild(c);
  });

  function open(t, h){
    if (window.AudioEngine) AudioEngine.open();
    title.textContent = t;
    content.innerHTML = h;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    setTimeout(function(){ var b = content.querySelector('button, input, canvas'); if (b) { try { b.focus(); } catch(e){} } }, 50);
  }
  function close(){
    if (currentCleanup) { currentCleanup(); currentCleanup = null; }
    if (window.AudioEngine) AudioEngine.close();
    modal.hidden = true;
    document.body.style.overflow = '';
    content.innerHTML = '';
  }
  document.getElementById('gameClose').addEventListener('click', close);
  modal.addEventListener('click', function(e){ if (e.target === modal) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modal.hidden) close(); });
  grid.addEventListener('click', function(e){
    var b = e.target.closest('[data-game]');
    if (!b) return;
    var id = b.getAttribute('data-game');
    if (id === 'memory') openMemory();
    else if (id === 'quiz') openQuiz();
    else if (id === 'anagram') openAnagram();
    else if (id === 'enigma') openEnigma();
    else if (id === 'dice') openDice();
    else if (id === 'draw') openDraw();
  });

  /* =========================================================
     MEMORY
     ========================================================= */
  function openMemory(){
    var diffs = {
      easy: { cols: 2, rows: 2, pairs: 2, label: '2×2' },
      normal: { cols: 4, rows: 3, pairs: 6, label: '4×3' },
      hard: { cols: 4, rows: 4, pairs: 8, label: '4×4' },
      extreme: { cols: 5, rows: 4, pairs: 10, label: '5×4' }
    };
    var currentDiff = 'normal';
    var timer = null;

    function start(){
      if (timer) { clearInterval(timer); timer = null; }
      var d = diffs[currentDiff];
      var syms = ['💎','⏳','☁️','🌌','✨','🔮','⚡','🌟','🔥','💠'].slice(0, d.pairs);
      var deck = syms.concat(syms).sort(function(){ return Math.random() - 0.5; });
      var flipped = [], matched = 0, moves = 0, startTime = Date.now();

      var html = '<div class="difficulty-row">';
      Object.keys(diffs).forEach(function(k){
        html += '<button class="diff-btn' + (k === currentDiff ? ' active' : '') + '" data-diff="' + k + '">' + diffs[k].label + '</button>';
      });
      html += '</div>';
      html += '<p style="text-align:center;color:#94a3b8;font-size:0.85rem">Mosse: <strong id="memMoves" style="color:#00fff0">0</strong> · Tempo: <strong id="memTime" style="color:#f1d18b">0s</strong></p>';
      html += '<div class="mem-grid" id="mg" style="grid-template-columns:repeat(' + d.cols + ',1fr)"></div>';
      open('💎 MEMORY', html);

      var mg = document.getElementById('mg');

      document.querySelectorAll('.diff-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          currentDiff = btn.getAttribute('data-diff');
          if (window.AudioEngine) AudioEngine.modeChange();
          if (timer) { clearInterval(timer); timer = null; }
          start();
        });
      });

      function renderGrid(){
        mg.innerHTML = '';
        deck.forEach(function(s, i){
          var c = document.createElement('button');
          c.className = 'mem-card';
          c.type = 'button';
          if (flipped.indexOf(i) !== -1) { c.classList.add('flipped'); c.textContent = s; }
          c.addEventListener('click', function(){ click(i); });
          mg.appendChild(c);
        });
      }

      function click(i){
        if (flipped.indexOf(i) !== -1 || flipped.length === 2) return;
        if (window.AudioEngine) AudioEngine.flip();
        flipped.push(i);
        renderGrid();
        if (flipped.length === 2) {
          moves++;
          document.getElementById('memMoves').textContent = moves;
          var a = flipped[0], b = flipped[1];
          if (deck[a] === deck[b]) {
            if (window.AudioEngine) AudioEngine.match();
            matched += 2;
            setTimeout(function(){
              var all = mg.querySelectorAll('.mem-card');
              for (var k = 0; k < all.length; k++) {
                if (deck[k] === deck[a]) all[k].classList.add('matched');
              }
              flipped = [];
              if (matched === deck.length) {
                if (timer) { clearInterval(timer); timer = null; }
                var elapsed = Math.floor((Date.now() - startTime) / 1000);
                setTimeout(function(){
                  if (window.AudioEngine) AudioEngine.win();
                  content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:50px">🏆</p><p style="color:#00ff88;font-weight:900;font-size:1.4rem">VINTO!</p><p style="color:#f1d18b">Mosse: ' + moves + ' · Tempo: ' + elapsed + 's</p><div class="center-btns"><button class="btn-big btn-cyan" id="memRestart">🔄 RIGIOCA</button><button class="btn-big btn-magenta" id="memClose">CHIUDI</button></div></div>';
                  document.getElementById('memRestart').addEventListener('click', function(){ start(); });
                  document.getElementById('memClose').addEventListener('click', close);
                }, 400);
              } else {
                renderGrid();
              }
            }, 500);
          } else {
            if (window.AudioEngine) AudioEngine.wrong();
            setTimeout(function(){ flipped = []; renderGrid(); }, 800);
          }
        }
      }

      renderGrid();
      timer = setInterval(function(){
        var el = document.getElementById('memTime');
        if (el) el.textContent = Math.floor((Date.now() - startTime) / 1000) + 's';
      }, 1000);

      registerCleanup(function(){ if (timer) { clearInterval(timer); timer = null; } });
    }
    start();
  }

  /* =========================================================
     QUIZ
     ========================================================= */
  function openQuiz(){
    var qs = [
      { q: 'Quanti principi ha il Manifesto?', a: ['3', '4', '5'], c: 1 },
      { q: 'Cosa rappresenta il Tesseract?', a: ['Un cerchio', 'Un ipercubo 4D', 'Una sfera'], c: 1 },
      { q: 'Quale frequenza è simbolica?', a: ['100 Hz', '432 Hz', '1000 Hz'], c: 1 },
      { q: "Cos'è l'Energy Weaver?", a: ['Simulatore toroidale', 'Database', 'Gioco di carte'], c: 0 },
      { q: 'Quanti astri ha la Costellazione?', a: ['3', '4', '5'], c: 1 },
      { q: 'Quale colore è associato al brand?', a: ['Rosso', 'Ciano', 'Verde'], c: 1 },
      { q: 'Cosa rappresenta X∞?', a: ['Un numero', 'Il moltiplicatore infinito', 'Una variabile'], c: 1 }
    ];
    var cur = 0, score = 0, timePerQ = 10, timer = null, timeLeft = timePerQ;

    function cleanup(){ if (timer) { clearInterval(timer); timer = null; } }
    registerCleanup(cleanup);

    open('⏳ TEMPO', '');
    render();

    function render(){
      cleanup();
      if (cur >= qs.length) {
        if (window.AudioEngine) AudioEngine.win();
        content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:50px">🏆</p><p style="color:#00fff0;font-weight:900;font-size:1.6rem">SCORE: ' + score + '/' + qs.length + '</p><div class="center-btns"><button class="btn-big btn-lime" id="quizRestart">🔄 RIGIOCA</button><button class="btn-big btn-magenta" id="quizClose">CHIUDI</button></div></div>';
        document.getElementById('quizRestart').addEventListener('click', function(){ cur = 0; score = 0; render(); });
        document.getElementById('quizClose').addEventListener('click', close);
        return;
      }
      var q = qs[cur];
      timeLeft = timePerQ;
      var html = '<p style="text-align:center;color:#94a3b8;font-size:0.85rem">DOMANDA ' + (cur+1) + '/' + qs.length + ' · SCORE: ' + score + '</p>';
      html += '<div class="timer" id="timerEl">⏱ ' + timeLeft + 's</div>';
      html += '<div class="timer-bar"><div class="timer-bar-fill" id="timerBar" style="width:100%"></div></div>';
      html += '<p style="text-align:center;font-weight:900;font-size:1.1rem;margin:16px 0">' + q.q + '</p>';
      html += '<div class="quiz-options" id="qo" role="group"></div>';
      content.innerHTML = html;
      var qo = document.getElementById('qo');
      q.a.forEach(function(ans, i){
        var b = document.createElement('button');
        b.className = 'quiz-opt';
        b.textContent = ans;
        b.type = 'button';
        b.addEventListener('click', function(){
          cleanup();
          var all = qo.querySelectorAll('button');
          for (var k = 0; k < all.length; k++) all[k].disabled = true;
          if (i === q.c) { b.classList.add('correct'); score++; if (window.AudioEngine) AudioEngine.correct(); }
          else { b.classList.add('wrong'); qo.children[q.c].classList.add('correct'); if (window.AudioEngine) AudioEngine.error(); }
          setTimeout(function(){ cur++; render(); }, 1200);
        });
        qo.appendChild(b);
      });
      timer = setInterval(function(){
        timeLeft--;
        var el = document.getElementById('timerEl');
        var bar = document.getElementById('timerBar');
        if (el) { el.textContent = '⏱ ' + timeLeft + 's'; if (timeLeft <= 3) el.classList.add('warning'); }
        if (bar) bar.style.width = (timeLeft / timePerQ * 100) + '%';
        if (timeLeft <= 0) {
          cleanup();
          if (window.AudioEngine) AudioEngine.timeUp();
          var all = qo.querySelectorAll('button');
          for (var k = 0; k < all.length; k++) all[k].disabled = true;
          qo.children[q.c].classList.add('correct');
          setTimeout(function(){ cur++; render(); }, 1500);
        }
      }, 1000);
    }
  }

  /* =========================================================
     NUVOLE (anagrammi — logica corretta)
     ========================================================= */
  function openAnagram(){
    var words = [
      { w: 'CRISTALLO', hint: 'Un cristallo di luce pura' },
      { w: 'TEMPO', hint: 'La sfera del tempo' },
      { w: 'NUVOLE', hint: 'Forme mutevoli' },
      { w: 'SOGNI', hint: 'Matrice infinita' },
      { w: 'ENERGIA', hint: 'Flusso del Weaver' }
    ];
    var idx = 0, score = 0, hintLevel = 0;

    function scramble(w){
      var a = w.split('');
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a.join('');
    }
    function getHint(word, level){
      if (level === 1) return 'Prima lettera: ' + word[0];
      if (level === 2) return 'Prime 2 lettere: ' + word.slice(0, 2);
      if (level === 3) return 'Prime 3 lettere: ' + word.slice(0, 3);
      return 'Nessun aiuto';
    }

    registerCleanup(function(){});

    function render(){
      if (idx >= words.length) {
        if (window.AudioEngine) AudioEngine.win();
        content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:50px">🎉</p><p style="color:#00ff88;font-weight:900;font-size:1.6rem">RISOLTI: ' + score + '/' + words.length + '</p><div class="center-btns"><button class="btn-big btn-lime" id="anaRestart">🔄 RIGIOCA</button><button class="btn-big btn-magenta" id="anaClose">CHIUDI</button></div></div>';
        document.getElementById('anaRestart').addEventListener('click', function(){ idx = 0; score = 0; hintLevel = 0; render(); });
        document.getElementById('anaClose').addEventListener('click', close);
        return;
      }
      var it = words[idx], target = it.w;
      hintLevel = 0;
      var poolLetters = scramble(target).split('');
      var placed = [];

      var html = '<p style="text-align:center;color:#94a3b8;font-size:0.85rem">PAROLA ' + (idx+1) + '/' + words.length + ' · RISOLTE: ' + score + '</p>';
      html += '<div class="answer-slot" id="anaSlot" aria-label="Parola composta" style="min-height:56px;border:1px dashed rgba(0,255,240,0.4);border-radius:10px;display:flex;gap:6px;padding:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:16px 0;background:rgba(0,255,240,0.04)"></div>';
      html += '<div class="ana-letters" id="anaPool" aria-label="Lettere disponibili"></div>';
      html += '<div class="feedback" id="anaFeedback" role="status" aria-live="polite" style="min-height:20px"></div>';
      html += '<div class="hint-box" id="anaHint">💡 ' + it.hint + '</div>';
      html += '<div class="center-btns">';
      html += '<button class="btn-big btn-cyan" id="anaCheck">✓ VERIFICA</button>';
      html += '<button class="btn-big btn-magenta" id="anaHintBtn">💡 AIUTO</button>';
      html += '<button class="btn-big btn-lime" id="anaSkip">⏭ SALTA</button>';
      html += '</div>';
      content.innerHTML = html;

      var slot = document.getElementById('anaSlot');
      var pool = document.getElementById('anaPool');
      var feedback = document.getElementById('anaFeedback');
      var hintBox = document.getElementById('anaHint');

      function renderSlot(){
        slot.innerHTML = '';
        placed.forEach(function(item, i){
          var b = document.createElement('span');
          b.className = 'ana-letter';
          b.textContent = item.ch;
          b.style.cursor = 'pointer';
          b.setAttribute('role', 'button');
          b.setAttribute('tabindex', '0');
          b.setAttribute('aria-label', 'Rimuovi ' + item.ch);
          b.addEventListener('click', function(){
            placed.splice(i, 1);
            renderSlot();
            renderPool();
            feedback.textContent = '';
          });
          b.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } });
          slot.appendChild(b);
        });
      }

      function renderPool(){
        pool.innerHTML = '';
        poolLetters.forEach(function(ch, i){
          var b = document.createElement('span');
          b.className = 'ana-letter';
          b.textContent = ch;
          b.setAttribute('role', 'button');
          b.setAttribute('tabindex', '0');
          b.setAttribute('aria-label', 'Aggiungi ' + ch);
          if (placed.some(function(p){ return p.poolIndex === i; })) {
            b.classList.add('used');
          }
          b.addEventListener('click', function(){
            if (b.classList.contains('used')) return;
            if (placed.length >= target.length) return;
            placed.push({ ch: ch, poolIndex: i });
            if (window.AudioEngine) AudioEngine.flip();
            renderSlot();
            renderPool();
            feedback.textContent = '';
            if (placed.length === target.length) {
              setTimeout(check, 150);
            }
          });
          b.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } });
          pool.appendChild(b);
        });
      }

      renderPool();

      function check(){
        var guess = placed.map(function(p){ return p.ch; }).join('');
        if (guess === target) {
          feedback.textContent = '✓ CORRETTO!'; feedback.className = 'feedback correct';
          if (window.AudioEngine) AudioEngine.correct();
          score++;
          setTimeout(function(){ idx++; render(); }, 900);
        } else {
          feedback.textContent = '✗ RIPROVA'; feedback.className = 'feedback wrong';
          if (window.AudioEngine) AudioEngine.error();
          placed = [];
          renderSlot();
          renderPool();
        }
      }

      document.getElementById('anaCheck').addEventListener('click', check);
      document.getElementById('anaHintBtn').addEventListener('click', function(){
        hintLevel = Math.min(hintLevel + 1, 3);
        hintBox.textContent = '💡 ' + getHint(target, hintLevel);
        if (window.AudioEngine) AudioEngine.hint();
      });
      document.getElementById('anaSkip').addEventListener('click', function(){
        if (window.AudioEngine) AudioEngine.tick();
        idx++; render();
      });
    }
    render();
  }

  /* =========================================================
     ENIGMA
     ========================================================= */
  function openEnigma(){
    var secret = Math.floor(Math.random() * 100) + 1;
    var attempts = 0;
    registerCleanup(function(){});
    open('🔮 ENIGMA', '<p style="text-align:center;color:#94a3b8;font-size:0.9rem">Indovina il numero tra 1 e 100</p><div class="thermometer" style="height:28px;background:rgba(255,255,255,0.08);border-radius:14px;overflow:hidden;margin:20px 0;position:relative;border:1px solid rgba(255,255,255,0.1)"><div id="thermoFill" style="height:100%;background:linear-gradient(90deg,#ff0040,#fb923c,#f1d18b,#00ff88);transition:width 0.4s;border-radius:14px;width:0%"></div><div id="thermoLabel" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:0.85rem;font-weight:900;color:#fff;text-shadow:0 0 6px #000">?</div></div><input class="enigma-input" id="ei" type="number" min="1" max="100" placeholder="?" aria-label="Numero da 1 a 100"><div class="feedback" id="ef" role="status" aria-live="polite">INSERISCI UN NUMERO</div><div class="center-btns"><button class="btn-big btn-cyan" id="ec">✓ PROVA</button></div><p style="text-align:center;font-size:0.75rem;color:#94a3b8;margin-top:12px">TENTATIVI: <span id="ea">0</span></p>');
    var ei = document.getElementById('ei'), ef = document.getElementById('ef'), ea = document.getElementById('ea');
    var thermoFill = document.getElementById('thermoFill'), thermoLabel = document.getElementById('thermoLabel');
    function check(){
      var v = parseInt(ei.value, 10);
      if (isNaN(v) || v < 1 || v > 100) { if (window.AudioEngine) AudioEngine.error(); ef.textContent = 'NUMERO 1-100'; ef.className = 'feedback wrong'; return; }
      attempts++; ea.textContent = attempts;
      var distance = Math.abs(v - secret);
      var percent = Math.max(0, 100 - distance);
      thermoFill.style.width = percent + '%';
      thermoLabel.textContent = distance === 0 ? '🎯 PERFETTO' : distance <= 5 ? '🔥 FUOCO' : distance <= 15 ? '🌡 CALDO' : distance <= 30 ? '❄ FREDDO' : '🧊 GHIACCIO';
      if (v === secret) { if (window.AudioEngine) AudioEngine.win(); ef.textContent = '🎉 CORRETTO IN ' + attempts + ' TENTATIVI!'; ef.className = 'feedback correct'; ei.disabled = true; }
      else if (v < secret) { if (window.AudioEngine) AudioEngine.tick(); ef.textContent = '⬆ TROPPO BASSO'; ef.className = 'feedback wrong'; }
      else { if (window.AudioEngine) AudioEngine.tick(); ef.textContent = '⬇ TROPPO ALTO'; ef.className = 'feedback wrong'; }
      ei.value = ''; ei.focus();
    }
    document.getElementById('ec').addEventListener('click', check);
    ei.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
    ei.focus();
  }

  /* =========================================================
     DADO
     ========================================================= */
  function openDice(){
    var total = 0, rolls = [];
    var faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    registerCleanup(function(){});
    function render(){
      var html = '<div style="text-align:center"><div class="dice" id="df" aria-live="polite">🎲</div><div class="dice-result" id="dr">FORTUNA: ' + total + '</div>';
      html += '<div style="height:36px;background:rgba(255,255,255,0.08);border-radius:10px;overflow:hidden;margin:20px 0;display:flex;border:1px solid rgba(255,255,255,0.1)">';
      for (var i = 0; i < 6; i++) {
        var count = rolls.filter(function(r){ return r === i + 1; }).length;
        var pct = rolls.length > 0 ? (count / rolls.length * 100) : (100 / 6);
        html += '<div style="width:' + pct + '%;height:100%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:900;color:#000;background:hsl(' + (i * 50) + ',80%,60%)">' + (count > 0 ? count : '') + '</div>';
      }
      html += '</div>';
      html += '<p style="text-align:center;color:#94a3b8;font-size:0.75rem">Lancio: ' + rolls.length + ' · Ultimo: ' + (rolls[rolls.length-1] || '-') + '</p>';
      html += '<div class="center-btns"><button class="btn-big btn-magenta" id="rb">🎲 LANCIA</button><button class="btn-big btn-cyan" id="r10">🎲 ×10</button><button class="btn-big btn-lime" id="rr">↺ RESET</button></div>';
      html += '</div>';
      content.innerHTML = html;
      var df = document.getElementById('df'), dr = document.getElementById('dr'), rb = document.getElementById('rb');
      rb.addEventListener('click', function(){ rollOnce(df, dr, false); });
      document.getElementById('r10').addEventListener('click', function(){
        var count = 0;
        var iv = setInterval(function(){
          rollOnce(df, dr, true);
          count++;
          if (count >= 10) { clearInterval(iv); setTimeout(render, 300); }
        }, 150);
        registerCleanup(function(){ clearInterval(iv); });
      });
      document.getElementById('rr').addEventListener('click', function(){ total = 0; rolls = []; if (window.AudioEngine) AudioEngine.click(); render(); });
    }
    function rollOnce(df, dr, silent){
      if (window.AudioEngine) AudioEngine.roll();
      var c = 0;
      var iv = setInterval(function(){
        df.textContent = faces[Math.floor(Math.random() * 6)];
        c++;
        if (c > 8) {
          clearInterval(iv);
          var v = Math.floor(Math.random() * 6) + 1;
          df.textContent = faces[v - 1];
          total += v; rolls.push(v);
          dr.textContent = 'FORTUNA: ' + total + ' (ultimo: ' + v + ')';
          if (window.AudioEngine) AudioEngine.diceResult();
          if (!silent) setTimeout(render, 800);
        }
      }, 60);
      registerCleanup(function(){ clearInterval(iv); });
    }
    render();
  }

  /* =========================================================
     SOGNI
     ========================================================= */
  function openDraw(){
    var SIZE = 8;
    var target = [];
    for (var y = 0; y < SIZE; y++) for (var x = 0; x < SIZE; x++) {
      target.push((x === 3 || x === 4) || (y === 3 || y === 4) ? 1 : 0);
    }
    registerCleanup(function(){});
    open('🌌 SOGNI', '<p style="text-align:center;color:#94a3b8;font-size:0.9rem">Riproduci il pattern segreto 8×8</p><canvas class="draw-canvas" id="dc" width="320" height="320" aria-label="Griglia 8x8 da riempire" style="width:100%;max-width:340px;aspect-ratio:1;background:#000;border:2px solid var(--neon-violet);border-radius:14px;display:block;margin:16px auto;cursor:crosshair;touch-action:none"></canvas><div class="center-btns"><button class="btn-big btn-cyan" id="dv">✓ VERIFICA</button><button class="btn-big btn-lime" id="dh">💡 AIUTO</button><button class="btn-big btn-magenta" id="dr2">🗑 CANCELLA</button></div><div style="text-align:center;font-size:1.5rem;font-weight:900;color:var(--neon-cyan);margin:16px 0" id="scoreDisplay" role="status" aria-live="polite">Similarità: 0%</div>');
    var dc = document.getElementById('dc');
    var ctx = dc.getContext('2d');
    var CELL = dc.width / SIZE;
    var user = new Array(SIZE * SIZE).fill(0);
    function draw(){
      for (var y = 0; y < SIZE; y++) for (var x = 0; x < SIZE; x++) {
        ctx.fillStyle = user[y * SIZE + x] ? '#00fff0' : '#000';
        ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
        ctx.strokeStyle = 'rgba(168,85,247,0.25)';
        ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    draw();
    dc.addEventListener('click', function(e){
      var r = dc.getBoundingClientRect();
      var x = Math.floor((e.clientX - r.left) / (r.width / SIZE));
      var y = Math.floor((e.clientY - r.top) / (r.height / SIZE));
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
      user[y * SIZE + x] = user[y * SIZE + x] ? 0 : 1;
      if (window.AudioEngine) AudioEngine.paint();
      draw(); updateScore();
    });
    function updateScore(){
      var matches = 0;
      for (var i = 0; i < target.length; i++) if (target[i] === user[i]) matches++;
      var pct = Math.round(matches / target.length * 100);
      var el = document.getElementById('scoreDisplay');
      el.textContent = 'Similarità: ' + pct + '%';
      if (pct === 100) el.style.color = 'var(--neon-lime)';
      else el.style.color = 'var(--neon-cyan)';
      return pct;
    }
    document.getElementById('dv').addEventListener('click', function(){
      var pct = updateScore();
      if (pct === 100) { if (window.AudioEngine) AudioEngine.win(); alert('🎉 PERFETTO! Pattern identico!'); }
      else if (pct >= 80) { if (window.AudioEngine) AudioEngine.correct(); alert('👍 Molto vicino! Similarità: ' + pct + '%'); }
      else { if (window.AudioEngine) AudioEngine.error(); alert('✗ Riprova! Similarità: ' + pct + '%'); }
    });
    document.getElementById('dh').addEventListener('click', function(){
      if (window.AudioEngine) AudioEngine.hint();
      var row = Math.floor(Math.random() * SIZE), col = Math.floor(Math.random() * SIZE);
      if (target[row * SIZE + col] === 1) alert('💡 La cella riga ' + (row+1) + ', colonna ' + (col+1) + ' è illuminata');
      else alert('💡 La cella riga ' + (row+1) + ', colonna ' + (col+1) + ' è vuota');
    });
    document.getElementById('dr2').addEventListener('click', function(){
      if (window.AudioEngine) AudioEngine.click();
      user = new Array(SIZE * SIZE).fill(0); draw(); updateScore();
    });
  }
})();
})();
</script>
