<script>
/* =========================================================
   AUDIO ENGINE
   ========================================================= */
var SFX = (function(){
  var ctx = null, master = null, muted = false;
  function ensure(){
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain();
      master.gain.value = 0.18;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type, vol){
    ensure();
    if (muted) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(vol || 0.2, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    o.connect(g);
    g.connect(master);
    o.start();
    o.stop(ctx.currentTime + dur + 0.05);
  }
  return {
    click: function(){ tone(880, 0.05, 'square', 0.12); },
    flip: function(){ tone(1200, 0.08, 'triangle', 0.15); },
    match: function(){ tone(1047, 0.1, 'sine', 0.2); setTimeout(function(){ tone(1568, 0.15, 'sine', 0.2); }, 60); },
    wrong: function(){ tone(150, 0.25, 'sawtooth', 0.18); },
    win: function(){ [523, 659, 784, 1047, 1319].forEach(function(f, i){ setTimeout(function(){ tone(f, 0.15, 'sine', 0.25); }, i * 80); }); },
    correct: function(){ tone(1047, 0.08, 'sine', 0.2); setTimeout(function(){ tone(1568, 0.12, 'sine', 0.2); }, 60); },
    error: function(){ tone(120, 0.3, 'sawtooth', 0.2); },
    roll: function(){ for (var i = 0; i < 10; i++) setTimeout(function(){ tone(300 + Math.random() * 800, 0.04, 'square', 0.1); }, i * 40); },
    diceResult: function(){ tone(1319, 0.1, 'sine', 0.25); setTimeout(function(){ tone(1760, 0.2, 'sine', 0.25); }, 80); },
    tick: function(){ tone(2000, 0.02, 'square', 0.08); },
    open: function(){ tone(440, 0.08, 'sine', 0.12); setTimeout(function(){ tone(880, 0.1, 'sine', 0.12); }, 60); },
    close: function(){ tone(660, 0.08, 'sine', 0.1); setTimeout(function(){ tone(330, 0.1, 'sine', 0.1); }, 60); },
    paint: function(){ tone(1600, 0.015, 'square', 0.05); }
  };
})();

/* =========================================================
   PIXEL ART
   ========================================================= */
(function(){
  var canvas = document.getElementById('pixelCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var SIZE = 16, CELL = canvas.width / SIZE;
  var color = '#00fff0', drawing = false, erase = false;
  var colors = ['#00fff0','#ff00aa','#a855f7','#00ff88','#ff0040','#ffaa00','#ffffff','#6b5a8a','#ff66cc','#66ccff'];
  var palette = document.getElementById('palette');
  colors.forEach(function(c, i){
    var sw = document.createElement('button');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c;
    sw.style.color = c;
    sw.type = 'button';
    sw.addEventListener('click', function(){
      SFX.click();
      var all = document.querySelectorAll('.swatch');
      for (var k = 0; k < all.length; k++) all[k].classList.remove('active');
      sw.classList.add('active');
      color = c;
    });
    palette.appendChild(sw);
  });
  function clear(){ ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
  clear();
  function getCell(e){
    var r = canvas.getBoundingClientRect();
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
    return { cx: Math.floor(x / (r.width / SIZE)), cy: Math.floor(y / (r.height / SIZE)) };
  }
  function paint(e){
    var cell = getCell(e);
    if (cell.cx < 0 || cell.cx >= SIZE || cell.cy < 0 || cell.cy >= SIZE) return;
    ctx.fillStyle = erase ? '#000' : color;
    ctx.fillRect(cell.cx * CELL, cell.cy * CELL, CELL, CELL);
    SFX.paint();
  }
  canvas.addEventListener('mousedown', function(e){ if (e.button === 2) erase = true; drawing = true; paint(e); e.preventDefault(); });
  canvas.addEventListener('mousemove', function(e){ if (drawing) paint(e); });
  window.addEventListener('mouseup', function(){ drawing = false; erase = false; });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('touchstart', function(e){ drawing = true; paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchmove', function(e){ if (drawing) paint(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener('touchend', function(){ drawing = false; });
  document.getElementById('clearPixels').addEventListener('click', function(){ clear(); SFX.click(); });
  document.getElementById('exportPng').addEventListener('click', function(){
    SFX.correct();
    var a = document.createElement('a');
    a.download = 'null-sector-art.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  });
})();

/* =========================================================
   MUSIC CREATOR
   ========================================================= */
(function(){
  var grid = document.getElementById('noteGrid');
  if (!grid) return;
  var NOTES = ['DO','RE','MI','FA','SOL','LA','SI'];
  var RATIOS = [1, 9/8, 5/4, 4/3, 3/2, 5/3, 15/8];
  var bf = document.getElementById('baseFreq'), bv = document.getElementById('baseFreqVal');
  var vol = document.getElementById('volume'), vv = document.getElementById('volumeVal');
  var ctx = null, osc = null, gain = null;
  function play(i){
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    var f = parseFloat(bf.value) * RATIOS[i];
    var v = parseFloat(vol.value) / 100;
    if (osc) { try { osc.stop(); } catch(e) {} }
    if (gain) { try { gain.disconnect(); } catch(e) {} }
    gain = ctx.createGain();
    gain.gain.value = 0;
    gain.gain.linearRampToValueAtTime(v * 0.3, ctx.currentTime + 0.02);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
    gain.connect(ctx.destination);
    osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = f;
    osc.connect(gain);
    osc.start();
    osc.stop(ctx.currentTime + 1.3);
  }
  NOTES.forEach(function(n, i){
    var b = document.createElement('button');
    b.className = 'note-btn';
    b.textContent = n;
    b.type = 'button';
    b.addEventListener('click', function(){ play(i); });
    grid.appendChild(b);
  });
  bf.addEventListener('input', function(){ bv.textContent = bf.value; });
  vol.addEventListener('input', function(){ vv.textContent = vol.value + '%'; });
})();

/* =========================================================
   GIOCHI — riscritti con createElement (più robusto su mobile)
   ========================================================= */
(function(){
  var grid = document.getElementById('gamesGrid');
  var modal = document.getElementById('gameModal');
  var title = document.getElementById('gameTitle');
  var content = document.getElementById('gameContent');
  if (!grid) { console.error('gamesGrid non trovato'); return; }

  var GAMES = [
    { id: 'memory', emoji: '💎', title: 'CRISTALLO', desc: 'Memory' },
    { id: 'quiz', emoji: '⏳', title: 'TEMPO', desc: 'Quiz' },
    { id: 'anagram', emoji: '☁️', title: 'NUVOLE', desc: 'Anagrammi' },
    { id: 'enigma', emoji: '🔮', title: 'ENIGMA', desc: 'Numero' },
    { id: 'dice', emoji: '🎲', title: 'DADO', desc: 'Lancia' },
    { id: 'draw', emoji: '🌌', title: 'SOGNI', desc: 'Pattern' }
  ];

  GAMES.forEach(function(g){
    var c = document.createElement('div');
    c.className = 'game-card';
    var emoji = document.createElement('div');
    emoji.className = 'emoji';
    emoji.textContent = g.emoji;
    var h3 = document.createElement('h3');
    h3.textContent = g.title;
    var p = document.createElement('p');
    p.textContent = g.desc;
    var btn = document.createElement('button');
    btn.className = 'btn magenta';
    btn.textContent = '▶ PLAY';
    btn.setAttribute('data-game', g.id);
    c.appendChild(emoji);
    c.appendChild(h3);
    c.appendChild(p);
    c.appendChild(btn);
    grid.appendChild(c);
  });

  function open(t, h){ SFX.open(); title.textContent = t; content.innerHTML = h; modal.hidden = false; document.body.style.overflow = 'hidden'; }
  function close(){ SFX.close(); modal.hidden = true; document.body.style.overflow = ''; content.innerHTML = ''; }

  document.getElementById('gameClose').addEventListener('click', close);
  modal.addEventListener('click', function(e){ if (e.target === modal) close(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !modal.hidden) close(); });

  grid.addEventListener('click', function(e){
    var b = e.target.closest('[data-game]');
    if (!b) return;
    var id = b.getAttribute('data-game');
    if (id === 'memory') openMemory();
    else if (id === 'quiz') openQuiz();
    else if (id === 'anagram') openAnagram();
    else if (id === 'enigma') openEnigma();
    else if (id === 'dice') openDice();
    else if (id === 'draw') openDraw();
  });

  /* ========== MEMORY ========== */
  function openMemory(){
    var syms = ['💎','⏳','☁️','🌌','✨','🔮'];
    var deck = syms.concat(syms).sort(function(){ return Math.random() - 0.5; });
    var flipped = [], matched = 0, moves = 0;
    open('💎 CRISTALLO', '<p style="text-align:center;color:#6b5a8a;font-size:11px">MOSSE: <strong id="mm" style="color:#00fff0">0</strong></p><div class="mem-grid" id="mg"></div>');
    var mg = document.getElementById('mg');

    function render(){
      mg.innerHTML = '';
      deck.forEach(function(s, i){
        var c = document.createElement('button');
        c.className = 'mem-card';
        c.type = 'button';
        if (flipped.indexOf(i) !== -1) { c.classList.add('flipped'); c.textContent = s; }
        c.addEventListener('click', function(){ click(i); });
        mg.appendChild(c);
      });
    }

    function click(i){
      if (flipped.indexOf(i) !== -1 || flipped.length === 2) return;
      SFX.flip();
      flipped.push(i);
      render();
      if (flipped.length === 2) {
        moves++;
        document.getElementById('mm').textContent = moves;
        var a = flipped[0], b = flipped[1];
        if (deck[a] === deck[b]) {
          SFX.match();
          matched += 2;
          setTimeout(function(){
            var all = mg.querySelectorAll('.mem-card');
            for (var k = 0; k < all.length; k++) {
              if (deck[k] === deck[a]) all[k].classList.add('matched');
            }
            flipped = [];
            if (matched === syms.length * 2) {
              setTimeout(function(){ SFX.win(); content.innerHTML = '<p style="text-align:center;color:#00ff88;font-weight:700;font-size:18px">🎉 VINTO IN ' + moves + ' MOSSE!</p>'; }, 400);
            } else { render(); }
          }, 500);
        } else {
          SFX.wrong();
          setTimeout(function(){ flipped = []; render(); }, 800);
        }
      }
    }
    render();
  }

  /* ========== QUIZ ========== */
  function openQuiz(){
    var qs = [
      { q: 'Quanti principi ha il Manifesto?', a: ['3', '4', '5'], c: 1 },
      { q: 'Cosa rappresenta il Tesseract?', a: ['Un cerchio', 'Un ipercubo 4D', 'Una sfera'], c: 1 },
      { q: 'Quale frequenza è simbolica?', a: ['100 Hz', '432 Hz', '1000 Hz'], c: 1 },
      { q: "Cos'è l'Energy Weaver?", a: ['Simulatore toroidale', 'Database', 'Gioco di carte'], c: 0 },
      { q: 'Quanti astri ha la Costellazione?', a: ['3', '4', '5'], c: 1 }
    ];
    var cur = 0, score = 0;

    open('⏳ TEMPO', '');
    render();

    function render(){
      if (cur >= qs.length) {
        SFX.win();
        content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:40px">🏆</p><p style="color:#00fff0;font-weight:700;font-size:20px">SCORE: ' + score + '/' + qs.length + '</p><button class="btn lime" id="quizRestart" style="margin-top:20px">RIGIOCA</button> <button class="btn" id="quizClose">CHIUDI</button></div>';
        document.getElementById('quizRestart').addEventListener('click', function(){ cur = 0; score = 0; render(); });
        document.getElementById('quizClose').addEventListener('click', close);
        return;
      }
      var q = qs[cur];
      content.innerHTML = '';
      var info = document.createElement('p');
      info.style.cssText = 'text-align:center;color:#6b5a8a;font-size:11px';
      info.textContent = 'DOMANDA ' + (cur + 1) + '/' + qs.length + ' · SCORE: ' + score;
      content.appendChild(info);
      var qText = document.createElement('p');
      qText.style.cssText = 'text-align:center;font-weight:700;font-size:14px;color:#e0d8ff;margin:16px 0';
      qText.textContent = q.q;
      content.appendChild(qText);
      var optWrap = document.createElement('div');
      optWrap.style.cssText = 'display:flex;flex-direction:column;gap:8px';
      content.appendChild(optWrap);
      q.a.forEach(function(ans, i){
        var b = document.createElement('button');
        b.className = 'quiz-opt';
        b.textContent = ans;
        b.type = 'button';
        b.addEventListener('click', function(){
          var all = optWrap.querySelectorAll('button');
          for (var k = 0; k < all.length; k++) all[k].disabled = true;
          if (i === q.c) { b.classList.add('correct'); score++; SFX.correct(); }
          else { b.classList.add('wrong'); optWrap.children[q.c].classList.add('correct'); SFX.error(); }
          setTimeout(function(){ cur++; render(); }, 1200);
        });
        optWrap.appendChild(b);
      });
    }
  }

  /* ========== ANAGRAMMA ========== */
  function openAnagram(){
    var words = [
      { w: 'CRISTALLO', hint: 'Cristallo di luce' },
      { w: 'TEMPO', hint: 'La sfera del tempo' },
      { w: 'NUVOLE', hint: 'Forme mutevoli' },
      { w: 'SOGNI', hint: 'Matrice infinita' },
      { w: 'ENERGIA', hint: 'Flusso del Weaver' }
    ];
    var idx = 0, score = 0;

    open('☁️ NUVOLE', '');
    render();

    function scramble(w){
      var a = w.split('');
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
      }
      return a.join('');
    }

    function render(){
      if (idx >= words.length) {
        SFX.win();
        content.innerHTML = '<div style="text-align:center;padding:20px 0"><p style="font-size:40px">🎉</p><p style="color:#00ff88;font-weight:700;font-size:20px">RISOLTI: ' + score + '/' + words.length + '</p><button class="btn lime" id="anaRestart" style="margin-top:20px">RIGIOCA</button> <button class="btn" id="anaClose">CHIUDI</button></div>';
        document.getElementById('anaRestart').addEventListener('click', function(){ idx = 0; score = 0; render(); });
        document.getElementById('anaClose').addEventListener('click', close);
        return;
      }
      var it = words[idx];
      var o = it.w;
      var sc = scramble(o);
      content.innerHTML = '';
      var info = document.createElement('p');
      info.style.cssText = 'text-align:center;color:#6b5a8a;font-size:11px';
      info.textContent = 'PAROLA ' + (idx + 1) + '/' + words.length + ' · RISOLTE: ' + score;
      content.appendChild(info);
      var hint = document.createElement('p');
      hint.style.cssText = 'text-align:center;color:#6b5a8a;font-size:11px;margin:8px 0';
      hint.textContent = '💡 ' + it.hint;
      content.appendChild(hint);
      var lettersWrap = document.createElement('div');
      lettersWrap.className = 'ana-letters';
      for (var i = 0; i < sc.length; i++) {
        var span = document.createElement('span');
        span.className = 'ana-letter';
        span.textContent = sc[i];
        lettersWrap.appendChild(span);
      }
      content.appendChild(lettersWrap);
      var input = document.createElement('input');
      input.className = 'ana-input';
      input.id = 'ai';
      input.placeholder = 'SCRIVI...';
      input.maxLength = o.length;
      input.autocomplete = 'off';
      content.appendChild(input);
      var feedback = document.createElement('div');
      feedback.className = 'feedback';
      feedback.id = 'af';
      content.appendChild(feedback);
      var btns = document.createElement('div');
      btns.style.cssText = 'text-align:center';
      var checkBtn = document.createElement('button');
      checkBtn.className = 'btn lime';
      checkBtn.textContent = '✓ VERIFICA';
      checkBtn.addEventListener('click', check);
      var skipBtn = document.createElement('button');
      skipBtn.className = 'btn';
      skipBtn.textContent = '⏭ SALTA';
      skipBtn.addEventListener('click', function(){ SFX.tick(); idx++; render(); });
      btns.appendChild(checkBtn);
      btns.appendChild(skipBtn);
      content.appendChild(btns);

      function check(){
        if (!input.value.trim()) {
          feedback.textContent = 'SCRIVI QUALCOSA!';
          feedback.className = 'feedback wrong';
          SFX.error();
          return;
        }
        if (input.value.toUpperCase() === o) {
          feedback.textContent = '✓ CORRETTO!';
          feedback.className = 'feedback correct';
          SFX.correct();
          score++;
          input.disabled = true;
          setTimeout(function(){ idx++; render(); }, 900);
        } else {
          feedback.textContent = '✗ RIPROVA';
          feedback.className = 'feedback wrong';
          SFX.error();
          input.select();
        }
      }
      input.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
      setTimeout(function(){ input.focus(); }, 100);
    }
  }

  /* ========== ENIGMA ========== */
  function openEnigma(){
    var secret = Math.floor(Math.random() * 100) + 1;
    var attempts = 0;
    open('🔮 ENIGMA', '<p style="text-align:center;color:#6b5a8a;font-size:12px">INDOVINA IL NUMERO 1-100</p><input class="enigma-input" id="ei" type="number" min="1" max="100" placeholder="?"><div class="feedback" id="ef">INSERISCI NUMERO</div><div style="text-align:center"><button class="btn magenta" id="ec">PROVA</button></div><p style="text-align:center;font-size:10px;color:#6b5a8a">TENTATIVI: <span id="ea">0</span></p>');
    var ei = document.getElementById('ei'), ef = document.getElementById('ef'), ea = document.getElementById('ea');
    function check(){
      var v = parseInt(ei.value, 10);
      if (isNaN(v) || v < 1 || v > 100) { SFX.error(); ef.textContent = 'NUMERO 1-100'; ef.className = 'feedback wrong'; return; }
      attempts++;
      ea.textContent = attempts;
      if (v === secret) { SFX.win(); ef.textContent = '🎉 CORRETTO IN ' + attempts + ' TENTATIVI!'; ef.className = 'feedback correct'; ei.disabled = true; }
      else if (v < secret) { SFX.tick(); ef.textContent = '⬆ TROPPO BASSO'; ef.className = 'feedback wrong'; }
      else { SFX.tick(); ef.textContent = '⬇ TROPPO ALTO'; ef.className = 'feedback wrong'; }
      ei.value = '';
      ei.focus();
    }
    document.getElementById('ec').addEventListener('click', check);
    ei.addEventListener('keydown', function(e){ if (e.key === 'Enter') check(); });
    ei.focus();
  }

  /* ========== DADO ========== */
  function openDice(){
    var total = 0;
    open('🎲 DADO', '<div style="text-align:center"><div class="dice" id="df">🎲</div><div class="dice-result" id="dr">FORTUNA: 0</div><button class="btn magenta" id="rb" style="margin-top:16px">🎲 LANCIA</button></div>');
    var df = document.getElementById('df'), dr = document.getElementById('dr'), rb = document.getElementById('rb');
    var faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    rb.addEventListener('click', function(){
      SFX.roll();
      rb.disabled = true;
      var c = 0;
      var iv = setInterval(function(){
        df.textContent = faces[Math.floor(Math.random() * 6)];
        c++;
        if (c > 10) {
          clearInterval(iv);
          var v = Math.floor(Math.random() * 6) + 1;
          df.textContent = faces[v - 1];
          total += v;
          dr.textContent = 'FORTUNA: ' + total + ' (ULTIMO: ' + v + ')';
          SFX.diceResult();
          rb.disabled = false;
        }
      }, 50);
    });
  }

  /* ========== DISEGNO ========== */
  function openDraw(){
    var SIZE = 8;
    var secret = [];
    for (var y = 0; y < SIZE; y++) for (var x = 0; x < SIZE; x++) secret.push((x === 3 || x === 4) || (y === 3 || y === 4) ? 1 : 0);
    open('🌌 SOGNI', '<p style="text-align:center;color:#6b5a8a;font-size:11px">RIPRODUCI IL PATTERN 8×8</p><canvas id="dc" width="320" height="320" style="display:block;width:100%;max-width:300px;aspect-ratio:1;margin:12px auto;background:#000;border:1px solid #a855f7;cursor:crosshair;touch-action:none"></canvas><div style="text-align:center"><button class="btn lime" id="dv">✓ VERIFICA</button></div><div class="feedback" id="dfb"></div>');
    var dc = document.getElementById('dc'), ctx = dc.getContext('2d'), CELL = dc.width / SIZE;
    var user = new Array(SIZE * SIZE).fill(0);
    function draw(){
      for (var y = 0; y < SIZE; y++) for (var x = 0; x < SIZE; x++) {
        ctx.fillStyle = user[y * SIZE + x] ? '#00fff0' : '#000';
        ctx.fillRect(x * CELL, y * CELL, CELL - 1, CELL - 1);
      }
    }
    draw();
    dc.addEventListener('click', function(e){
      var r = dc.getBoundingClientRect();
      var x = Math.floor((e.clientX - r.left) / (r.width / SIZE));
      var y = Math.floor((e.clientY - r.top) / (r.height / SIZE));
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE) return;
      user[y * SIZE + x] = user[y * SIZE + x] ? 0 : 1;
      SFX.paint();
      draw();
    });
    document.getElementById('dv').addEventListener('click', function(){
      var fb = document.getElementById('dfb');
      var ok = true;
      for (var i = 0; i < secret.length; i++) { if (secret[i] !== user[i]) { ok = false; break; } }
      if (ok) { SFX.win(); fb.textContent = '🎉 PERFETTO!'; fb.className = 'feedback correct'; }
      else {
        SFX.error();
        var right = 0;
        for (var j = 0; j < secret.length; j++) if (secret[j] === user[j]) right++;
        fb.textContent = 'GIUSTE: ' + right + '/' + (SIZE * SIZE);
        fb.className = 'feedback wrong';
      }
    });
  }
})();
</script>
</body>
