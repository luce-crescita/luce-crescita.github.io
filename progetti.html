<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>innovationportfolio x∞ | Hyper-Dimensional Archive</title>
    <style>
        /* RESET & QUADRI-DIMENSIONAL CORE SETUP */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        
        :root {
            --hyper-cyan: #00f0ff;
            --hyper-magenta: #ff0077;
            --hyper-purple: #bd00ff;
            --deep-matrix: #010005;
            --shield-gold: #ffd700;
            --neon-green: #00ff66;
            --glass-core: rgba(4, 1, 12, 0.9);
        }

        body { 
            background: var(--deep-matrix); 
            color: #f1f5f9; 
            min-height: 100vh;
            overflow-x: hidden;
            perspective: 2000px;
        }

        /* SFONDO CINETICO A STRINGHE ENERGETICHE FLUIDE (TECNOLOGIA GRAFICA AVANZATA) */
        .quantum-vortex {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 119, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(189, 0, 255, 0.08) 0%, transparent 60%);
            animation: cosmicShift 20s ease-in-out infinite alternate;
        }

        @keyframes cosmicShift {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.15) rotate(4deg); }
        }

        /* HEADER CON SCANSIONE LASER CONTINUA */
        header {
            position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
            background: rgba(1, 0, 5, 0.95); backdrop-filter: blur(30px);
            border-bottom: 2px solid rgba(0, 240, 255, 0.25);
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%;
            overflow: hidden;
        }
        
        /* Linea laser pulsante sull'intestazione */
        header::after {
            content: ''; position: absolute; bottom: 0; left: -100%; width: 200%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--hyper-cyan), var(--hyper-magenta), transparent);
            animation: laserScan 4s linear infinite;
        }

        @keyframes laserScan {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .logo-box { display: flex; flex-direction: column; }
        .logo { font-weight: bold; font-size: 1.3rem; color: var(--hyper-cyan); text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); letter-spacing: 3px; }
        .subtitle { font-size: 0.75rem; color: #64748b; letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
        
        .security-badge { 
            font-size: 0.8rem; color: var(--shield-gold); border: 1px solid var(--shield-gold); padding: 5px 12px; border-radius: 4px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
            background: rgba(255, 215, 0, 0.05);
        }

        /* MACRO GRID ED EFFETTI DI PROFONDITÀ */
        main { max-width: 1400px; margin: 140px auto 60px; padding: 0 20px; }

        .glass-panel {
            background: var(--glass-core); backdrop-filter: blur(35px);
            border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 20px;
            padding: 45px; margin-bottom: 40px;
            box-shadow: inset 0 0 40px rgba(189, 0, 255, 0.1), 0 30px 70px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.075, 0.82, 0.165, 1);
        }

        /* DEPOSITO LEGALE CRITTOGRAFATO CORRETTO */
        .legal-deposit-box {
            border-left: 4px solid var(--shield-gold); background: rgba(255, 215, 0, 0.01);
            padding: 25px; border-radius: 8px; margin-bottom: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }
        .legal-title { font-size: 1.15rem; color: var(--shield-gold); margin-bottom: 12px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .legal-text { color: #e2e8f0; font-size: 0.95rem; line-height: 1.8; font-family: sans-serif; }

        h1 { 
            font-size: 2.5rem; margin-bottom: 20px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase;
            background: linear-gradient(90deg, var(--hyper-cyan), var(--hyper-purple), var(--hyper-magenta)); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 15px rgba(0, 240, 255, 0.4));
        }
        
        .counter-grid { display: flex; gap: 40px; margin-bottom: 35px; background: rgba(255,255,255,0.02); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .counter-item { font-size: 0.9rem; color: #94a3b8; letter-spacing: 1px; }
        .counter-item strong { color: var(--hyper-cyan); font-size: 1.6rem; display: block; text-shadow: 0 0 12px rgba(0,240,255,0.4); }

        /* TERMINALE QUANTISTICO INFOCINETICO */
        .nova-terminal {
            background: rgba(0, 0, 0, 0.95); border-left: 3px solid var(--hyper-magenta);
            border-radius: 8px; padding: 20px; font-size: 0.85rem; color: var(--neon-green);
            margin-bottom: 35px; min-height: 160px; box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }
        .terminal-line { margin-bottom: 8px; opacity: 0; animation: flashIn 0.3s forwards; }

        /* PATENTS HYPER-GRID E DEFORMAZIONE SPAZIALE AL PASSAGGIO MOUSE */
        .patent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 30px; }
        
        .patent-card {
            background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 16px; padding: 30px; position: relative; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* Ologramma di scansione cromatica a comparsa */
        .patent-card::before {
            content: ''; position: absolute; top: -100%; left: -100%; width: 300%; height: 300%;
            background: linear-gradient(45deg, transparent, rgba(255, 0, 119, 0.05), rgba(0, 240, 255, 0.05), transparent);
            transform: rotate(30deg); transition: 0.8s;
        }

        .patent-card:hover {
            background: rgba(12, 4, 32, 0.95);
            border-color: var(--hyper-cyan);
            transform: scale(1.04) translateY(-8px) rotateX(2deg) rotateY(-2deg);
            box-shadow: 0 25px 50px rgba(0, 240, 255, 0.18), inset 0 0 20px rgba(255,0,119,0.1);
        }
        .patent-card:hover::before { left: 100%; }
        
        .patent-id { font-size: 0.75rem; color: var(--hyper-purple); font-weight: bold; letter-spacing: 3px; display: block; margin-bottom: 8px; }
        .patent-subtag { font-size: 0.8rem; color: #64748b; margin-bottom: 12px; display: block; font-style: italic; }
        .patent-card h3 { font-size: 1.3rem; margin-bottom: 6px; color: #fff; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .patent-card h4 { font-size: 0.9rem; color: var(--hyper-cyan); margin-bottom: 12px; font-weight: normal; }
        .patent-card p { color: #94a3b8; line-height: 1.6; font-size: 0.85rem; font-family: sans-serif; }

        .info-subgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
        .sub-card { background: rgba(255,255,255,0.01); border: 1px solid rgba(255,255,255,0.04); padding: 25px; border-radius: 12px; transition: 0.3s; }
        .sub-card:hover { border-color: var(--hyper-purple); background: rgba(189,0,255,0.02); }
        .sub-card h3 { color: #fff; font-size: 1.1rem; margin-bottom: 10px; letter-spacing: 1px; }
        .sub-card p { color: #94a3b8; font-size: 0.85rem; line-height: 1.6; font-family: sans-serif; }

        .anchor-container { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 35px; }
        .anchor-btn { padding: 16px 32px; border-radius: 4px; text-decoration: none; font-weight: bold; font-size: 0.85rem; letter-spacing: 2px; transition: all 0.3s ease; display: inline-flex; align-items: center; gap: 12px; text-transform: uppercase; }
        .anchor-btn-primary { background: transparent; color: var(--hyper-cyan); border: 1px solid var(--hyper-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.15); }
        .anchor-btn-primary:hover { background: var(--hyper-cyan); color: var(--deep-matrix); box-shadow: 0 0 35px var(--hyper-cyan); }
        .anchor-btn-secondary { background: transparent; color: #f1f5f9; border: 1px solid rgba(255,255,255,0.2); }
        .anchor-btn-secondary:hover { border-color: var(--hyper-magenta); color: #fff; box-shadow: 0 0 30px rgba(255, 0, 119, 0.4); }

        .reserved-footer-box { margin-top: 45px; border-top: 1px dashed rgba(255, 215, 0, 0.25); padding-top: 30px; text-align: center; color: var(--shield-gold); font-size: 0.85rem; letter-spacing: 2px; line-height: 1.7; text-shadow: 0 0 5px rgba(255,215,0,0.2); }
        footer { text-align: center; color: #334155; font-size: 0.75rem; padding: 45px 0; border-top: 1px solid rgba(255,255,255,0.02); letter-spacing: 2px; }
        @keyframes flashIn { to { opacity: 1; } }
    </style>
</head>
