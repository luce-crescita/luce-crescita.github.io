<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tunnel a Vettore Luce — Luce e Crescita X∞</title>
  <meta name="description" content="Simulatore di pilotaggio interattivo nel Tunnel a Vettore Luce di Luce e Crescita X∞.">
  <meta name="author" content="Mastropaolo Antonello Salvatore">
  <meta name="theme-color" content="#030308">
  <meta property="og:title" content="Tunnel a Vettore Luce — Luce e Crescita X∞">
  <meta property="og:description" content="Simulatore di pilotaggio interattivo.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://luce-crescita.github.io/sorprese-74.html">
  <link rel="canonical" href="https://luce-crescita.github.io/sorprese-74.html">

  <style>
    :root {
      --bg: #030308;
      --cyan: #00f0ff;
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 0);
      left: 0;
      right: 0;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      background: linear-gradient(180deg, rgba(3,3,8,0.9) 0%, transparent 100%);
      pointer-events: none;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .hud-links {
      display: flex;
      gap: 12px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .back-btn {
      text-decoration: none;
      color: var(--cyan);
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      background: rgba(3, 3, 8, 0.6);
      transition: all 0.25s ease;
    }

    .back-btn:hover,
    .back-btn:focus-visible {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 15px var(--cyan);
      transform: translateY(-1px);
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .stats {
      display: flex;
      gap: 2rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .stat-val {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
    }

    canvas {
      width: 100vw;
      height: 100dvh;
      display: block;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .instructions {
      position: absolute;
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0));
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      text-align: center;
      background: rgba(3, 3, 8, 0.7);
      backdrop-filter: blur(8px);
      padding: 7px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: normal;
      max-width: 90vw;
    }

    .motion-warning {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(3,3,8,0.95);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      z-index: 30;
    }

    .motion-warning p { margin-bottom: 1rem; line-height: 1.5; }

    .motion-warning button {
      padding: 0.7rem 1.4rem;
      border: 1px solid var(--cyan);
      background: rgba(0, 240, 255, 0.2);
      color: var(--cyan);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .hud { padding: 0.8rem 1rem; }
      .back-btn { font-size: 0.75rem; padding: 0.4rem 0.7rem; }
      .stats { gap: 1rem; font-size: 0.85rem; }
      .instructions { font-size: 0.7rem; padding: 5px 12px; }
    }
  </style>
</head>
<body>

  <div class="hud">
    <div class="hud-links">
      <a href="index.html" class="back-btn">&larr; Home</a>
      <a href="sorprese.html" class="back-btn"><span aria-hidden="true">🎮</span> Sorprese X∞</a>
    </div>
    <div class="stats">
      <div>ENERGIA X&infin;: <span id="scoreVal" class="stat-val" aria-live="polite">0</span></div>
      <div>FPS: <span id="fpsVal" class="stat-val">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas" 
          role="application" 
          aria-label="Simulatore di volo nel Tunnel a Vettore Luce. Usa mouse, touch o WASD per pilotare la navetta, raccogli le particelle per accumulare energia."
          tabindex="0">
    Il tuo browser non supporta il canvas HTML5. Il gioco richiede un browser moderno.
  </canvas>

  <div class="instructions" id="instructions">Trascina / WASD / Frecce per pilotare</div>

  <noscript>
    <div class="motion-warning">
      <p>Questo gioco richiede JavaScript.</p>
      <a href="sorprese.html" class="back-btn">Torna alle Sorprese</a>
    </div>
  </noscript>

  <script>
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reducedMotion) {
      const warn = document.createElement('div');
      warn.className = 'motion-warning';
      warn.innerHTML = '<p>⚠️ Questa esperienza contiene animazioni intensive.<br>Vuoi continuare?</p><button id="continueBtn">Continua</button>';
      document.body.appendChild(warn);
      const canvas = document.getElementById('gameCanvas');
      canvas.style.display = 'none';
      document.getElementById('continueBtn').addEventListener('click', () => {
        warn.remove();
        canvas.style.display = 'block';
        startGame();
      });
    } else {
      startGame();
    }

    function startGame() {
            const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const scoreVal = document.getElementById('scoreVal');
      const fpsVal = document.getElementById('fpsVal');

      let W = 0, H = 0, dpr = 1;
      function resize() {
        dpr = window.devicePixelRatio || 1;
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      const ship = { x: W / 2, y: H / 2, targetX: W / 2, targetY: H / 2, radius: 10 };
      let score = 0;
      const particles = [];
      const stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          z: Math.random() * 1 + 0.2,
          size: Math.random() * 1.5 + 0.5
        });
      }

      let keys = {};
      window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
      window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

      function updatePointer(x, y) {
        ship.targetX = x;
        ship.targetY = y;
      }
      canvas.addEventListener('mousemove', e => updatePointer(e.clientX, e.clientY));
      canvas.addEventListener('touchmove', e => {
        if (e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });
      canvas.addEventListener('touchstart', e => {
        if (e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      let lastTime = performance.now();
      let frames = 0;
      let fpsTimer = 0;

      function spawnParticle() {
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.max(W, H) * 0.6;
        const cx = W / 2, cy = H / 2;
        particles.push({
          x: cx + Math.cos(angle) * radius,
          y: cy + Math.sin(angle) * radius,
          vx: (cx - (cx + Math.cos(angle) * radius)) * 0.004,
          vy: (cy - (cy + Math.sin(angle) * radius)) * 0.004,
          hue: Math.random() < 0.5 ? 'cyan' : 'gold',
          size: Math.random() * 3 + 2,
          life: 1
        });
      }

      function update(dt) {
        const speed = 0.5;
        if (keys['w'] || keys['arrowup']) ship.targetY -= speed * 10;
        if (keys['s'] || keys['arrowdown']) ship.targetY += speed * 10;
        if (keys['a'] || keys['arrowleft']) ship.targetX -= speed * 10;
        if (keys['d'] || keys['arrowright']) ship.targetX += speed * 10;

        ship.targetX = Math.max(20, Math.min(W - 20, ship.targetX));
        ship.targetY = Math.max(20, Math.min(H - 20, ship.targetY));
        ship.x += (ship.targetX - ship.x) * 0.15;
        ship.y += (ship.targetY - ship.y) * 0.15;

        stars.forEach(s => {
          s.z -= 0.005;
          if (s.z <= 0.1) {
            s.z = 1;
            s.x = Math.random() * W;
            s.y = Math.random() * H;
          }
        });

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          const cx = W / 2, cy = H / 2;
          p.vx += (cx - p.x) * 0.0005;
          p.vy += (cy - p.y) * 0.0005;
          p.x += p.vx * dt * 60;
          p.y += p.vy * dt * 60;

          const dx = p.x - ship.x;
          const dy = p.y - ship.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < ship.radius + p.size) {
            score += 10;
            scoreVal.textContent = String(score);
            particles.splice(i, 1);
            continue;
          }

          if (dist < 20) particles.splice(i, 1);
        }

        if (Math.random() < 0.05) spawnParticle();
      }

      function draw() {
        ctx.fillStyle = '#030308';
        ctx.fillRect(0, 0, W, H);

        stars.forEach(s => {
          ctx.fillStyle = `rgba(255,255,255,${s.z})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.size * s.z, 0, Math.PI * 2);
          ctx.fill();
        });

        particles.forEach(p => {
          ctx.fillStyle = p.hue === 'cyan' ? '#00f0ff' : '#ffd166';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.beginPath();
        ctx.moveTo(0, -ship.radius);
        ctx.lineTo(ship.radius, ship.radius);
        ctx.lineTo(-ship.radius, ship.radius);
        ctx.closePath();
        ctx.fillStyle = '#00f0ff';
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.restore();
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        draw();
        frames++;
        fpsTimer += dt;
        if (fpsTimer >= 1) {
          fpsVal.textContent = String(frames);
          frames = 0;
          fpsTimer = 0;
        }
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
