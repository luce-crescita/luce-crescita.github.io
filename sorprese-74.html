<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tunnel a Vettore Luce — Luce e Crescita X∞</title>

  <meta name="author" content="Mastropaolo Antonello Salvatore">
  <meta name="theme-color" content="#030308">
  <meta property="og:title" content="Tunnel a Vettore Luce — Luce e Crescita X∞">
  <meta property="og:description" content="Simulatore di pilotaggio interattivo.">

  <style>
    :root {
      --bg: #030308;
      --cyan: #00f0ff;
      --gold: #ffd166;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 0);
      left: 0;
      right: 0;
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      background: linear-gradient(180deg, rgba(3,3,8,0.9) 0%, transparent 100%);
      pointer-events: none;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .hud-links {
      display: flex;
      gap: 12px;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .back-btn {
      text-decoration: none;
      color: var(--cyan);
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 0.55rem 1.1rem;
      border-radius: 10px;
      backdrop-filter: blur(10px);
      background: rgba(3, 3, 8, 0.6);
      transition: all 0.25s ease;
    }

    .back-btn:hover,
    .back-btn:focus-visible {
      background: rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 15px var(--cyan);
      transform: translateY(-1px);
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .stats {
      display: flex;
      gap: 2rem;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .stat-val {
      color: var(--gold);
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.6);
    }

    canvas {
      width: 100vw;
      height: 100dvh;
      display: block;
      cursor: crosshair;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .instructions {
      position: absolute;
      bottom: calc(1.5rem + env(safe-area-inset-bottom, 0));
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      text-align: center;
      background: rgba(3, 3, 8, 0.7);
      backdrop-filter: blur(8px);
      padding: 7px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: normal;
      max-width: 90vw;
    }

    .motion-warning {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(3,3,8,0.95);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 2rem;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      z-index: 30;
    }

    .motion-warning p { margin-bottom: 1rem; line-height: 1.5; }

    .motion-warning button {
      padding: 0.7rem 1.4rem;
      border: 1px solid var(--cyan);
      background: rgba(0, 240, 255, 0.2);
      color: var(--cyan);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .hud { padding: 0.8rem 1rem; }
      .back-btn { font-size: 0.75rem; padding: 0.4rem 0.7rem; }
      .stats { gap: 1rem; font-size: 0.85rem; }
      .instructions { font-size: 0.7rem; padding: 5px 12px; }
    }
  </style>
</head>

    </div>
    <div class="stats">
      <div>ENERGIA X&infin;: <span id="scoreVal" class="stat-val" aria-live="polite">0</span></div>
      <div>FPS: <span id="fpsVal" class="stat-val">0</span></div>
    </div>
  </div>

  <canvas id="gameCanvas"

  <div class="instructions" id="instructions">Trascina / WASD / Frecce per pilotare</div>
