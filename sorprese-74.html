
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tunnel a Vettore Luce — Luce e Crescita X∞</title>
<meta name="description" content="Simulatore di pilotaggio interattivo nel Tunnel a Vettore Luce di Luce e Crescita X∞.">
<meta name="author" content="Mastropaolo Antonello Salvatore">
<meta name="theme-color" content="#030308">
<meta property="og:title" content="Tunnel a Vettore Luce — Luce e Crescita X∞">
<meta property="og:description" content="Simulatore di pilotaggio interattivo.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://luce-crescita.github.io/sorprese-74.html">
<meta name="robots" content="noai, noimageai">
<link rel="canonical" href="https://luce-crescita.github.io/sorprese-74.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body class="tunnel-body">

<div class="tunnel-hud">
<div class="tunnel-hud-links">
<a href="index.html" class="tunnel-back-btn">← Home</a>
<a href="sorprese.html" class="tunnel-back-btn"><span aria-hidden="true">🎮</span> Sorprese X∞</a>
<a href="copyright.html" class="tunnel-back-btn">Note Legali</a>
</div>
<div class="tunnel-stats">
<div>ENERGIA X&infin;: <span id="scoreVal" class="tunnel-stat-val" aria-live="polite">0</span></div>
<div>FPS: <span id="fpsVal" class="tunnel-stat-val">0</span></div>
</div>
</div>

<canvas id="gameCanvas" class="tunnel-canvas" role="application" aria-label="Simulatore di volo nel Tunnel a Vettore Luce. Usa mouse, touch o WASD per pilotare la navetta, raccogli le particelle per accumulare energia." tabindex="0">
Il tuo browser non supporta il canvas HTML5. Il gioco richiede un browser moderno.
</canvas>

<div class="tunnel-instructions" id="instructions">Trascina / WASD / Frecce per pilotare</div>

<noscript>
<div class="tunnel-motion-warning">
<p>Questo gioco richiede JavaScript.</p>
<a href="sorprese.html" class="tunnel-back-btn">Torna alle Sorprese</a>
</div>
</noscript>

<script>
(function(){
"use strict";
var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var started = false;

function startGame(){
  if (started) return;
  started = true;

  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var scoreVal = document.getElementById('scoreVal');
  var fpsVal = document.getElementById('fpsVal');
  var instructions = document.getElementById('instructions');

  var W = 0, H = 0, dpr = 1;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  var ship = { x: W / 2, y: H / 2, targetX: W / 2, targetY: H / 2, radius: 10 };
  var score = 0;
  var particles = [];
  var stars = [];
  for (var i = 0; i < 80; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 1 + 0.2, size: Math.random() * 1.5 + 0.5 });
  }

  var keys = {};
  window.addEventListener('keydown', function(e){ keys[e.key.toLowerCase()] = true; if (e.key === 'Escape') canvas.blur(); });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

  function updatePointer(x, y){ ship.targetX = x; ship.targetY = y; hideInstructions(); }
  canvas.addEventListener('pointerdown', function(e){ try { canvas.setPointerCapture(e.pointerId); } catch(err){} updatePointer(e.clientX, e.clientY); });
  canvas.addEventListener('pointermove', function(e){ if (e.buttons) updatePointer(e.clientX, e.clientY); });

  var instructionsHidden = false;
  function hideInstructions(){ if (instructionsHidden) return; instructionsHidden = true; setTimeout(function(){ if (instructions) instructions.style.opacity = '0'; }, 2000); }

  var lastTime = performance.now();
  var frames = 0, fpsTimer = 0;
  var spawnAccumulator = 0;
  var lastScore = 0;

  function spawnParticle(){
    var angle = Math.random() * Math.PI * 2;
    var radius = Math.max(W, H) * 0.6;
    var cx = W / 2, cy = H / 2;
    particles.push({
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius,
      vx: (cx - (cx + Math.cos(angle) * radius)) * 0.004,
      vy: (cy - (cy + Math.sin(angle) * radius)) * 0.004,
      hue: Math.random() < 0.5 ? 'cyan' : 'gold',
      size: Math.random() * 3 + 2
    });
  }

  function update(dt){
    var speed = 0.5;
    if (keys['w'] || keys['arrowup']) ship.targetY -= speed * 10;
    if (keys['s'] || keys['arrowdown']) ship.targetY += speed * 10;
    if (keys['a'] || keys['arrowleft']) ship.targetX -= speed * 10;
    if (keys['d'] || keys['arrowright']) ship.targetX += speed * 10;
    if (keys['w'] || keys['s'] || keys['a'] || keys['d'] || keys['arrowup'] || keys['arrowdown'] || keys['arrowleft'] || keys['arrowright']) hideInstructions();

    ship.targetX = Math.max(20, Math.min(W - 20, ship.targetX));
    ship.targetY = Math.max(20, Math.min(H - 20, ship.targetY));
    ship.x += (ship.targetX - ship.x) * 0.15;
    ship.y += (ship.targetY - ship.y) * 0.15;

    stars.forEach(function(s){
      s.z -= 0.005;
      if (s.z <= 0.1) { s.z = 1; s.x = Math.random() * W; s.y = Math.random() * H; }
    });

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      var cx = W / 2, cy = H / 2;
      p.vx += (cx - p.x) * 0.0005;
      p.vy += (cy - p.y) * 0.0005;
      p.x += p.vx * dt * 60;
      p.y += p.vy * dt * 60;
      var dx = p.x - ship.x, dy = p.y - ship.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < ship.radius + p.size) { score += 10; particles.splice(i, 1); continue; }
    }

    spawnAccumulator += dt * 3;
    while (spawnAccumulator > 1) { spawnParticle(); spawnAccumulator -= 1; }

    if (score !== lastScore) { scoreVal.textContent = String(score); lastScore = score; }
  }

  function draw(){
    ctx.fillStyle = '#030308';
    ctx.fillRect(0, 0, W, H);
    stars.forEach(function(s){
      ctx.fillStyle = 'rgba(255,255,255,' + s.z + ')';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size * s.z, 0, Math.PI * 2);
      ctx.fill();
    });
    particles.forEach(function(p){
      ctx.fillStyle = p.hue === 'cyan' ? '#00f0ff' : '#ffd166';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.save();
    ctx.translate(ship.x, ship.y);
    ctx.beginPath();
    ctx.moveTo(0, -ship.radius);
    ctx.lineTo(ship.radius, ship.radius);
    ctx.lineTo(-ship.radius, ship.radius);
    ctx.closePath();
    ctx.fillStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.restore();
  }

  function loop(now){
    var dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    draw();
    frames++;
    fpsTimer += dt;
    if (fpsTimer >= 1) { fpsVal.textContent = String(frames); frames = 0; fpsTimer = 0; }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  canvas.focus();
}

if (reducedMotion) {
  var warn = document.createElement('div');
  warn.className = 'tunnel-motion-warning';
  warn.innerHTML = '<p>⚠️ Questa esperienza contiene animazioni intensive.<br>Vuoi continuare?</p><button id="continueBtn">Continua</button>';
  document.body.appendChild(warn);
  var canvasEl = document.getElementById('gameCanvas');
  canvasEl.style.display = 'none';
  document.getElementById('continueBtn').addEventListener('click', function(){
    warn.remove();
    canvasEl.style.display = 'block';
    startGame();
  });
} else {
  startGame();
}
})();
</script>
</body>
</html>
