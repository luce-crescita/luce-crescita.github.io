<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Simulatore di Volo - Luce e Crescita X-Infinito</title>
<meta name="author" content="Mastropaolo Antonello Salvatore">
<meta name="robots" content="noai, noimageai">
<link rel="canonical" href="https://luce-crescita.github.io/volo.html">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;overflow:hidden;background:#000;font-family:'Space Mono',monospace;user-select:none;-webkit-user-select:none}
#voloCanvas{display:block;width:100vw;height:100vh;background:#87ceeb;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:#00fff0;text-shadow:0 0 6px #00fff0;font-size:12px;letter-spacing:1px}
.hud-panel{position:absolute;background:rgba(0,0,0,0.5);border:1px solid rgba(0,255,240,0.4);border-radius:8px;padding:8px 12px;backdrop-filter:blur(4px)}
#hud-top-left{top:12px;left:12px}
#hud-top-right{top:12px;right:12px;text-align:right}
#hud-bottom{bottom:12px;left:50%;transform:translateX(-50%);text-align:center;font-size:11px;color:#94a3b8;border-color:rgba(255,255,255,0.2);max-width:90vw}
.hud-value{font-size:16px;font-weight:900;color:#fff}
.hud-bar{width:100px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;margin-top:4px;overflow:hidden}
.hud-bar-fill{height:100%;background:linear-gradient(90deg,#00fff0,#00ff88);width:50%;transition:width 0.1s}
#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:1px solid rgba(0,255,240,0.6);border-radius:50%}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,240,0.6)}
#crosshair::before{top:9px;left:-6px;width:32px;height:1px}
#crosshair::after{top:-6px;left:9px;width:1px;height:32px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#00fff0;font-family:'Space Mono',monospace;z-index:100;font-size:14px;letter-spacing:3px}

/* Touch controls */
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
#touch-controls.active{display:block}
.tc-joystick{position:absolute;bottom:24px;left:24px;width:120px;height:120px;border-radius:50%;background:rgba(0,255,240,0.08);border:2px solid rgba(0,255,240,0.4);pointer-events:auto;touch-action:none}
.tc-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(0,255,240,0.3);border:1px solid rgba(0,255,240,0.8);box-shadow:0 0 12px rgba(0,255,240,0.5);transition:transform 0.05s}
.tc-btn{position:absolute;bottom:24px;width:64px;height:64px;border-radius:50%;background:rgba(0,255,240,0.1);border:2px solid rgba(0,255,240,0.5);color:#00fff0;font-family:'Space Mono',monospace;font-size:11px;font-weight:900;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.tc-btn:active,.tc-btn.pressed{background:rgba(0,255,240,0.35);box-shadow:0 0 16px rgba(0,255,240,0.7)}
#tc-throttle-up{right:100px;bottom:110px}
#tc-throttle-down{right:100px;bottom:24px}
#tc-camera{right:24px;bottom:24px;background:rgba(255,0,170,0.15);border-color:rgba(255,0,170,0.6);color:#ff00aa}
#tc-reset{right:24px;bottom:110px;background:rgba(255,0,64,0.15);border-color:rgba(255,0,64,0.6);color:#ff0040}
#tc-labels{position:absolute;bottom:180px;right:24px;color:#94a3b8;font-size:9px;text-align:right;letter-spacing:1px}
</style>
</head>
<body>

<div id="loading">CARICAMENTO SIMULATORE...</div>

<canvas id="voloCanvas"></canvas>

<div id="hud">
<div id="crosshair"></div>
<div id="hud-top-left" class="hud-panel">
<div>VELOCITA</div>
<div class="hud-value" id="hudSpeed">0</div>
<div style="font-size:10px;color:#94a3b8">km/h</div>
<div style="margin-top:8px;font-size:10px;color:#94a3b8">THROTTLE</div>
<div class="hud-bar"><div class="hud-bar-fill" id="hudThrottle"></div></div>
</div>
<div id="hud-top-right" class="hud-panel">
<div>ALTITUDINE</div>
<div class="hud-value" id="hudAlt">0</div>
<div style="font-size:10px;color:#94a3b8">metri</div>
<div style="margin-top:6px">ROTTA</div>
<div class="hud-value" id="hudHeading">0</div>
<div style="font-size:10px;color:#94a3b8">gradi</div>
<div style="margin-top:6px">VISTA</div>
<div class="hud-value" id="hudCamera" style="font-size:12px;color:#ff00aa">CHASE</div>
</div>
<div id="hud-bottom" class="hud-panel">
W/S: Pitch | A/D: Roll | Q/E: Yaw | Shift/Ctrl: Throttle | V: Vista | R: Reset
</div>
</div>

<div id="touch-controls">
<div class="tc-joystick" id="tc-stick"><div class="tc-knob" id="tc-knob"></div></div>
<div class="tc-btn" id="tc-throttle-up">THR+</div>
<div class="tc-btn" id="tc-throttle-down">THR-</div>
<div class="tc-btn" id="tc-camera">VISTA</div>
<div class="tc-btn" id="tc-reset">RESET</div>
<div id="tc-labels">TOCCA E TRASCINA<br>PER PILOTARE</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// --- SCENA ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 500, 2500);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(0, 10, 30);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('voloCanvas'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

// --- LUCI ---
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(100, 200, 100);
scene.add(sun);

// --- TERRENO ---
const groundGeo = new THREE.PlaneGeometry(4000, 4000, 64, 64);
const groundMat = new THREE.MeshPhongMaterial({ color: 0x2d6a4f, flatShading: true });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1;
scene.add(ground);

// Pista
const runwayGeo = new THREE.PlaneGeometry(40, 400);
const runwayMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
const runway = new THREE.Mesh(runwayGeo, runwayMat);
runway.rotation.x = -Math.PI / 2;
runway.position.set(0, 0.01, -100);
scene.add(runway);

for (let i = -180; i < 200; i += 40) {
  const stripe = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 20),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  stripe.rotation.x = -Math.PI / 2;
  stripe.position.set(0, 0.02, i);
  scene.add(stripe);
}

// Alberi stilizzati per riferimento visivo
for (let i = 0; i < 80; i++) {
  const tree = new THREE.Mesh(
    new THREE.ConeGeometry(4, 12, 6),
    new THREE.MeshPhongMaterial({ color: 0x1a4d2e, flatShading: true })
  );
  const ang = Math.random() * Math.PI * 2;
  const rad = 200 + Math.random() * 1500;
  tree.position.set(Math.cos(ang) * rad, 5, Math.sin(ang) * rad);
  scene.add(tree);
}

// --- AEREO ---
const plane = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.BoxGeometry(1.2, 0.8, 4),
  new THREE.MeshPhongMaterial({ color: 0xff0040 })
);
plane.add(body);

const wingMat = new THREE.MeshPhongMaterial({ color: 0xcccccc });
const wing = new THREE.Mesh(new THREE.BoxGeometry(8, 0.2, 1.5), wingMat);
wing.position.set(0, 0, 0.5);
plane.add(wing);

const tail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 1), wingMat);
tail.position.set(0, 0.6, 1.8);
plane.add(tail);

const prop = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 3, 0.2),
  new THREE.MeshBasicMaterial({ color: 0x222222 })
);
prop.position.set(0, 0, -2.1);
plane.add(prop);

scene.add(plane);

// --- STATO DI VOLO ---
const state = {
  pos: new THREE.Vector3(0, 50, 100),
  pitch: 0,
  roll: 0,
  yaw: 0,
  throttle: 0.5,
  speed: 108, // km/h
  altitude: 50,
  heading: 0
};

// --- CONTROLLI TASTIERA ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyV') cameraMode = (cameraMode + 1) % 2;
  if (e.code === 'KeyR') resetFlight();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let cameraMode = 0; // 0 = chase, 1 = cockpit

function resetFlight() {
  state.pos.set(0, 50, 100);
  state.pitch = 0;
  state.roll = 0;
  state.yaw = 0;
  state.throttle = 0.5;
  state.speed = 108;
}

// --- CONTROLLI TOUCH ---
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouch) {
  document.getElementById('touch-controls').classList.add('active');
  document.getElementById('hud-bottom').textContent = 'Joystick: pitch/roll | THR+/-: throttle | VISTA | RESET';
}

const stick = document.getElementById('tc-stick');
const knob = document.getElementById('tc-knob');
let stickActive = false, stickId = null;
let touchPitch = 0, touchRoll = 0;

function stickMove(clientX, clientY) {
  const rect = stick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = (clientX - cx) / (rect.width / 2);
  let dy = (clientY - cy) / (rect.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  touchRoll = dx;
  touchPitch = -dy; // su = muso su
  knob.style.transform = `translate(${dx * 35}px, ${dy * 35}px)`;
}

stick.addEventListener('pointerdown', e => {
  e.preventDefault();
  stickActive = true;
  stickId = e.pointerId;
  stick.setPointerCapture(e.pointerId);
  stickMove(e.clientX, e.clientY);
});
stick.addEventListener('pointermove', e => {
  if (!stickActive || e.pointerId !== stickId) return;
  e.preventDefault();
  stickMove(e.clientX, e.clientY);
});
stick.addEventListener('pointerup', e => {
  if (e.pointerId !== stickId) return;
  stickActive = false;
  stickId = null;
  touchPitch = 0; touchRoll = 0;
  knob.style.transform = 'translate(0,0)';
});
stick.addEventListener('pointercancel', () => {
  stickActive = false;
  stickId = null;
  touchPitch = 0; touchRoll = 0;
  knob.style.transform = 'translate(0,0)';
});

// Throttle touch
let touchThrottleDir = 0;
const thrUp = document.getElementById('tc-throttle-up');
const thrDown = document.getElementById('tc-throttle-down');

function bindHold(el, dir) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); touchThrottleDir = dir; el.classList.add('pressed'); });
  el.addEventListener('pointerup', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
  el.addEventListener('pointercancel', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
  el.addEventListener('pointerleave', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
}
bindHold(thrUp, 1);
bindHold(thrDown, -1);

document.getElementById('tc-camera').addEventListener('pointerdown', e => {
  e.preventDefault();
  cameraMode = (cameraMode + 1) % 2;
});
document.getElementById('tc-reset').addEventListener('pointerdown', e => {
  e.preventDefault();
  resetFlight();
});

// --- LOOP ---
const clock = new THREE.Clock();
const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
const _chaseOffset = new THREE.Vector3();
const _cockpitOffset = new THREE.Vector3();
const _lookTarget = new THREE.Vector3();

let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // --- INPUT ---
  let inPitch = 0, inRoll = 0, inYaw = 0;
  if (keys['KeyW']) inPitch += 1;
  if (keys['KeyS']) inPitch -= 1;
  if (keys['KeyA']) inRoll += 1;
  if (keys['KeyD']) inRoll -= 1;
  if (keys['KeyQ']) inYaw += 1;
  if (keys['KeyE']) inYaw -= 1;
  if (keys['ShiftLeft'] || keys['ShiftRight']) state.throttle = Math.min(1, state.throttle + 0.4 * dt);
  if (keys['ControlLeft'] || keys['ControlRight']) state.throttle = Math.max(0, state.throttle - 0.4 * dt);

  // Touch
  inPitch += touchPitch;
  inRoll += touchRoll;
  if (touchThrottleDir > 0) state.throttle = Math.min(1, state.throttle + 0.4 * dt);
  if (touchThrottleDir < 0) state.throttle = Math.max(0, state.throttle - 0.4 * dt);

  // Applica input
  state.pitch += inPitch * 0.9 * dt;
  state.roll += inRoll * 1.2 * dt;
  state.yaw += inYaw * 0.6 * dt;

  // Limiti
  state.pitch = Math.max(-1.2, Math.min(1.2, state.pitch));
  state.roll = Math.max(-1.5, Math.min(1.5, state.roll));

  // Auto-livellamento roll quando nessun input
  if (Math.abs(inRoll) < 0.05 && Math.abs(state.roll) > 0.02) {
    state.roll -= state.roll * 1.5 * dt;
  }

  // --- FISICA ---
  _euler.set(state.pitch, state.yaw, 0);
  _forward.set(0, 0, -1).applyEuler(_euler);

  // Velocità verso target in base al throttle
  const targetSpeed = state.throttle * 180; // km/h max
  state.speed += (targetSpeed - state.speed) * 0.8 * dt;
  const speedMs = state.speed / 3.6;

  // Movimento orizzontale lungo forward
  state.pos.x += _forward.x * speedMs * dt;
  state.pos.z += _forward.z * speedMs * dt;

  // Verticale: pitch controlla salita/discesa, throttle compensa gravità
  const climbRate = Math.sin(state.pitch) * speedMs * 0.6;
  const lift = state.speed * 0.06 * Math.cos(state.roll);
  const gravity = 9.8 * (1 - state.throttle * 0.9);
  state.pos.y += (climbRate + lift - gravity) * dt;

  // Limite terreno
  if (state.pos.y < 1) {
    state.pos.y = 1;
    state.speed = Math.max(0, state.speed - 80 * dt);
    state.pitch = Math.max(state.pitch, 0);
  }
  // Soffitto
  if (state.pos.y > 1500) {
    state.pos.y = 1500;
    state.pitch = Math.min(state.pitch, 0);
  }

  // --- AGGIORNA AEREO ---
  plane.position.copy(state.pos);
  plane.rotation.set(state.pitch, state.yaw, state.roll, 'YXZ');
  prop.rotation.z += (0.3 + state.throttle * 25) * dt;

  // --- CAMERA ---
  if (cameraMode === 0) {
    // Chase
    _euler.set(state.pitch * 0.5, state.yaw, 0);
    _chaseOffset.set(0, 3, 12).applyEuler(_euler);
    _lookTarget.copy(state.pos).add(_chaseOffset);
    camera.position.lerp(_lookTarget, 0.08);
    camera.lookAt(state.pos);
  } else {
    // Cockpit
    _euler.set(state.pitch, state.yaw, 0);
    _cockpitOffset.set(0, 1, -1.5).applyEuler(_euler);
    camera.position.copy(state.pos).add(_cockpitOffset);
    _lookTarget.copy(state.pos).add(_forward.clone().multiplyScalar(20));
    camera.lookAt(_lookTarget);
  }

  // --- HUD ---
  state.altitude = state.pos.y;
  state.heading = ((state.yaw * 180 / Math.PI) % 360 + 360) % 360;
  document.getElementById('hudSpeed').textContent = Math.round(state.speed);
  document.getElementById('hudAlt').textContent = Math.round(state.altitude);
  document.getElementById('hudHeading').textContent = Math.round(state.heading);
  document.getElementById('hudThrottle').style.width = (state.throttle * 100) + '%';
  document.getElementById('hudCamera').textContent = cameraMode === 0 ? 'CHASE' : 'COCKPIT';

  renderer.render(scene, camera);

  if (firstFrame) {
    document.getElementById('loading').style.display = 'none';
    firstFrame = false;
  }
}

// --- RESIZE ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- START ---
plane.position.copy(state.pos);
animate();
</script>
</body>
</html>
