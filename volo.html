
<!DOCTYPE html>
<html lang="it">
<head>

<title>Simulatore di Volo - Luce e Crescita X-Infinito</title>

<link rel="canonical" href="https://luce-crescita.github.io/volo.html">

<style>
body{margin:0;overflow:hidden;background:#000;font-family:'Space Mono',monospace;user-select:none;-webkit-user-select:none}
#voloCanvas{display:block;width:100vw;height:100vh;background:#87ceeb;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:#00fff0;text-shadow:0 0 6px #00fff0;font-size:12px;letter-spacing:1px}
.hud-panel{position:absolute;background:rgba(0,0,0,0.55);border:1px solid rgba(0,255,240,0.4);border-radius:8px;padding:8px 12px;backdrop-filter:blur(4px)}
#hud-top-left{top:12px;left:12px}
#hud-top-right{top:12px;right:12px;text-align:right}
#hud-bottom{bottom:12px;left:50%;transform:translateX(-50%);text-align:center;font-size:10px;color:#94a3b8;border-color:rgba(255,255,255,0.2);max-width:92vw;line-height:1.6}
.hud-value{font-size:16px;font-weight:900;color:#fff}
.hud-bar{width:110px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;margin-top:4px;overflow:hidden}
.hud-bar-fill{height:100%;background:linear-gradient(90deg,#00fff0,#00ff88);width:50%;transition:width 0.1s}
#gear-indicator{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:900;margin-top:4px}
#gear-indicator.down{background:rgba(0,255,136,0.3);color:#00ff88;border:1px solid #00ff88}
#gear-indicator.up{background:rgba(255,0,64,0.3);color:#ff0040;border:1px solid #ff0040}
#gear-indicator.transit{background:rgba(255,170,0,0.3);color:#ffaa00;border:1px solid #ffaa00}
#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:1px solid rgba(0,255,240,0.6);border-radius:50%}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,240,0.6)}
#crosshair::before{top:9px;left:-6px;width:32px;height:1px}
#crosshair::after{top:-6px;left:9px;width:1px;height:32px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#00fff0;font-family:'Space Mono',monospace;z-index:100;font-size:14px;letter-spacing:3px}
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
#touch-controls.active{display:block}
.tc-joystick{position:absolute;bottom:24px;left:24px;width:120px;height:120px;border-radius:50%;background:rgba(0,255,240,0.08);border:2px solid rgba(0,255,240,0.4);pointer-events:auto;touch-action:none}
.tc-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(0,255,240,0.3);border:1px solid rgba(0,255,240,0.8);box-shadow:0 0 12px rgba(0,255,240,0.5);transition:transform 0.05s}
.tc-btn{position:absolute;bottom:24px;width:64px;height:64px;border-radius:50%;background:rgba(0,255,240,0.1);border:2px solid rgba(0,255,240,0.5);color:#00fff0;font-family:'Space Mono',monospace;font-size:11px;font-weight:900;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.tc-btn:active,.tc-btn.pressed{background:rgba(0,255,240,0.35);box-shadow:0 0 16px rgba(0,255,240,0.7)}
#tc-throttle-up{right:100px;bottom:110px}
#tc-throttle-down{right:100px;bottom:24px}
#tc-camera{right:24px;bottom:24px;background:rgba(255,0,170,0.15);border-color:rgba(255,0,170,0.6);color:#ff00aa}
#tc-gear{right:24px;bottom:110px;background:rgba(0,255,136,0.15);border-color:rgba(0,255,136,0.6);color:#00ff88}
#tc-reset{right:24px;bottom:196px;background:rgba(255,0,64,0.15);border-color:rgba(255,0,64,0.6);color:#ff0040}
</style>
</head>
<body>

<div id="loading">CARICAMENTO SIMULATORE...</div>

<canvas id="voloCanvas"></canvas>

<div id="hud">
<div id="crosshair"></div>
<div id="hud-top-left" class="hud-panel">
<div>VELOCITA</div>
<div class="hud-value" id="hudSpeed">0</div>
<div style="font-size:10px;color:#94a3b8">km/h</div>
<div style="margin-top:8px;font-size:10px;color:#94a3b8">THROTTLE</div>
<div class="hud-bar"><div class="hud-bar-fill" id="hudThrottle"></div></div>
<div style="margin-top:8px;font-size:10px;color:#94a3b8">CARRELLO</div>
<div id="gear-indicator" class="down">GIU</div>
</div>
<div id="hud-top-right" class="hud-panel">
<div>ALTITUDINE</div>
<div class="hud-value" id="hudAlt">0</div>
<div style="font-size:10px;color:#94a3b8">metri</div>
<div style="margin-top:6px">ROTTA</div>
<div class="hud-value" id="hudHeading">0</div>
<div style="font-size:10px;color:#94a3b8">gradi</div>

<div class="hud-value" id="hudCamera" style="font-size:12px;color:#ff00aa">CHASE</div>
</div>
<div id="hud-bottom" class="hud-panel">
W/S: Pitch | A/D: Roll | Q/E: Yaw | Shift/Ctrl: Throttle | G: Carrello | V: Vista | R: Reset
</div>
</div>

<div id="touch-controls">
<div class="tc-joystick" id="tc-stick"><div class="tc-knob" id="tc-knob"></div></div>
<div class="tc-btn" id="tc-throttle-up">THR+</div>
<div class="tc-btn" id="tc-throttle-down">THR-</div>
<div class="tc-btn" id="tc-camera">VISTA</div>
<div class="tc-btn" id="tc-gear">GEAR</div>
<div class="tc-btn" id="tc-reset">RESET</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// AUDIO ENGINE (Web Audio API - sintesi dinamica)
// ============================================================
const AudioEngine = (() => {
  let ctx = null, master = null;
  let engineOsc = null, engineGain = null, engineFilter = null;
  let windGain = null, windFilter = null;
  let gearSound = null;
  let initialized = false;

  function init() {
    if (initialized) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.25;
    master.connect(ctx.destination);

    // Motore: oscillatore + filtro + gain
    engineOsc = ctx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 60;
    engineFilter = ctx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 400;
    engineGain = ctx.createGain();
    engineGain.gain.value = 0.3;
    engineOsc.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(master);
    engineOsc.start();

    // Vento: rumore bianco filtrato
    const bufferSize = ctx.sampleRate * 2;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;
    windFilter = ctx.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.value = 800;
    windFilter.Q.value = 0.5;
    windGain = ctx.createGain();
    windGain.gain.value = 0;
    noise.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(master);
    noise.start();

    initialized = true;
  }

  function setEngine(throttle, speed) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const freq = 40 + throttle * 120 + speed * 0.3;
    engineOsc.frequency.setTargetAtTime(freq, now, 0.05);
    engineFilter.frequency.setTargetAtTime(300 + throttle * 1200, now, 0.05);
    engineGain.gain.setTargetAtTime(0.1 + throttle * 0.35, now, 0.05);
  }

  function setWind(speed) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const intensity = Math.min(1, speed / 200);
    windGain.gain.setTargetAtTime(intensity * 0.15, now, 0.1);
    windFilter.frequency.setTargetAtTime(400 + speed * 8, now, 0.1);
  }

  function gearTransit() {
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = 80;
    g.gain.setValueAtTime(0.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.connect(g);
    g.connect(master);
    o.start();
    o.stop(ctx.currentTime + 0.65);
  }

  function impact() {
    if (!ctx) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(120, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.3, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.connect(g);
    g.connect(master);
    o.start();
    o.stop(ctx.currentTime + 0.55);
  }

  function resume() {
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }

  return { init, setEngine, setWind, gearTransit, impact, resume, get ctx() { return ctx; } };
})();

// ============================================================
// SCENA
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 600, 2800);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 6000);
camera.position.set(0, 10, 30);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('voloCanvas'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

// Luci
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(150, 250, 100);
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x87ceeb, 0x2d6a4f, 0.4);
scene.add(hemi);

// ============================================================
// TERRENO
// ============================================================
const groundGeo = new THREE.PlaneGeometry(5000, 5000, 80, 80);
const groundMat = new THREE.MeshPhongMaterial({ color: 0x2d6a4f, flatShading: true });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1;
scene.add(ground);

// Pista
const runwayGeo = new THREE.PlaneGeometry(45, 500);
const runwayMat = new THREE.MeshPhongMaterial({ color: 0x2a2a2a });
const runway = new THREE.Mesh(runwayGeo, runwayMat);
runway.rotation.x = -Math.PI / 2;
runway.position.set(0, 0.01, -120);
scene.add(runway);

// Strisce pista
for (let i = -220; i < 250; i += 40) {
  const stripe = new THREE.Mesh(
    new THREE.PlaneGeometry(2.5, 22),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  stripe.rotation.x = -Math.PI / 2;
  stripe.position.set(0, 0.02, i);
  scene.add(stripe);
}

// Alberi
for (let i = 0; i < 120; i++) {
  const tree = new THREE.Mesh(
    new THREE.ConeGeometry(4 + Math.random() * 3, 10 + Math.random() * 8, 6),
    new THREE.MeshPhongMaterial({ color: 0x1a4d2e, flatShading: true })
  );
  const ang = Math.random() * Math.PI * 2;
  const rad = 250 + Math.random() * 1800;
  tree.position.set(Math.cos(ang) * rad, 5, Math.sin(ang) * rad);
  scene.add(tree);
}

// ============================================================
// AEREO (modello procedurale migliorato)
// ============================================================
const plane = new THREE.Group();

// Fusoliera
const fuselageGeo = new THREE.CylinderGeometry(0.6, 0.4, 5, 8);
fuselageGeo.rotateX(Math.PI / 2);
const fuselage = new THREE.Mesh(fuselageGeo, new THREE.MeshPhongMaterial({ color: 0xdddddd, shininess: 30 }));
plane.add(fuselage);

// Muso
const noseGeo = new THREE.ConeGeometry(0.6, 1.2, 8);
noseGeo.rotateX(-Math.PI / 2);
const nose = new THREE.Mesh(noseGeo, new THREE.MeshPhongMaterial({ color: 0xff0040 }));
nose.position.z = -3.1;
plane.add(nose);

// Ali
const wingMat = new THREE.MeshPhongMaterial({ color: 0xcccccc, side: THREE.DoubleSide });
const wingGeo = new THREE.BoxGeometry(10, 0.15, 1.8);
const wing = new THREE.Mesh(wingGeo, wingMat);
wing.position.set(0, -0.1, 0.3);
plane.add(wing);

// Stabilizzatori
const tailGeo = new THREE.BoxGeometry(3.5, 0.12, 0.9);
const tail = new THREE.Mesh(tailGeo, wingMat);
tail.position.set(0, 0, 2.2);
plane.add(tail);

// Deriva verticale
const finGeo = new THREE.BoxGeometry(0.12, 1.2, 1.0);
const fin = new THREE.Mesh(finGeo, wingMat);
fin.position.set(0, 0.6, 2.2);
plane.add(fin);

// Elica
const propGroup = new THREE.Group();
const propBlade = new THREE.BoxGeometry(0.08, 2.8, 0.08);
const propMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
for (let i = 0; i < 2; i++) {
  const blade = new THREE.Mesh(propBlade, propMat);
  blade.rotation.z = i * Math.PI / 2;
  propGroup.add(blade);
}
propGroup.position.z = -3.7;
plane.add(propGroup);

// Carrello (3 gambe: anteriore, sinistra, destra)
const gearGroup = new THREE.Group();
const gearMat = new THREE.MeshPhongMaterial({ color: 0x333333 });

function createGearLeg(x, z, length) {
  const leg = new THREE.Group();
  const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, length, 6), gearMat);
  strut.position.y = -length / 2;
  leg.add(strut);
  const wheel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.25, 0.15, 12),
    new THREE.MeshPhongMaterial({ color: 0x111111 })
  );
  wheel.rotation.z = Math.PI / 2;
  wheel.position.y = -length;
  leg.add(wheel);
  leg.position.set(x, -0.5, z);
  return leg;
}

const gearFront = createGearLeg(0, -2.0, 0.8);
const gearLeft = createGearLeg(-1.5, 0.8, 0.9);
const gearRight = createGearLeg(1.5, 0.8, 0.9);
gearGroup.add(gearFront, gearLeft, gearRight);
plane.add(gearGroup);

scene.add(plane);

// ============================================================
// STATO DI VOLO
// ============================================================
const state = {
  pos: new THREE.Vector3(0, 1.2, 100),
  pitch: 0,
  roll: 0,
  yaw: 0,
  throttle: 0.0,
  speed: 0,
  altitude: 1.2,
  heading: 0,
  gearDown: true,
  gearTransit: 0,
  onGround: true,
  verticalSpeed: 0
};

// ============================================================
// CONTROLLI
// ============================================================
const keys = {};
let cameraMode = 0;

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyV') cameraMode = (cameraMode + 1) % 2;
  if (e.code === 'KeyR') resetFlight();
  if (e.code === 'KeyG') toggleGear();
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

function resetFlight() {
  state.pos.set(0, 1.2, 100);
  state.pitch = 0;
  state.roll = 0;
  state.yaw = 0;
  state.throttle = 0;
  state.speed = 0;
  state.gearDown = true;
  state.gearTransit = 0;
  state.onGround = true;
  gearGroup.position.y = 0;
  gearGroup.visible = true;
}

function toggleGear() {
  if (state.onGround) return; // Non aprire carrello a terra
  state.gearDown = !state.gearDown;
  state.gearTransit = 1.0;
  AudioEngine.gearTransit();
}

// Touch
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouch) document.getElementById('touch-controls').classList.add('active');

const stick = document.getElementById('tc-stick');
const knob = document.getElementById('tc-knob');
let stickActive = false, stickId = null;
let touchPitch = 0, touchRoll = 0;

function stickMove(clientX, clientY) {
  const rect = stick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = (clientX - cx) / (rect.width / 2);
  let dy = (clientY - cy) / (rect.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  touchRoll = dx;
  touchPitch = -dy;
  knob.style.transform = `translate(${dx * 35}px, ${dy * 35}px)`;
}

stick.addEventListener('pointerdown', e => { e.preventDefault(); stickActive = true; stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e.clientX, e.clientY); });
stick.addEventListener('pointermove', e => { if (!stickActive || e.pointerId !== stickId) return; e.preventDefault(); stickMove(e.clientX, e.clientY); });
stick.addEventListener('pointerup', e => { if (e.pointerId !== stickId) return; stickActive = false; stickId = null; touchPitch = 0; touchRoll = 0; knob.style.transform = 'translate(0,0)'; });
stick.addEventListener('pointercancel', () => { stickActive = false; stickId = null; touchPitch = 0; touchRoll = 0; knob.style.transform = 'translate(0,0)'; });

let touchThrottleDir = 0;
function bindHold(el, dir) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); touchThrottleDir = dir; el.classList.add('pressed'); });
  el.addEventListener('pointerup', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
  el.addEventListener('pointercancel', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
  el.addEventListener('pointerleave', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
}
bindHold(document.getElementById('tc-throttle-up'), 1);
bindHold(document.getElementById('tc-throttle-down'), -1);

document.getElementById('tc-camera').addEventListener('pointerdown', e => { e.preventDefault(); cameraMode = (cameraMode + 1) % 2; });
document.getElementById('tc-gear').addEventListener('pointerdown', e => { e.preventDefault(); toggleGear(); });
document.getElementById('tc-reset').addEventListener('pointerdown', e => { e.preventDefault(); resetFlight(); });

// ============================================================
// LOOP
// ============================================================
const clock = new THREE.Clock();
const _forward = new THREE.Vector3();
const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
const _chaseOffset = new THREE.Vector3();
const _cockpitOffset = new THREE.Vector3();
const _lookTarget = new THREE.Vector3();
let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // Audio init al primo gesto
  if (firstFrame || !AudioEngine.ctx) {
    AudioEngine.init();
    AudioEngine.resume();
  }

  // --- INPUT ---
  let inPitch = 0, inRoll = 0, inYaw = 0;
  if (keys['KeyW']) inPitch += 1;
  if (keys['KeyS']) inPitch -= 1;
  if (keys['KeyA']) inRoll += 1;
  if (keys['KeyD']) inRoll -= 1;
  if (keys['KeyQ']) inYaw += 1;
  if (keys['KeyE']) inYaw -= 1;
  if (keys['ShiftLeft'] || keys['ShiftRight']) state.throttle = Math.min(1, state.throttle + 0.4 * dt);
  if (keys['ControlLeft'] || keys['ControlRight']) state.throttle = Math.max(0, state.throttle - 0.4 * dt);

  inPitch += touchPitch;
  inRoll += touchRoll;
  if (touchThrottleDir > 0) state.throttle = Math.min(1, state.throttle + 0.4 * dt);
  if (touchThrottleDir < 0) state.throttle = Math.max(0, state.throttle - 0.4 * dt);

  // Applica input
  state.pitch += inPitch * 0.9 * dt;
  state.roll += inRoll * 1.2 * dt;
  state.yaw += inYaw * 0.6 * dt;
  state.pitch = Math.max(-1.2, Math.min(1.2, state.pitch));
  state.roll = Math.max(-1.5, Math.min(1.5, state.roll));
  if (Math.abs(inRoll) < 0.05 && Math.abs(state.roll) > 0.02) state.roll -= state.roll * 1.5 * dt;

  // --- FISICA ---
  _euler.set(state.pitch, state.yaw, 0);
  _forward.set(0, 0, -1).applyEuler(_euler);

  const targetSpeed = state.throttle * 200;
  state.speed += (targetSpeed - state.speed) * 0.8 * dt;
  const speedMs = state.speed / 3.6;

  // Decollo: se sei a terra e hai abbastanza velocità + pitch positivo
  if (state.onGround) {
    if (state.speed > 80 && state.pitch > 0.1) {
      state.onGround = false;
      state.pos.y += 0.5;
    } else {
      state.pos.y = 1.2;
      state.speed = Math.max(0, state.speed - 30 * dt);
    }
  }

  if (!state.onGround) {
    state.pos.x += _forward.x * speedMs * dt;
    state.pos.z += _forward.z * speedMs * dt;
    const climbRate = Math.sin(state.pitch) * speedMs * 0.6;
    const lift = state.speed * 0.06 * Math.cos(state.roll);
    const gravity = 9.8 * (1 - state.throttle * 0.9);
    state.verticalSpeed = climbRate + lift - gravity;
    state.pos.y += state.verticalSpeed * dt;

    // Atterraggio
    if (state.pos.y <= 1.2) {
      state.pos.y = 1.2;
      if (state.verticalSpeed < -3) {
        AudioEngine.impact();
        state.speed *= 0.5;
      }
      state.onGround = true;
      state.pitch = Math.max(state.pitch, 0);
    }
    if (state.pos.y > 2000) { state.pos.y = 2000; state.pitch = Math.min(state.pitch, 0); }
  }

  // --- CARRELLO ANIMAZIONE ---
  if (state.gearTransit > 0) {
    state.gearTransit -= dt * 1.5;
    const t = 1 - Math.max(0, state.gearTransit);
    if (state.gearDown) {
      gearGroup.position.y = -t * 2.5;
      gearGroup.visible = true;
    } else {
      gearGroup.position.y = -2.5 + t * 2.5;
      if (state.gearTransit <= 0) gearGroup.visible = false;
    }
  }

  // --- AGGIORNA AEREO ---
  plane.position.copy(state.pos);
  plane.rotation.set(state.pitch, state.yaw, state.roll, 'YXZ');
  propGroup.rotation.z += (0.3 + state.throttle * 30) * dt;

  // --- AUDIO ---
  AudioEngine.setEngine(state.throttle, state.speed);
  AudioEngine.setWind(state.speed);

  // --- CAMERA ---
  if (cameraMode === 0) {
    _euler.set(state.pitch * 0.5, state.yaw, 0);
    _chaseOffset.set(0, 4, 14).applyEuler(_euler);
    _lookTarget.copy(state.pos).add(_chaseOffset);
    camera.position.lerp(_lookTarget, 0.08);
    camera.lookAt(state.pos);
  } else {
    _euler.set(state.pitch, state.yaw, 0);
    _cockpitOffset.set(0, 1.2, -1).applyEuler(_euler);
    camera.position.copy(state.pos).add(_cockpitOffset);
    _lookTarget.copy(state.pos).add(_forward.clone().multiplyScalar(25));
    camera.lookAt(_lookTarget);
  }

  // --- HUD ---
  document.getElementById('hudSpeed').textContent = Math.round(state.speed);
  document.getElementById('hudAlt').textContent = Math.round(state.pos.y);
  document.getElementById('hudHeading').textContent = Math.round(((state.yaw * 180 / Math.PI) % 360 + 360) % 360);
  document.getElementById('hudThrottle').style.width = (state.throttle * 100) + '%';
  document.getElementById('hudCamera').textContent = cameraMode === 0 ? 'CHASE' : 'COCKPIT';

  const gearEl = document.getElementById('gear-indicator');
  if (state.gearTransit > 0) { gearEl.className = 'transit'; gearEl.textContent = 'IN MOVIMENTO'; }
  else if (state.gearDown) { gearEl.className = 'down'; gearEl.textContent = 'GIU'; }
  else { gearEl.className = 'up'; gearEl.textContent = 'SU'; }

  renderer.render(scene, camera);

  if (firstFrame) {
    document.getElementById('loading').style.display = 'none';
    firstFrame = false;
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

plane.position.copy(state.pos);
animate();
</script>
</body>
</html>
