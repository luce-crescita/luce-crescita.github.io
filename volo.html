<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Simulatore di Volo Avanzato - Luce e Crescita X-Infinito</title>
<meta name="author" content="Mastropaolo Antonello Salvatore">
<meta name="robots" content="noai, noimageai">
<link rel="canonical" href="https://luce-crescita.github.io/volo.html">
<link rel="stylesheet" href="style.css">
<style>
body{margin:0;overflow:hidden;background:#000;font-family:'Space Mono',monospace;user-select:none;-webkit-user-select:none}
#voloCanvas{display:block;width:100vw;height:100vh;background:#87ceeb;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;color:#00fff0;text-shadow:0 0 6px #00fff0;font-size:12px;letter-spacing:1px}
.hud-panel{position:absolute;background:rgba(0,0,0,0.55);border:1px solid rgba(0,255,240,0.4);border-radius:8px;padding:8px 12px;backdrop-filter:blur(4px)}
#hud-top-left{top:12px;left:12px}
#hud-top-right{top:12px;right:12px;text-align:right}
#hud-bottom{bottom:12px;left:50%;transform:translateX(-50%);text-align:center;font-size:10px;color:#94a3b8;border-color:rgba(255,255,255,0.2);max-width:92vw;line-height:1.6}
.hud-value{font-size:16px;font-weight:900;color:#fff}
.hud-bar{width:110px;height:6px;background:rgba(255,255,255,0.15);border-radius:3px;margin-top:4px;overflow:hidden}
.hud-bar-fill{height:100%;background:linear-gradient(90deg,#00fff0,#00ff88);width:0%;transition:width 0.1s}
#gear-indicator{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:900;margin-top:4px}
#gear-indicator.down{background:rgba(0,255,136,0.3);color:#00ff88;border:1px solid #00ff88}
#gear-indicator.up{background:rgba(255,0,64,0.3);color:#ff0040;border:1px solid #ff0040}
#gear-indicator.transit{background:rgba(255,170,0,0.3);color:#ffaa00;border:1px solid #ffaa00}
#stall-warning{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff0040;font-size:24px;font-weight:900;text-shadow:0 0 20px #ff0040;opacity:0;transition:opacity 0.3s;pointer-events:none}
#stall-warning.active{opacity:1}
#crosshair{position:absolute;top:50%;left:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border:1px solid rgba(0,255,240,0.6);border-radius:50%}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(0,255,240,0.6)}
#crosshair::before{top:9px;left:-6px;width:32px;height:1px}
#crosshair::after{top:-6px;left:9px;width:1px;height:32px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#00fff0;font-family:'Space Mono',monospace;z-index:100;font-size:14px;letter-spacing:3px}
#touch-controls{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
#touch-controls.active{display:block}
.tc-joystick{position:absolute;bottom:24px;left:24px;width:120px;height:120px;border-radius:50%;background:rgba(0,255,240,0.08);border:2px solid rgba(0,255,240,0.4);pointer-events:auto;touch-action:none}
.tc-knob{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(0,255,240,0.3);border:1px solid rgba(0,255,240,0.8);box-shadow:0 0 12px rgba(0,255,240,0.5);transition:transform 0.05s}
.tc-btn{position:absolute;bottom:24px;width:64px;height:64px;border-radius:50%;background:rgba(0,255,240,0.1);border:2px solid rgba(0,255,240,0.5);color:#00fff0;font-family:'Space Mono',monospace;font-size:11px;font-weight:900;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
.tc-btn:active,.tc-btn.pressed{background:rgba(0,255,240,0.35);box-shadow:0 0 16px rgba(0,255,240,0.7)}
#tc-throttle-up{right:100px;bottom:110px}
#tc-throttle-down{right:100px;bottom:24px}
#tc-camera{right:24px;bottom:24px;background:rgba(255,0,170,0.15);border-color:rgba(255,0,170,0.6);color:#ff00aa}
#tc-gear{right:24px;bottom:110px;background:rgba(0,255,136,0.15);border-color:rgba(0,255,136,0.6);color:#00ff88}
#tc-reset{right:24px;bottom:196px;background:rgba(255,0,64,0.15);border-color:rgba(255,0,64,0.6);color:#ff0040}
</style>
</head>
<body>

<div id="loading">INIZIALIZZAZIONE SISTEMI DI VOLO...</div>

<canvas id="voloCanvas"></canvas>

<div id="hud">
<div id="crosshair"></div>
<div id="stall-warning">STALLO</div>
<div id="hud-top-left" class="hud-panel">
<div>VELOCITA</div>
<div class="hud-value" id="hudSpeed">0</div>
<div style="font-size:10px;color:#94a3b8">km/h</div>
<div style="margin-top:8px;font-size:10px;color:#94a3b8">THROTTLE</div>
<div class="hud-bar"><div class="hud-bar-fill" id="hudThrottle"></div></div>
<div style="margin-top:8px;font-size:10px;color:#94a3b8">CARRELLO</div>
<div id="gear-indicator" class="down">GIU</div>
</div>
<div id="hud-top-right" class="hud-panel">
<div>ALTITUDINE</div>
<div class="hud-value" id="hudAlt">0</div>
<div style="font-size:10px;color:#94a3b8">metri</div>
<div style="margin-top:6px">ROTTA</div>
<div class="hud-value" id="hudHeading">0</div>
<div style="font-size:10px;color:#94a3b8">gradi</div>
<div style="margin-top:6px">VISTA</div>
<div class="hud-value" id="hudCamera" style="font-size:12px;color:#ff00aa">CHASE</div>
</div>
<div id="hud-bottom" class="hud-panel">
W/S: Pitch | A/D: Roll | Q/E: Yaw | Shift/Ctrl: Throttle | G: Carrello | V: Vista | R: Reset
</div>
</div>

<div id="touch-controls">
<div class="tc-joystick" id="tc-stick"><div class="tc-knob" id="tc-knob"></div></div>
<div class="tc-btn" id="tc-throttle-up">THR+</div>
<div class="tc-btn" id="tc-throttle-down">THR-</div>
<div class="tc-btn" id="tc-camera">VISTA</div>
<div class="tc-btn" id="tc-gear">GEAR</div>
<div class="tc-btn" id="tc-reset">RESET</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ============================================================
// AUDIO ENGINE (Web Audio API)
// ============================================================
const AudioEngine = (() => {
  let ctx = null, master = null;
  let engineOsc1 = null, engineOsc2 = null, engineGain = null, engineFilter = null;
  let windGain = null, windFilter = null;
  let initialized = false;

  function init() {
    if (initialized) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.3;
    master.connect(ctx.destination);

    engineOsc1 = ctx.createOscillator();
    engineOsc1.type = 'sawtooth';
    engineOsc1.frequency.value = 60;
    engineOsc2 = ctx.createOscillator();
    engineOsc2.type = 'square';
    engineOsc2.frequency.value = 120;
    engineFilter = ctx.createBiquadFilter();
    engineFilter.type = 'lowpass';
    engineFilter.frequency.value = 500;
    engineFilter.Q.value = 1.5;
    engineGain = ctx.createGain();
    engineGain.gain.value = 0.15;
    engineOsc1.connect(engineFilter);
    engineOsc2.connect(engineFilter);
    engineFilter.connect(engineGain);
    engineGain.connect(master);
    engineOsc1.start();
    engineOsc2.start();

    const bufferSize = ctx.sampleRate * 2;
    const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuffer;
    noise.loop = true;
    windFilter = ctx.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.value = 800;
    windFilter.Q.value = 0.3;
    windGain = ctx.createGain();
    windGain.gain.value = 0;
    noise.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(master);
    noise.start();

    initialized = true;
  }

  function resume() {
    if (ctx && ctx.state === 'suspended') { ctx.resume().catch(() => {}); }
  }

  function setEngine(throttle, speed) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const freq = 40 + throttle * 140 + speed * 0.4;
    engineOsc1.frequency.setTargetAtTime(freq, now, 0.05);
    engineOsc2.frequency.setTargetAtTime(freq * 2.01, now, 0.05);
    engineFilter.frequency.setTargetAtTime(300 + throttle * 1500, now, 0.05);
    engineGain.gain.setTargetAtTime(0.08 + throttle * 0.25, now, 0.05);
  }

  function setWind(speed) {
    if (!ctx) return;
    const now = ctx.currentTime;
    const intensity = Math.min(1, speed / 180);
    windGain.gain.setTargetAtTime(intensity * 0.12, now, 0.1);
    windFilter.frequency.setTargetAtTime(400 + speed * 10, now, 0.1);
  }

  function gearTransit() {
    if (!ctx) return;
    resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(90, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.5);
    g.gain.setValueAtTime(0.1, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime + 0.75);
  }

  function impact() {
    if (!ctx) return;
    resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(120, ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.4);
    g.gain.setValueAtTime(0.35, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime + 0.65);
  }

  function stallWarning() {
    if (!ctx) return;
    resume();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'square';
    o.frequency.value = 800;
    g.gain.setValueAtTime(0.06, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
    o.connect(g); g.connect(master);
    o.start(); o.stop(ctx.currentTime + 0.16);
  }

  return { init, resume, setEngine, setWind, gearTransit, impact, stallWarning, get ctx() { return ctx; } };
})();

// ============================================================
// SCENA
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 700, 3000);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 6000);
camera.position.set(0, 10, 30);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('voloCanvas'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(150, 250, 100);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 1500;
sun.shadow.camera.left = -500;
sun.shadow.camera.right = 500;
sun.shadow.camera.top = 500;
sun.shadow.camera.bottom = -500;
scene.add(sun);
const hemi = new THREE.HemisphereLight(0x87ceeb, 0x2d6a4f, 0.5);
scene.add(hemi);

// TERRENO
const groundGeo = new THREE.PlaneGeometry(6000, 6000, 100, 100);
const groundMat = new THREE.MeshPhongMaterial({ color: 0x2d6a4f, flatShading: true });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1;
ground.receiveShadow = true;
scene.add(ground);

const runwayGeo = new THREE.PlaneGeometry(50, 600);
const runwayMat = new THREE.MeshPhongMaterial({ color: 0x2a2a2a });
const runway = new THREE.Mesh(runwayGeo, runwayMat);
runway.rotation.x = -Math.PI / 2;
runway.position.set(0, 0.01, -150);
runway.receiveShadow = true;
scene.add(runway);

for (let i = -260; i < 300; i += 40) {
  const stripe = new THREE.Mesh(
    new THREE.PlaneGeometry(3, 24),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  stripe.rotation.x = -Math.PI / 2;
  stripe.position.set(0, 0.02, i);
  scene.add(stripe);
}

const treeMat = new THREE.MeshPhongMaterial({ color: 0x1a4d2e, flatShading: true });
for (let i = 0; i < 180; i++) {
  const tree = new THREE.Mesh(
    new THREE.ConeGeometry(3 + Math.random() * 4, 8 + Math.random() * 10, 6),
    treeMat
  );
  tree.castShadow = true;
  const ang = Math.random() * Math.PI * 2;
  const rad = 250 + Math.random() * 2200;
  tree.position.set(Math.cos(ang) * rad, 5, Math.sin(ang) * rad);
  scene.add(tree);
}

// AEREO
const plane = new THREE.Group();
const fuselageGeo = new THREE.CylinderGeometry(0.55, 0.35, 5.5, 10);
fuselageGeo.rotateX(Math.PI / 2);
const fuselage = new THREE.Mesh(fuselageGeo, new THREE.MeshPhongMaterial({ color: 0xeeeeee, shininess: 40 }));
fuselage.castShadow = true;
plane.add(fuselage);

const noseGeo = new THREE.ConeGeometry(0.55, 1.4, 10);
noseGeo.rotateX(-Math.PI / 2);
const nose = new THREE.Mesh(noseGeo, new THREE.MeshPhongMaterial({ color: 0xff0040, shininess: 60 }));
nose.position.z = -3.4;
nose.castShadow = true;
plane.add(nose);

const cockpit = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 1.2), new THREE.MeshPhongMaterial({ color: 0x222244, shininess: 80 }));
cockpit.position.set(0, 0.3, -0.8);
plane.add(cockpit);

const wingMat = new THREE.MeshPhongMaterial({ color: 0xdddddd, side: THREE.DoubleSide, shininess: 20 });
const wing = new THREE.Mesh(new THREE.BoxGeometry(11, 0.12, 2.0), wingMat);
wing.position.set(0, -0.1, 0.2);
wing.castShadow = true;
plane.add(wing);

const aileronGeo = new THREE.BoxGeometry(2.5, 0.08, 0.5);
const aileronMat = new THREE.MeshPhongMaterial({ color: 0xcccccc });
const leftAileron = new THREE.Mesh(aileronGeo, aileronMat);
leftAileron.position.set(-3.5, -0.1, 1.1);
leftAileron.castShadow = true;
plane.add(leftAileron);
const rightAileron = new THREE.Mesh(aileronGeo, aileronMat);
rightAileron.position.set(3.5, -0.1, 1.1);
rightAileron.castShadow = true;
plane.add(rightAileron);

const tail = new THREE.Mesh(new THREE.BoxGeometry(4, 0.1, 1.0), wingMat);
tail.position.set(0, 0, 2.4);
tail.castShadow = true;
plane.add(tail);

const fin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.4, 1.1), wingMat);
fin.position.set(0, 0.7, 2.4);
fin.castShadow = true;
plane.add(fin);

const propGroup = new THREE.Group();
const propBladeGeo = new THREE.BoxGeometry(0.08, 3.2, 0.08);
const propMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
for (let i = 0; i < 2; i++) {
  const blade = new THREE.Mesh(propBladeGeo, propMat);
  blade.rotation.z = i * Math.PI / 2;
  propGroup.add(blade);
}
propGroup.position.z = -4.2;
plane.add(propGroup);

const gearGroup = new THREE.Group();
const gearMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
const wheelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
function createGearLeg(x, z, length) {
  const leg = new THREE.Group();
  const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, length, 6), gearMat);
  strut.position.y = -length / 2;
  strut.castShadow = true;
  leg.add(strut);
  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.14, 12), wheelMat);
  wheel.rotation.z = Math.PI / 2;
  wheel.position.y = -length;
  wheel.castShadow = true;
  leg.add(wheel);
  leg.position.set(x, -0.5, z);
  return leg;
}
gearGroup.add(createGearLeg(0, -2.3, 0.75));
gearGroup.add(createGearLeg(-1.6, 0.9, 0.85));
gearGroup.add(createGearLeg(1.6, 0.9, 0.85));
plane.add(gearGroup);
scene.add(plane);

// STATO
const state = {
  pos: new THREE.Vector3(0, 1.2, 100),
  pitch: 0, roll: 0, yaw: 0,
  throttle: 0, speed: 0,
  gearDown: true, gearTransit: 0,
  onGround: true, verticalSpeed: 0, stallTimer: 0
};

const keys = {};
let cameraMode = 0;

// Audio: init su primo gesto (iOS-safe)
let audioInitialized = false;
function initAudioOnce() {
  if (audioInitialized) return;
  audioInitialized = true;
  AudioEngine.init();
  AudioEngine.resume();
}
window.addEventListener('keydown', initAudioOnce, { once: true });
window.addEventListener('pointerdown', initAudioOnce, { once: true });
window.addEventListener('touchstart', initAudioOnce, { once: true, passive: true });

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyV') cameraMode = (cameraMode + 1) % 2;
  if (e.code === 'KeyR') resetFlight();
  if (e.code === 'KeyG') toggleGear();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function resetFlight() {
  state.pos.set(0, 1.2, 100);
  state.pitch = 0; state.roll = 0; state.yaw = 0;
  state.throttle = 0; state.speed = 0;
  state.gearDown = true; state.gearTransit = 0;
  state.onGround = true; state.verticalSpeed = 0; state.stallTimer = 0;
  gearGroup.position.y = 0;
  gearGroup.visible = true;
  document.getElementById('stall-warning').classList.remove('active');
}

function toggleGear() {
  if (state.onGround) return;
  state.gearDown = !state.gearDown;
  state.gearTransit = 1.0;
  AudioEngine.gearTransit();
}

// Touch
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
if (isTouch) document.getElementById('touch-controls').classList.add('active');

const stick = document.getElementById('tc-stick');
const knob = document.getElementById('tc-knob');
let stickActive = false, stickId = null;
let touchPitch = 0, touchRoll = 0;

function stickMove(clientX, clientY) {
  const rect = stick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = (clientX - cx) / (rect.width / 2);
  let dy = (clientY - cy) / (rect.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  touchRoll = dx; touchPitch = -dy;
  knob.style.transform = `translate(${dx * 35}px, ${dy * 35}px)`;
}
stick.addEventListener('pointerdown', e => { e.preventDefault(); stickActive = true; stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e.clientX, e.clientY); });
stick.addEventListener('pointermove', e => { if (!stickActive || e.pointerId !== stickId) return; e.preventDefault(); stickMove(e.clientX, e.clientY); });
stick.addEventListener('pointerup', e => { if (e.pointerId !== stickId) return; stickActive = false; stickId = null; touchPitch = 0; touchRoll = 0; knob.style.transform = 'translate(0,0)'; });
stick.addEventListener('pointercancel', () => { stickActive = false; stickId = null; touchPitch = 0; touchRoll = 0; knob.style.transform = 'translate(0,0)'; });

let touchThrottleDir = 0;
function bindHold(el, dir) {
  el.addEventListener('pointerdown', e => { e.preventDefault(); touchThrottleDir = dir; el.classList.add('pressed'); });
  el.addEventListener('pointerup', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
  el.addEventListener('pointercancel', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
  el.addEventListener('pointerleave', () => { touchThrottleDir = 0; el.classList.remove('pressed'); });
}
bindHold(document.getElementById('tc-throttle-up'), 1);
bindHold(document.getElementById('tc-throttle-down'), -1);

document.getElementById('tc-camera').addEventListener('pointerdown', e => { e.preventDefault(); cameraMode = (cameraMode + 1) % 2; });
document.getElementById('tc-gear').addEventListener('pointerdown', e => { e.preventDefault(); toggleGear(); });
document.getElementById('tc-reset').addEventListener('pointerdown', e => { e.preventDefault(); resetFlight(); });

// LOOP
const clock = new THREE.Clock();
const _forward = new THREE.Vector3();
const _euler = new THREE.Euler(0, 0, 0, 'YXZ');
const _chaseOffset = new THREE.Vector3();
const _cockpitOffset = new THREE.Vector3();
const _lookTarget = new THREE.Vector3();
let firstFrame = true;
let stallWarnCooldown = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  let inPitch = 0, inRoll = 0, inYaw = 0;
  if (keys['KeyW']) inPitch += 1;
  if (keys['KeyS']) inPitch -= 1;
  if (keys['KeyA']) inRoll += 1;
  if (keys['KeyD']) inRoll -= 1;
  if (keys['KeyQ']) inYaw += 1;
  if (keys['KeyE']) inYaw -= 1;
  if (keys['ShiftLeft'] || keys['ShiftRight']) state.throttle = Math.min(1, state.throttle + 0.35 * dt);
  if (keys['ControlLeft'] || keys['ControlRight']) state.throttle = Math.max(0, state.throttle - 0.35 * dt);

  inPitch += touchPitch;
  inRoll += touchRoll;
  if (touchThrottleDir > 0) state.throttle = Math.min(1, state.throttle + 0.35 * dt);
  if (touchThrottleDir < 0) state.throttle = Math.max(0, state.throttle - 0.35 * dt);

  state.pitch += inPitch * 0.85 * dt;
  state.roll += inRoll * 1.1 * dt;
  state.yaw += inYaw * 0.55 * dt;
  state.pitch = Math.max(-1.2, Math.min(1.2, state.pitch));
  state.roll = Math.max(-1.5, Math.min(1.5, state.roll));
  if (Math.abs(inRoll) < 0.05 && Math.abs(state.roll) > 0.02) state.roll -= state.roll * 1.8 * dt;

  _euler.set(state.pitch, state.yaw, 0);
  _forward.set(0, 0, -1).applyEuler(_euler);

  const targetSpeed = state.throttle * 220;
  state.speed += (targetSpeed - state.speed) * 0.7 * dt;
  const speedMs = state.speed / 3.6;

  if (state.onGround) {
    if (state.speed > 85 && state.pitch > 0.08) {
      state.onGround = false;
      state.pos.y += 0.6;
    } else {
      state.pos.y = 1.2;
      state.speed = Math.max(0, state.speed - 35 * dt);
    }
  }

  if (!state.onGround) {
    state.pos.x += _forward.x * speedMs * dt;
    state.pos.z += _forward.z * speedMs * dt;

    const climbRate = Math.sin(state.pitch) * speedMs * 0.65;
    const lift = state.speed * 0.07 * Math.cos(state.roll);
    const gravity = 9.8 * (1 - state.throttle * 0.92);
    state.verticalSpeed = climbRate + lift - gravity;
    state.pos.y += state.verticalSpeed * dt;

    const isStalling = state.speed < 60 && state.pitch > 0.3;
    if (isStalling) {
      state.stallTimer += dt;
      if (state.stallTimer > 0.3) {
        document.getElementById('stall-warning').classList.add('active');
        if (stallWarnCooldown <= 0) {
          AudioEngine.stallWarning();
          stallWarnCooldown = 0.8;
        }
        state.verticalSpeed -= 15 * dt;
        state.pos.y += state.verticalSpeed * dt;
      }
    } else {
      state.stallTimer = 0;
      document.getElementById('stall-warning').classList.remove('active');
    }
    stallWarnCooldown -= dt;

    if (state.pos.y <= 1.2) {
      state.pos.y = 1.2;
      if (state.verticalSpeed < -3) {
        AudioEngine.impact();
        state.speed *= 0.4;
      }
      state.onGround = true;
      state.pitch = Math.max(state.pitch, 0);
      document.getElementById('stall-warning').classList.remove('active');
    }
    if (state.pos.y > 2500) { state.pos.y = 2500; state.pitch = Math.min(state.pitch, 0); }
  }

  if (state.gearTransit > 0) {
    state.gearTransit -= dt * 1.2;
    const t = 1 - Math.max(0, state.gearTransit);
    if (state.gearDown) {
      gearGroup.position.y = -t * 2.5;
      gearGroup.visible = true;
    } else {
      gearGroup.position.y = -2.5 + t * 2.5;
      if (state.gearTransit <= 0) gearGroup.visible = false;
    }
  }

  plane.position.copy(state.pos);
  plane.rotation.set(state.pitch, state.yaw, state.roll, 'YXZ');
  propGroup.rotation.z += (0.3 + state.throttle * 35) * dt;

  leftAileron.rotation.x = state.roll * 0.4;
  rightAileron.rotation.x = -state.roll * 0.4;

  AudioEngine.setEngine(state.throttle, state.speed);
  AudioEngine.setWind(state.speed);

  if (cameraMode === 0) {
    _euler.set(state.pitch * 0.5, state.yaw, 0);
    _chaseOffset.set(0, 4.5, 16).applyEuler(_euler);
    _lookTarget.copy(state.pos).add(_chaseOffset);
    camera.position.lerp(_lookTarget, 0.07);
    camera.lookAt(state.pos);
  } else {
    _euler.set(state.pitch, state.yaw, 0);
    _cockpitOffset.set(0, 1.0, -0.5).applyEuler(_euler);
    camera.position.copy(state.pos).add(_cockpitOffset);
    _lookTarget.copy(state.pos).addScaledVector(_forward, 30);
    camera.lookAt(_lookTarget);
  }

  document.getElementById('hudSpeed').textContent = Math.round(state.speed);
  document.getElementById('hudAlt').textContent = Math.round(state.pos.y);
  document.getElementById('hudHeading').textContent = Math.round(((state.yaw * 180 / Math.PI) % 360 + 360) % 360);
  document.getElementById('hudThrottle').style.width = (state.throttle * 100) + '%';
  document.getElementById('hudCamera').textContent = cameraMode === 0 ? 'CHASE' : 'COCKPIT';

  const gearEl = document.getElementById('gear-indicator');
  if (state.gearTransit > 0) { gearEl.className = 'transit'; gearEl.textContent = 'IN MOVIMENTO'; }
  else if (state.gearDown) { gearEl.className = 'down'; gearEl.textContent = 'GIU'; }
  else { gearEl.className = 'up'; gearEl.textContent = 'SU'; }

  renderer.render(scene, camera);

  if (firstFrame) {
    document.getElementById('loading').style.display = 'none';
    firstFrame = false;
  }
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

plane.position.copy(state.pos);
animate();
</script>
</body>
</html>
