
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Test Audio</title>
<style>
body{background:#04060d;color:#fff;font-family:system-ui;padding:40px;text-align:center}
button{background:#302351;color:#fff;border:2px solid #69e4ed;padding:16px 32px;font-size:18px;border-radius:12px;margin:8px;cursor:pointer}
button:active{background:#69e4ed;color:#10212b}
#status{margin-top:20px;font-size:14px;color:#94a3b8}
</style>
</head>
<body>
<h1>Test Audio</h1>
<p>Clicca un pulsante per sentire un tono</p>
<button onclick="play(432)">432 Hz</button>
<button onclick="play(528)">528 Hz</button>
<button onclick="stop()">Stop</button>
<div id="status">Nessun audio</div>

<script>
let ctx = null;
let osc = null;
let gain = null;

function play(freq) {
  try {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (ctx.state === 'suspended') {
      ctx.resume();
    }
    if (osc) { osc.stop(); osc = null; }
    if (gain) { gain.disconnect(); gain = null; }
    
    gain = ctx.createGain();
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.connect(ctx.destination);
    
    osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    osc.start();
    
    document.getElementById('status').textContent = 'Playing ' + freq + ' Hz — ctx.state: ' + ctx.state;
    document.getElementById('status').style.color = '#91edbd';
  } catch(e) {
    document.getElementById('status').textContent = 'ERRORE: ' + e.message;
    document.getElementById('status').style.color = '#ff6b6b';
    console.error(e);
  }
}

function stop() {
  if (osc) { osc.stop(); osc = null; }
  if (gain) { gain.disconnect(); gain = null; }
  document.getElementById('status').textContent = 'Fermato';
  document.getElementById('status').style.color = '#94a3b8';
}
</script>
</body>
</html>
