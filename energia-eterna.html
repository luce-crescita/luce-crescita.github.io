
<script>
  "use strict";

  // Stato del Simulatore
  const maxCapacity = 500; // kWh
  let currentStorage = 300; // kWh iniziali (60%)
  let autoSimInterval = null;
  let cycleCount = 1;

  // Riferimenti DOM
  const prodVal = document.getElementById('prodVal');
  const loadVal = document.getElementById('loadVal');
  const balanceVal = document.getElementById('balanceVal');
  const batteryPercent = document.getElementById('batteryPercent');
  const batteryCapacityLabel = document.getElementById('batteryCapacityLabel');
  const batteryBar = document.getElementById('batteryBar');
  const consoleLog = document.getElementById('consoleLog');
  const autoToggleBtn = document.getElementById('autoToggleBtn');

  // Sliders
  const solarSlider = document.getElementById('solarSlider');
  const windSlider = document.getElementById('windSlider');
  const cityLoadSlider = document.getElementById('cityLoadSlider');
  const solarDisp = document.getElementById('solarDisp');
  const windDisp = document.getElementById('windDisp');
  const demandDisp = document.getElementById('demandDisp');

  // Aggiorna etichette slider in tempo reale
  solarSlider.addEventListener('input', () => solarDisp.innerText = solarSlider.value + "%");
  windSlider.addEventListener('input', () => windDisp.innerText = windSlider.value + "%");
  cityLoadSlider.addEventListener('input', () => demandDisp.innerText = cityLoadSlider.value + " kW");

  function logMessage(text, color = 'var(--neon-cyan)') {
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('p');
    entry.style.color = color;
    entry.style.margin = "4px 0";
    entry.innerText = `[${time}] ${text}`;
    consoleLog.prepend(entry);
    
    // Mantiene pulita la console rimuovendo i log troppo vecchi
    if (consoleLog.childNodes.length > 20) {
      consoleLog.removeChild(consoleLog.lastChild);
    }
  }

  function simulateCycle() {
    // Calcolo produzione basato sugli slider con leggera variazione naturale
    const solarFactor = (parseInt(solarSlider.value, 10) / 100) * (40 + Math.random() * 10);
    const windFactor = (parseInt(windSlider.value, 10) / 100) * (30 + Math.random() * 10);
    const totalProd = Math.round(solarFactor + windFactor);

    // Carico della città con micro-variazioni costanti
    const baseDemand = parseInt(cityLoadSlider.value, 10);
    const totalLoad = Math.max(10, Math.round(baseDemand + (Math.random() * 8 - 4)));

    const net = totalProd - totalLoad;

    let logText = "";
    let logColor = "var(--neon-cyan)";

    // Gestione della carica e scarica dell'accumulatore fisico
    if (net > 0) {
      const stored = Math.min(maxCapacity - currentStorage, net);
      currentStorage += stored;
      const surplusDissipated = net - stored;

      logText = `Ciclo #${cycleCount}: Surplus +${net} kW. Stoccati ${stored} kWh nell'accumulatore.`;
      logColor = "#10b981"; // Verde successo
      
      if (surplusDissipated > 0) {
        logText += ` Rete satura: ${surplusDissipated} kW dissipati in sicurezza.`;
        logColor = "var(--neon-cyan)";
      }
    } else if (net < 0) {
      const deficit = Math.abs(net);
      const drawn = Math.min(currentStorage, deficit);
      currentStorage -= drawn;
      const missingEnergy = deficit - drawn;

      if (missingEnergy > 0) {
        logText = `Ciclo #${cycleCount}: Deficit critico di ${deficit} kW! Riserve esaurite. Mancano ${missingEnergy} kW alla città.`;
        logColor = "#ff3366"; // Rosso allerta
      } else {
        logText = `Ciclo #${cycleCount}: Deficit di ${deficit} kW compensato interamente attingendo dall'accumulatore centrale.`;
        logColor = "var(--neon-amber)"; // Ambra avviso
      }
    } else {
      logText = `Ciclo #${cycleCount}: Bilanciamento perfetto. Produzione e consumi equivalgono a ${totalProd} kW.`;
      logColor = "#f5f7ff";
    }

    // Calcolo e aggiornamento grafico dei dati e della barra di caricamento
    const pct = Math.round((currentStorage / maxCapacity) * 100);
    
    prodVal.innerText = totalProd + " kW";
    loadVal.innerText = totalLoad + " kW";
    balanceVal.innerText = (net >= 0 ? "+" : "") + net + " kW";
    balanceVal.style.color = net >= 0 ? "#10b981" : "#ff3366";
    
    batteryPercent.innerText = pct + "%";
    batteryCapacityLabel.innerText = `${Math.round(currentStorage)} / ${maxCapacity} kWh`;
    batteryBar.style.width = pct + "%";

    // Cambia colore alla barra della batteria a seconda del livello critico
    if (pct < 20) {
      batteryBar.style.backgroundColor = "#ff3366";
    } else if (pct < 50) {
      batteryBar.style.backgroundColor = "var(--neon-amber)";
    } else {
      batteryBar.style.backgroundColor = "#10b981";
    }

    logMessage(logText, logColor);
    cycleCount++;
  }

  function toggleAutoSim() {
    if (autoSimInterval) {
      // Ferma il ciclo automatico
      clearInterval(autoSimInterval);
      autoSimInterval = null;
      autoToggleBtn.innerText = "▶ Avvia Auto-Ciclo";
      autoToggleBtn.className = "btn btn-secondary";
      logMessage("Simulazione continua disattivata.", "var(--text-muted)");
    } else {
      // Avvia il ciclo ad intervalli regolari (ogni 3 secondi un nuovo ciclo)
      simulateCycle();
      autoSimInterval = setInterval(simulateCycle, 3000);
      autoToggleBtn.innerText = "■ Ferma Auto-Ciclo";
      autoToggleBtn.className = "btn btn-primary";
      logMessage("Simulazione in tempo reale attivata. Frequenza di campionamento: 3000ms.", "var(--neon-purple)");
    }
  }
</script>
